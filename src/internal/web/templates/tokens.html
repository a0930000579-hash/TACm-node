{% extends "base.html" %}
{% block title %}TAC Token Studio{% endblock %}
{% block content %}
<style>
  .tk-wrap{max-width:1100px;margin:0 auto}
  .tk-head{background:linear-gradient(135deg,#f7f8fb,#f2f4f9);border:1px solid #e2e6ee;border-radius:16px;padding:18px 20px;color:#14161a;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .tk-head .logo{width:48px;height:48px;border-radius:12px;background:#68BE8D;color:#f7f8fb;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:none}
  .tk-head h2{margin:0;font-size:20px;font-weight:800;color:#68BE8D}
  .tk-head .sub{font-size:12px;opacity:.8;margin-top:2px}
  .tk-stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .tk-stats span{background:rgba(104,190,141,.12);border:1px solid rgba(104,190,141,.35);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:#68BE8D}
  .tk-grid{display:grid;grid-template-columns:340px 1fr 1fr;gap:14px;align-items:start}
  @media (max-width:980px){.tk-grid{grid-template-columns:1fr}}
  .tk-card{background:#f7f8fb;border:1px solid #e2e6ee;border-radius:14px;padding:16px;margin-bottom:14px}
  .tk-card h3{margin:0 0 12px;font-size:14px;color:#68BE8D;font-weight:800;display:flex;align-items:center;gap:8px}
  .tk-card h3 .hint{font-size:11px;color:#5d6778;font-weight:500;margin-left:auto}
  .tk-field{margin-bottom:10px}
  .tk-field label{display:block;font-size:12px;color:#5d6778;margin-bottom:4px}
  .tk-field input{width:100%;box-sizing:border-box;background:#f2f4f9;border:1px solid #e2e6ee;border-radius:10px;color:#14161a;padding:10px 12px;font-size:13px;font-family:ui-monospace,monospace}
  .tk-btn{width:100%;background:#68BE8D;color:#f7f8fb;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
  .tk-btn.ghost{background:transparent;border:1px solid #e2e6ee;color:#14161a;font-weight:700}
  .tk-btn.sm{width:auto;padding:6px 14px;font-size:12px;border-radius:8px}
  .tk-btn.green{background:rgba(14,203,129,.15);color:#0ecb81;border:1px solid rgba(14,203,129,.4)}
  .tk-msg{margin-top:10px;font-size:12px;color:#5d6778;min-height:16px;word-break:break-all}
  .tk-msg.ok{color:#0ecb81}
  .tk-msg.err{color:#f6465d}
  .tk-item{border-bottom:1px solid #e2e6ee;padding:12px 0;cursor:pointer}
  .tk-item:last-child{border-bottom:none}
  .tk-item.sel .tk-item-top{border-left:3px solid #68BE8D;padding-left:8px}
  .tk-item-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tk-sym{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;border-radius:10px;background:rgba(104,190,141,.15);color:#68BE8D;font-weight:800;font-size:13px;padding:0 8px;flex:none}
  .tk-item .nm{font-size:13px;font-weight:700;color:#14161a}
  .tk-item .addr{font-size:11px;color:#5d6778;word-break:break-all;margin-top:2px}
  .tk-item .sup{font-size:12px;color:#68BE8D;font-weight:700;margin-left:auto;text-align:right}
  .tk-empty{text-align:center;color:#5e6673;padding:30px 0;font-size:13px}
  .tk-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e2e6ee;font-size:13px}
  .tk-row:last-child{border-bottom:none}
  .tk-row .k{color:#5d6778}
  .tk-row .v{color:#14161a;font-weight:700;font-family:ui-monospace,monospace;word-break:break-all;text-align:right}
  .tk-row .v.gold{color:#68BE8D}
  .tk-copy{cursor:pointer;color:#68BE8D;font-size:11px;border:1px solid rgba(104,190,141,.35);border-radius:6px;padding:2px 8px;margin-left:6px;background:transparent}
</style>

<div class="tk-wrap">
  <div class="tk-head">
    <div class="logo"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg></div>
    <div>
      <h2 data-i18n="tokens.title">代幣工作室</h2>
      <div class="sub" data-i18n="tokens.sub">鏈上標準代幣（ERC-20 風格）· 節點官方發行 · 即時出塊</div>
    </div>
    <div class="tk-stats">
      <span id="tkCount" data-i18n="tokens.count">0 個代幣</span>
    </div>
  </div>

  <div class="tk-grid">
    <div>
      <div class="tk-card">
        <h3 data-i18n="tokens.deploy">發行代幣</h3>
        <div class="tk-field"><label data-i18n="tokens.name">名稱（≤32 字元）</label><input id="tkName" placeholder="e.g. My Token"></div>
        <div class="tk-field"><label data-i18n="tokens.symbol">代號（≤32 字元）</label><input id="tkSymbol" placeholder="e.g. MTK"></div>
        <div class="tk-field"><label data-i18n="tokens.supply">總供應量</label><input id="tkSupply" placeholder="e.g. 1000000" inputmode="numeric"></div>
        <button class="tk-btn" onclick="tkDeploy()" data-i18n="tokens.deploy_btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg> 發行</button>
        <div class="tk-msg" id="tkDMsg"></div>
      </div>

      <div class="tk-card">
        <h3 data-i18n="tokens.detail">代幣詳情</h3>
        <div id="tkDetail"><div class="tk-empty" data-i18n="tokens.select">← 從列表選擇代幣</div></div>
      </div>
    </div>

    <div class="tk-card" style="grid-column:span 1">
      <h3 data-i18n="tokens.list">已發行代幣<button class="tk-btn sm ghost" style="margin-left:auto" onclick="tkLoad()" data-i18n="common.refresh">刷新</button></h3>
      <div id="tkList"><div class="tk-empty" data-i18n="common.loading">載入中…</div></div>
    </div>
  </div>
</div>

<script>
(function () {
  var api = window.TAC_RPC || '';
  var sel = '';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { try { var x = parseFloat(n); if (isNaN(x)) return n; if (x >= 1e9) return (x / 1e9).toFixed(2) + 'B'; if (x >= 1e6) return (x / 1e6).toFixed(2) + 'M'; if (x >= 1e3) return (x / 1e3).toFixed(2) + 'K'; return String(x); } catch (e) { return n; } }

  function guestAddr() {
    try { var a = localStorage.getItem('tac_guest_addr'); if (a && a.indexOf('tx0') === 0) { return Promise.resolve(a); } } catch (e) {}
    if (window.ensureGuestAddr) { return window.ensureGuestAddr().catch(function () { return ''; }); }
    return Promise.resolve('');
  }

  function renderList(d) {
    var el = $('tkList');
    var arr = (d && d.contracts) || [];
    $('tkCount').textContent = arr.length + (window.TAC_I18N && TAC_I18N.cur() === 'en' ? ' tokens' : ' 個代幣');
    if (!arr.length) { el.innerHTML = '<div class="tk-empty">' + (window.TAC_I18N && TAC_I18N.cur() === 'en' ? 'No tokens issued yet' : '尚無代幣') + '</div>'; return; }
    el.innerHTML = arr.map(function (c) {
      var nm = c.name || '(no name)';
      var sym = c.symbol || '?';
      return '<div class="tk-item' + (c.address === sel ? ' sel' : '') + '" onclick="tkSelect(\'' + c.address + '\')">' +
        '<div class="tk-item-top"><span class="tk-sym">' + esc(sym.slice(0, 6)) + '</span>' +
        '<div><div class="nm">' + esc(nm) + '</div><div class="addr">' + esc(c.address) + '</div></div>' +
        '<span class="sup">' + fmt(c.supply) + '</span></div></div>';
    }).join('');
  }

  function renderDetail(info) {
    var el = $('tkDetail');
    if (!info || !info.ok) { el.innerHTML = '<div class="tk-empty">' + (window.TAC_I18N && TAC_I18N.cur() === 'en' ? 'Select a token' : '← 從列表選擇代幣') + '</div>'; return; }
    el.innerHTML =
      '<div class="tk-row"><span class="k" data-i18n="tokens.name">名稱</span><span class="v">' + esc(info.name || '-') + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="tokens.symbol">代號</span><span class="v">' + esc(info.symbol || '-') + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="tokens.supply">總供應量</span><span class="v gold">' + fmt(info.supply) + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="tokens.mybal">我的餘額</span><span class="v gold">' + fmt(info.balance) + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="tokens.contract">合約地址</span><span class="v">' + esc(info.address) + '<button class="tk-copy" onclick="tkCopy(\'' + esc(info.address) + '\')" data-i18n="common.copy">複製</button></span></div>' +
      '<div class="tk-field" style="margin-top:12px"><label data-i18n="tokens.to">轉帳至（tx0 地址）</label><input id="tkTo" placeholder="tx0..."></div>' +
      '<div class="tk-field"><label data-i18n="tokens.amount">數量</label><input id="tkAmt" placeholder="e.g. 100" inputmode="numeric"></div>' +
      '<button class="tk-btn green" onclick="tkTransfer(\'' + esc(info.address) + '\')" data-i18n="tokens.transfer">⇄ 代簽轉帳</button>' +
      '<div class="tk-msg" id="tkTMsg"></div>';
  }

  function loadDetail() {
    if (!sel) return;
    guestAddr().then(function (addr) {
      fetch(api + '/contract/erc20/' + sel + '?holder=' + encodeURIComponent(addr), { cache: 'no-store' })
        .then(function (r) { return r.json().catch(function () { return null; }); })
        .then(function (d) { renderDetail(d); })
        .catch(function () { /* 忽略 */ });
    });
  }

  window.tkLoad = function () {
    fetch(api + '/contract/list', { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) { renderList(d); if (sel) loadDetail(); })
      .catch(function () { $('tkList').innerHTML = '<div class="tk-empty">network error</div>'; });
  };

  window.tkSelect = function (addr) { sel = addr; tkLoad(); };

  window.tkCopy = function (v) {
    try { navigator.clipboard.writeText(v); } catch (e) { window.prompt('Copy:', v); }
  };

  window.tkDeploy = function () {
    var msg = $('tkDMsg');
    msg.className = 'tk-msg'; msg.textContent = '...';
    var body = {
      name: $('tkName').value.trim(),
      symbol: $('tkSymbol').value.trim(),
      supply: $('tkSupply').value.trim()
    };
    if (!body.supply || parseFloat(body.supply) <= 0) { msg.className = 'tk-msg err'; msg.textContent = window.TAC_I18N && TAC_I18N.cur() === 'en' ? 'Supply required' : '請輸入總供應量'; return; }
    fetch(api + '/contract/deploy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), cache: 'no-store'
    }).then(function (r) { return r.json().catch(function () { return null; }); }).then(function (d) {
      if (d && d.ok) {
        msg.className = 'tk-msg ok';
        msg.textContent = (window.TAC_I18N && TAC_I18N.cur() === 'en' ? 'Issued. Contract: ' : '已發行。合約：') + d.contract_address;
        sel = d.contract_address;
        setTimeout(tkLoad, 1500);
      } else {
        msg.className = 'tk-msg err'; msg.textContent = (d && d.error) || 'failed';
      }
    }).catch(function () { msg.className = 'tk-msg err'; msg.textContent = 'network error'; });
  };

  window.tkTransfer = function (contract) {
    var msg = $('tkTMsg');
    if (!msg) return;
    msg.className = 'tk-msg'; msg.textContent = '...';
    var body = {
      contract: contract,
      to: $('tkTo').value.trim(),
      amount: $('tkAmt').value.trim()
    };
    if (!body.to || parseFloat(body.amount) <= 0) { msg.className = 'tk-msg err'; msg.textContent = 'invalid input'; return; }
    fetch(api + '/contract/erc20/transfer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), cache: 'no-store'
    }).then(function (r) { return r.json().catch(function () { return null; }); }).then(function (d) {
      if (d && d.ok) {
        msg.className = 'tk-msg ok';
        msg.textContent = 'tx ' + d.tx_hash;
        setTimeout(loadDetail, 1500);
      } else {
        msg.className = 'tk-msg err'; msg.textContent = (d && d.error) || 'failed';
      }
    }).catch(function () { msg.className = 'tk-msg err'; msg.textContent = 'network error'; });
  };

  tkLoad();
  setInterval(tkLoad, 8000);
})();
</script>
{% endblock %}
