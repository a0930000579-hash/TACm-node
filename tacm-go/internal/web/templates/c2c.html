{% extends "base.html" %}
{% block title %}TAC C2C · OTC{% endblock %}
{% block content %}
<style>
.bn{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f7f8fb;color:#14161a}
.c2c-wrap{max-width:1180px;margin:0 auto;padding:16px 12px 88px}
.c2c-tabs{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.c2c-tabs .t{white-space:nowrap;padding:10px 16px;border-radius:8px;background:#f2f4f9;color:#5d6778;font-size:14px;cursor:pointer;flex:1;text-align:center;max-width:200px}
.c2c-tabs .t.on{background:#68BE8D;color:#f7f8fb;font-weight:700}
.c2c-row{display:flex;gap:12px;flex-wrap:wrap}
.c2c-col{flex:1;min-width:320px}
.card{background:#f2f4f9;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e2e6ee}
.card h3{margin:0 0 10px;font-size:15px;color:#68BE8D}
.sub{font-size:13px;color:#5d6778;line-height:1.7}
.bn-btn{background:#68BE8D;color:#f7f8fb;border:none;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;min-width:44px}
.bn-btn.gray{background:#e2e6ee;color:#14161a}
.bn-btn.red{background:#f6465d;color:#fff}
.inp{background:#f7f8fb;border:1px solid #e2e6ee;border-radius:8px;color:#14161a;padding:10px 12px;font-size:14px;box-sizing:border-box;min-height:44px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:#e2e6ee;color:#5d6778}
.chip.g{background:#0ecb81;color:#fff}.chip.r{background:#f6465d;color:#fff}.chip.y{background:#68BE8D;color:#f7f8fb}
.seg{display:flex;gap:8px;margin:8px 0}
.seg .s{flex:1;text-align:center;padding:8px;border-radius:8px;background:#f7f8fb;border:1px solid #e2e6ee;cursor:pointer;font-size:13px;color:#5d6778}
.seg .s.on{background:#68BE8D;color:#f7f8fb;font-weight:700;border-color:#68BE8D}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order-steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:#5d6778;margin-top:8px}
.order-steps .st{padding:4px 10px;border-radius:20px;background:#e2e6ee}
.order-steps .st.done{background:#0ecb81;color:#fff}
.order-steps .st.now{background:#68BE8D;color:#f7f8fb;font-weight:700}
</style>
<div class="c2c-wrap bn">
  <h2 style="margin:0 0 4px;font-size:20px">C2C 場外交易</h2>
  <div class="sub">法幣直接買賣加密貨幣 · 廣告主擔保交易 · 支持 TWD/CNY/USD/HKD/JPY</div>
  <div class="c2c-tabs">
    <div class="t on" onclick="sw2('mkt',this)">買幣 / 賣幣</div>
    <div class="t" onclick="sw2('my',this)">我的訂單</div>
    <div class="t" onclick="sw2('pub',this)">發佈廣告</div>
    <div class="t" onclick="sw2('myads',this)">我的廣告</div>
  </div>

  <div id="pan-mkt">
    <div class="card">
      <div class="seg">
        <div class="s on" id="seg-side-buy" onclick="setSide('buy')">我要買</div>
        <div class="s" id="seg-side-sell" onclick="setSide('sell')">我要賣</div>
      </div>
      <div class="grid2" style="margin-bottom:8px">
        <select class="inp" id="f-asset"><option>USDT</option><option>TiUSD</option><option>TACm</option></select>
        <select class="inp" id="f-fiat"><option>TWD</option><option>CNY</option><option>USD</option><option>HKD</option><option>JPY</option></select>
      </div>
      <button class="bn-btn" style="width:100%" onclick="loadAds()">查詢廣告</button>
    </div>
    <div id="ad-list"></div>
  </div>

  <div id="pan-my" style="display:none">
    <div class="card"><h3>我的 C2C 訂單</h3><div id="my-orders"></div></div>
  </div>

  <div id="pan-pub" style="display:none">
    <div class="card">
      <h3>發佈 C2C 廣告</h3>
      <div class="seg">
        <div class="s on" id="pub-side-buy" onclick="setPubSide('buy')">我要買（收幣）</div>
        <div class="s" id="pub-side-sell" onclick="setPubSide('sell')">我要賣（售幣）</div>
      </div>
      <div class="grid2">
        <select class="inp" id="pub-asset"><option>USDT</option><option>TiUSD</option><option>TACm</option></select>
        <select class="inp" id="pub-fiat"><option>TWD</option><option>CNY</option><option>USD</option><option>HKD</option><option>JPY</option></select>
        <input class="inp" id="pub-price" type="number" placeholder="unit price (fiat/coin)">
        <input class="inp" id="pub-min" type="number" placeholder="min amount (coin)">
        <input class="inp" id="pub-max" type="number" placeholder="max amount (coin)">
        <select class="inp" id="pub-pay"><option>銀行轉帳</option><option>支付寶</option><option>微信支付</option><option>PayPal</option><option>LINE Pay</option><option>街口支付</option></select>
      </div>
      <button class="bn-btn" style="width:100%;margin-top:10px" onclick="pubAd()">發佈廣告</button>
    </div>
  </div>

  <div id="pan-myads" style="display:none">
    <div class="card"><h3>我的廣告</h3><div id="my-ads"></div></div>
  </div>
</div>
<script>
let W=null, SIDE='buy', PSIDE='buy';
function g(ab){return ab==='A'?(localStorage.getItem('ta')||TAC_TE('')):(localStorage.getItem('tb')||TAC_TE(''))}
function wInfo(a){return fetch('/api/wallet/info?address='+a).then(r=>r.json()).catch(()=>null)}
function balOf(d,a){return d?(d[a+'_raw']?parseFloat(d[a+'_raw'])/1e6:(parseFloat(d[a]||0))):0}
async function cur(){ const a=g('A')||g('B'); if(a){const d=await wInfo(a); W={addr:a,bal:d};} }
function sw2(p,el){document.querySelectorAll('.c2c-tabs .t').forEach(t=>t.classList.remove('on'));el.classList.add('on');
  ['mkt','my','pub','myads'].forEach(x=>document.getElementById('pan-'+x).style.display=(x===p?'':'none'));
  if(p==='my')loadMyOrders(); if(p==='myads')loadMyAds();}
function setSide(v){SIDE=v;document.getElementById('seg-side-buy').classList.toggle('on',v==='buy');document.getElementById('seg-side-sell').classList.toggle('on',v==='sell');}
function setPubSide(v){PSIDE=v;document.getElementById('pub-side-buy').classList.toggle('on',v==='buy');document.getElementById('pub-side-sell').classList.toggle('on',v==='sell');}
async function loadAds(){
  const a=document.getElementById('f-asset').value, f=document.getElementById('f-fiat').value;
  const el=document.getElementById('ad-list');
  try{
    const r=await fetch(`/api/c2c/ads?asset=${a}&fiat=${f}&side=${SIDE}`); const d=await r.json();
    el.innerHTML = (d.ads||[]).map(ad=>{
      const isSell=ad.side==='sell';
      return `<div class="card">
        <div class="sub" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><b style="color:${isSell?'#f6465d':'#0ecb81'}">${isSell?'售':'買'} ${ad.asset}/${ad.fiat}</b><span class="chip">${ad.price.toFixed(2)} ${ad.fiat}</span></div>
        <div class="sub">限額 ${ad.min_amount}–${ad.max_amount} ${ad.asset} · 完成 ${ad.completed_orders} 單 · 評分 ${ad.rating.toFixed(1)}</div>
        <div class="sub">支付：${(ad.payment_methods||[]).map(m=>'<span class="chip">'+m+'</span>').join(' ')}</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input class="inp" id="amt-${ad.id}" type="number" placeholder="amount ${ad.asset}" style="flex:1">
          <select class="inp" id="pay-${ad.id}" style="flex:1"><option>銀行轉帳</option><option>LINE Pay</option><option>街口支付</option><option>PayPal</option><option>支付寶</option><option>微信支付</option></select>
          <button class="bn-btn" style="flex:1" onclick="buy(${ad.id})">${isSell?'購買':'出售'}</button>
        </div>
      </div>`;
    }).join('')||'<div class="card sub">目前無有效廣告</div>';
  }catch(e){el.innerHTML='<div class="card sub">載入失敗</div>';}
}
async function buy(adid){
  if(!W){const r=await fetch('/api/wallet/new');const d=await r.json();W={addr:d.address,bal:{}};if(!g('A'))localStorage.setItem('ta',d.address);else localStorage.setItem('tb',d.address);}
  const amt=parseFloat(document.getElementById('amt-'+adid).value);
  if(!amt||amt<=0)return alert(TAC_TE('請輸入數量'));
  const pay=document.getElementById('pay-'+adid).value;
  const r=await fetch('/api/c2c/order-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad_id:adid,buyer:W.addr,amount:amt,payment_method:pay})});
  const d=await r.json();
  alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('下單失敗')));
  if(d.order_id){const oid=d.order_id;
    if(!confirm(TAC_TE('已創建訂單 ')+d.order_no+TAC_TE('。確認已完成法幣付款？')))return;
    const r2=await fetch('/api/c2c/order-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:oid,address:W.addr})});
    const d2=await r2.json(); alert(TAC_TE(d2.message)||(TAC_TE(d2.error)||TAC_TE('確認失敗'))); loadAds();}
}
async function pubAd(){
  if(!W){const r=await fetch('/api/wallet/new');const d=await r.json();W={addr:d.address,bal:{}};localStorage.setItem('ta',d.address);}
  const b={address:W.addr,side:PSIDE,asset:document.getElementById('pub-asset').value,fiat:document.getElementById('pub-fiat').value,
    price:parseFloat(document.getElementById('pub-price').value),min_amount:parseFloat(document.getElementById('pub-min').value),
    max_amount:parseFloat(document.getElementById('pub-max').value),payment_methods:[document.getElementById('pub-pay').value]};
  if(!b.price||!b.min_amount||!b.max_amount)return alert(TAC_TE('請填寫完整價格與限額'));
  const r=await fetch('/api/c2c/ad-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const d=await r.json(); alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('發佈失敗'))); loadMyAds();
}
async function loadMyAds(){
  if(!W)return; const el=document.getElementById('my-ads');
  const r=await fetch('/api/c2c/my-ads?address='+W.addr); const d=await r.json();
  el.innerHTML=(d.ads||[]).map(a=>`<div class="card"><div class="sub" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><b>${a.side==='sell'?'售':'買'} ${a.asset}/${a.fiat}</b><span class="chip">${a.price} ${a.fiat}</span><span class="chip ${a.status==='active'?'g':'y'}">${a.status}</span></div>
    <div class="sub">限額 ${a.min_amount}–${a.max_amount} ${a.asset} · 完成 ${a.completed_orders} 單</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="bn-btn gray" onclick="adStat(${a.id},'paused')">暫停</button>
      <button class="bn-btn gray" onclick="adStat(${a.id},'active')">啟用</button>
      <button class="bn-btn red" onclick="adStat(${a.id},'closed')">下架</button>
    </div></div>`).join('')||'<div class="sub">尚未發佈廣告</div>';
}
async function adStat(id,st){const r=await fetch('/api/c2c/ad-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad_id:id,address:W.addr,status:st})});const d=await r.json();alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('操作失敗')));loadMyAds();}
async function loadMyOrders(){
  if(!W)return; const el=document.getElementById('my-orders');
  const r=await fetch('/api/c2c/my-orders?address='+W.addr); const d=await r.json();
  el.innerHTML=(d.orders||[]).map(o=>{
    const stMap={pending:'待付款',paid:'待放行',completed:'已完成',cancelled:'已取消',disputed:'申訴中'};
    const isBuyer=o.buyer===W.addr;
    let step='';
    if(o.status==='pending')step=`<span class="st now">① 法幣付款</span><span class="st">② 賣家放行</span>`;
    else if(o.status==='paid')step=`<span class="st done">① 已付款</span><span class="st now">② 賣家放行</span>`;
    else if(o.status==='completed')step=`<span class="st done">① 已付款</span><span class="st done">② 已完成</span>`;
    return `<div class="card"><div class="sub" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><b>${o.order_no}</b><span class="chip ${o.status==='completed'?'g':(o.status==='disputed'?'r':(o.status==='cancelled'?'y':'y'))}">${stMap[o.status]}</span></div>
      <div class="sub">${o.asset} × ${o.amount} = <b>${o.total_fiat} ${o.fiat}</b> · ${o.payment_method}</div>
      <div class="order-steps">${step}</div>
      ${isBuyer&&o.status==='pending'?`<div style="display:flex;gap:8px;margin-top:8px"><button class="bn-btn" style="flex:1" onclick="cfm(${o.id})">確認已付款</button><button class="bn-btn gray" onclick="cnl(${o.id})">取消</button><button class="bn-btn red" onclick="dsp(${o.id})">申訴</button></div>`:''}
      ${!isBuyer&&o.status==='paid'?`<div style="display:flex;gap:8px;margin-top:8px"><button class="bn-btn" style="flex:1" onclick="rel(${o.id})">放行幣</button><button class="bn-btn red" onclick="dsp(${o.id})">申訴</button></div>`:''}
      ${o.status==='disputed'?`<div class="sub" style="color:#f6465d">申訴原因：${o.dispute_reason||''}</div>`:''}
    </div>`;
  }).join('')||'<div class="sub">尚無訂單</div>';
}
async function cfm(id){const r=await fetch('/api/c2c/order-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:id,address:W.addr})});const d=await r.json();alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('失敗')));loadMyOrders();}
async function rel(id){const r=await fetch('/api/c2c/order-release',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:id,address:W.addr})});const d=await r.json();alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('失敗')));loadMyOrders();}
async function cnl(id){if(!confirm(TAC_TE('確定取消訂單？')))return;const r=await fetch('/api/c2c/order-cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:id,address:W.addr})});const d=await r.json();alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('失敗')));loadMyOrders();}
async function dsp(id){const rn=prompt(TAC_TE('請輸入申訴原因'));if(!rn)return;const r=await fetch('/api/c2c/order-dispute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:id,address:W.addr,reason:rn})});const d=await r.json();alert(TAC_TE(d.message)||(TAC_TE(d.error)||TAC_TE('失敗')));loadMyOrders();}
cur().then(loadAds);
</script>
{% endblock %}
