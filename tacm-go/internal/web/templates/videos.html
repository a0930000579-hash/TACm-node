{% extends "base.html" %}
{% block title %}TAC Community · Videos{% endblock %}
{% block content %}
<style>
  /* M98：Reels/Shorts/抖音式沉浸式全屏（影片容器黑＝影片本身，非 UI 深色） */
  html,body{margin:0;padding:0;background:#000;color:#fff;overscroll-behavior:none}
  .topbar,.footer,.bottom-nav{display:none!important}
  .vw-wrap{max-width:480px;margin:0 auto;height:100dvh;position:relative}
  .vw-top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 34px}
  .vw-top button{background:none;border:none;padding:6px;border-radius:50%;cursor:pointer}
  .vw-top button svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .vw-top .t{font-weight:800;font-size:16px;letter-spacing:.2px;color:#fff}
  .vw-stack{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
  .vw-stack::-webkit-scrollbar{display:none}
  .vw-card{scroll-snap-align:start;scroll-snap-stop:always;height:100dvh;position:relative;background:#000;overflow:hidden}
  .vw-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .vw-media video{width:100%;height:100%;object-fit:contain;background:#000}
  /* FlipOn 品牌浮水印（右上，FB Reels / YT Shorts 同款） */
  .fl-on{position:absolute;top:calc(76px + env(safe-area-inset-top));right:14px;z-index:5;color:rgba(255,255,255,.92);font-weight:900;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:5px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .fl-on svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* 右側互動欄 */
  .vw-rail{position:absolute;right:8px;bottom:110px;z-index:6;display:flex;flex-direction:column;gap:18px;align-items:center}
  .vw-rail button{background:none;border:none;color:#fff;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .vw-rail button svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .vw-rail button.liked svg{stroke:#e41e3f;fill:#e41e3f}
  /* 底部作者/描述浮層 */
  .vw-info{position:absolute;left:12px;right:70px;bottom:96px;z-index:5;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.65)}
  .vw-info .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .vw-info .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1877f2,#68BE8D);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;border:2px solid #fff}
  .vw-info .nm{font-weight:800;font-size:14px}
  .vw-info .tm{font-size:11px;opacity:.85}
  .vw-info .bd{font-size:13px;line-height:1.45;opacity:.96}
  .vw-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;color:#8a8d91;font-size:14px;gap:10px}
  .vw-empty svg{width:48px;height:48px;stroke:#555;fill:none;stroke-width:1.5}
  .vw-bottom{position:fixed;left:50%;transform:translateX(-50%);right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;backdrop-filter:blur(8px);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));max-width:480px}
  .vw-spin{width:36px;height:36px;border:3px solid #dddfe2;border-top-color:#1877f2;border-radius:50%;animation:vspin .9s linear infinite}
  @keyframes vspin{to{transform:rotate(360deg)}}
  .vw-mute{display:inline-flex;align-items:center;justify-content:center}
  .vw-info .hd .op{display:inline-flex;gap:6px;margin-left:6px}
  .vw-info .hd .op button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
  .vw-info .hd .op button.del{color:#ff8a8a}
  .vw-info .hd .ava.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .vw-bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#ccc;text-decoration:none}
  .vw-bottom a svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .vw-bottom a.on{color:#fff}
  .vw-bottom a.on svg{stroke:#fff}
  .ad-card-v{position:absolute;left:12px;right:12px;bottom:150px;z-index:7;background:rgba(255,255,255,.96);color:#1c1e21;border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .ad-card-v .t{font-weight:800;font-size:14px;margin-bottom:2px}
  .ad-card-v .b{font-size:12px;color:#65676b;line-height:1.4;margin-bottom:6px}
  .ad-card-v .row{display:flex;align-items:center;gap:8px}
  .ad-card-v .sp{font-size:10px;color:#b06a00;background:#fff2d9;border-radius:6px;padding:2px 6px;font-weight:700}
  .ad-card-v a{margin-left:auto;background:#1877f2;color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;text-decoration:none}
</style>

<div class="vw-wrap">
  <div class="vw-top">
    <button onclick="location='/community'"><svg viewBox="0 0 24 24"><path d="M19 12 H6 M11 6 L5 12 L11 18"/></svg></button>
    <div class="t"><svg viewBox="0 0 28 28" style="width:20px;height:20px;vertical-align:-4px;stroke:#1877f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px"><path d="M14 4 C8 4 5 9 5 14 c0 4 2 7 4 9 v2 h10 v-2 c2-2 4-5 4-9 C23 9 20 4 14 4 Z"/><circle cx="14" cy="13" r="3.4"/><path d="M10.5 21.5 h7"/></svg><span data-i18n="cm.brand">TAC 社群</span></div>
    <div style="margin-left:auto;display:flex;gap:6px">

  <div class="vw-stack" id="vwStack">

      <div class="vw-spin"></div>

    </div>
  </div>
</div>

<nav class="vw-bottom">
  <a href="/community"><svg viewBox="0 0 24 24" style="stroke:#65676b;fill:none;stroke-width:1.8"><path d="M3 10 L12 3 L21 10 V21 H15 V14 H9 V21 H3 Z"/></svg><span data-i18n="cm.home">首頁</span></a>
  <a href="/community/videos" class="on"><svg viewBox="0 0 24 24" style="stroke:#1877f2;fill:none;stroke-width:1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg><span data-i18n="cm.video">影片</span></a>
  <a href="/community/friends"><svg viewBox="0 0 24 24" style="stroke:#65676b;fill:none;stroke-width:1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20 C2.5 15.5 5 13 9 13 C13 13 15.5 15.5 15.5 20"/><circle cx="17" cy="9" r="2.8"/><path d="M16 13.5 C19 13.5 21.5 15.5 21.5 19"/></svg><span data-i18n="cm.friends">好友</span></a>
  <a href="/community/market"><svg viewBox="0 0 24 24" style="stroke:#65676b;fill:none;stroke-width:1.8"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span data-i18n="cm.market">市集</span></a>
  <a href="/community/notifications"><svg viewBox="0 0 24 24" style="stroke:#65676b;fill:none;stroke-width:1.8"><path d="M12 3 C8 3 6 6 6 9.5 V15 L4 17 H20 L18 15 V9.5 C18 6 16 3 12 3 Z"/><path d="M9.5 20 C10 21.5 11 22 12 22 C13 22 14 21.5 14.5 20"/></svg><span data-i18n="cm.notify">通知</span></a>
  <a href="/community/profile"><svg viewBox="0 0 24 24" style="stroke:#65676b;fill:none;stroke-width:1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 7.5 13.5 12 13.5 C16.5 13.5 20 16 20 21"/></svg><span data-i18n="cm.me">個人</span></a>
</nav>

<!-- 社群統一權威地址（比照交易所 v160 錢包中心） -->
<script src="/static/js/community-wallet.js"></script>
<script>
function get(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
function post(p,b){ return fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})}).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||r.status)}); return r.json(); }); }
var me = ''; // 身分＝權威地址（錢包中心為準），進頁由 cmBindAddr 解析填入。
function shortAddr(a){ if(!a) return '—'; if(a.length<=16) return a; return a.slice(0,10)+'…'+a.slice(-6); }
function timeAgo(ts){ var d=Date.now()/1000-ts; if(d<60) return '剛剛'; if(d<3600) return Math.floor(d/60)+' 分鐘前'; if(d<86400) return Math.floor(d/3600)+' 小時前'; return Math.floor(d/86400)+' 天前'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var liked = {};
function likeIt(id, btn){
  if(!me){ alert(TAC_TE('請先輸入你的錢包地址（tx0 開頭）')); return; }
  post('/api/community/post/'+id+'/like', {address: me}).then(function(d){
    liked[id] = !liked[id];
    var n = btn.querySelector('.n');
    n.textContent = Number(n.textContent||0) + (liked[id]?1:-1);
    btn.classList.toggle('liked', liked[id]);
  }).catch(function(e){ alert('失敗：'+e); });
}
function shareIt(u){
  try { navigator.clipboard.writeText(u); alert('已複製連結'); } catch(e){ prompt('貼文連結:', u); }
}

function openVideo(u){ window.open(u, '_blank'); }
function loadVideos(){
  var el = document.getElementById('vwStack');
  get('/api/community/feed?limit=100&ad_placement=video').then(function(d){
    var vids = (d.items||[]).filter(function(p){ return p.kind==='video' && p.video_url; });
    var ads = d.ads||[];
    if(!vids.length && !ads.length){ el.innerHTML = ''; var e=document.getElementById('vwEmpty'); e.style.display='block'; el.appendChild(e); return; }
    document.getElementById('vwEmpty').style.display='none';
    var out = []; var ai = 0;
    vids.forEach(function(p, i){
      out.push(videoCard(p));
      if((i+1)%5===0 && ai<ads.length){ out.push(adCardV(ads[ai++])); }
    });
    while(ai<ads.length && out.length>=5){ out.push(adCardV(ads[ai++])); }
    el.innerHTML = out.join('');
    setupIO();
    return;
    function videoCard(p){
      var avaCh = (p.author_name||p.address||'?').slice(0,1).toUpperCase();
      var ava = p.avatar_url
        ? '<div class="ava photo"><img src="'+escapeHtml(p.avatar_url)+'" alt="" onerror="avaFallback(this,\''+escapeHtml(avaCh)+'\')"></div>'
        : '<div class="ava">'+avaCh+'</div>';
      var nm = escapeHtml(p.author_name||'') || shortAddr(p.address);
      var op = (me && p.address===me)
        ? '<span class="op"><button onclick="editVideo('+p.id+')">'+TAC_TE('編輯')+'</button><button class="del" onclick="delVideo('+p.id+')">'+TAC_TE('刪除')+'</button></span>'
        : '';
      return '<div class="vw-card"><div class="vw-media"><video src="'+escapeHtml(p.video_url)+'" autoplay muted playsinline loop preload="metadata" onclick="this.muted=!this.muted;this.paused?this.play():this.pause()"></video></div>'+
        '<div class="fl-on"><svg viewBox="0 0 24 24"><path d="M13 3 L5 13 H11 L9 21 L19 10 H13 Z"/></svg>FlipOn</div>'+
        '<div class="vw-rail">'+
        '<button class="'+(liked[p.id]?'liked':'')+'" onclick="likeIt('+p.id+', this)"><svg viewBox="0 0 24 24"><path d="M12 20 C6 15.5 3 11.5 3 8.2 C3 5.6 5 4 7.2 4 C9 4 10.5 5 12 7 C13.5 5 15 4 16.8 4 C19 4 21 5.6 21 8.2 C21 11.5 18 15.5 12 20 Z"/></svg><span>'+(p.likes||0)+'</span></button>'+
        '<button onclick="location=\'/community?post='+p.id+'\'"><svg viewBox="0 0 24 24"><path d="M21 12 C21 16 17.4 19 12 19 C10.8 19 9.6 18.8 8.5 18.5 L4 21 L5.5 17 C3.8 15.6 3 13.8 3 12 C3 8 6.6 5 12 5 C17.4 5 21 8 21 12 Z"/></svg><span>'+(p.comments||0)+'</span></button>'+
        '<button onclick="shareIt(location.href)"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.7 L15.7 7.3 M8.3 13.3 L15.7 16.7"/></svg><span>'+TAC_TE('分享')+'</span></button>'+
        '</div>'+
        '<div class="vw-info"><div class="hd">'+ava+'<div><div class="nm">'+nm+'</div><div class="tm">'+timeAgo(p.created_at)+'</div></div>'+op+'</div>'+
        '<div class="bd">'+escapeHtml(p.content)+'</div></div></div>';
    }

    function adCardV(a){
      trackImpV(a.id);
      var media = '';
      if(a.media_url){
        media = /\.(mp4|webm|m3u8)(\?|$)/i.test(a.media_url)
          ? '<video src="'+escapeHtml(a.media_url)+'" controls playsinline preload="metadata" loop style="width:100%;aspect-ratio:9/16;max-height:72vh;object-fit:contain;display:block;background:#fff"></video>'
          : '<img src="'+escapeHtml(a.media_url)+'" loading="lazy" style="width:100%;display:block" alt="">';
      }
      return '<div class="vw-card" style="border:1.5px solid #9c27b0"><div class="vw-head"><div class="vw-ava" style="background:linear-gradient(135deg,#9c27b0,#f0b90b)">A</div>'+
        '<div style="min-width:0"><div class="nm">Sponsored · TAC 廣告</div><div class="tm">曝光 '+a.impressions+' · 點擊 '+a.clicks+'</div></div></div>'+
        '<div class="vw-body" style="font-weight:700">'+escapeHtml(a.title)+'</div>'+
        (a.body?'<div class="vw-body">'+escapeHtml(a.body)+'</div>':'')+
        media+
        '<div class="vw-acts"><button class="vw-act" onclick="adClickV('+a.id+',\''+escapeHtml(a.target||'')+'\')"><svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#9c27b0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 12 H20 M14 6 L20 12 L14 18"/></svg><span>'+TAC_TE('了解更多')+'</span></button></div></div>';
    }
  }).catch(function(e){ el.innerHTML = '<div class="vw-empty">'+TAC_TE('載入失敗')+'：'+e+'</div>'; });
}
function trackImpV(id){ try{ post('/api/community/ads/'+id+'/impression', {address:me||''}); }catch(e){} }
function adClickV(id, target){ try{ post('/api/community/ads/'+id+'/click', {address:me||''}); }catch(e){} if(target){ window.open(target,'_blank'); } }
// 進頁解析權威地址（錢包中心為準）後再載入影片瀑布流。
cmBindAddr({ onResolve: function(addr){ me = addr; loadVideos(); } });
    var vwIO=null;
    function setupIO(){
      if(vwIO){ vwIO.disconnect(); }
      vwIO = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          var v = en.target;
          if(en.isIntersecting && en.intersectionRatio>0.5){ var p=v.play(); if(p&&p.catch){p.catch(function(){});} }
          else { v.pause(); }
        });
      }, {root: document.getElementById('vwStack'), threshold:[0.5]});
      document.querySelectorAll('#vwStack video').forEach(function(v){
        vwIO.observe(v);
        // 強化：元素可播後立即播放（muted autoplay 標準豁免）；失敗則等首次手勢
        var tryPlay = function(){ var p=v.play(); if(p&&p.catch){ p.catch(function(){}); } };
        v.addEventListener('loadedmetadata', tryPlay);
        v.addEventListener('canplay', tryPlay);
      });
      if(!window.__vwTap){
        window.__vwTap = true;
        document.addEventListener('touchstart', function(){
          document.querySelectorAll('#vwStack video').forEach(function(v){ if(v.paused){ var p=v.play(); if(p&&p.catch){p.catch(function(){});} } });
        }, {once:true, passive:true});
        document.addEventListener('click', function(){
          document.querySelectorAll('#vwStack video').forEach(function(v){ if(v.paused){ var p=v.play(); if(p&&p.catch){p.catch(function(){});} } });
        }, {once:true});
      }
    }

var vwMuted = true;
function toggleSound(){
  vwMuted = !vwMuted;
  document.querySelectorAll('#vwStack video').forEach(function(v){ v.muted = vwMuted; });
  var ico = document.getElementById('vwMuteIco');
  ico.innerHTML = vwMuted
    ? '<path d="M4 9 V15 H8 L13 19 V5 L8 9 Z"/><path d="M16 9 C17.5 10.2 17.5 13.8 16 15"/>'
    : '<path d="M4 9 V15 H8 L13 19 V5 L8 9 Z"/><path d="M16 8 L21 16 M21 8 L16 16"/>';
}
function editVideo(id){
  var txt = prompt(TAC_TE('編輯影片描述：'), '');
  if(txt===null) return;
  post('/api/community/post/'+id+'/edit', {address: me, content: txt})
    .then(function(){ alert(TAC_TE('已更新')); loadVideos(); })
    .catch(function(e){ alert(TAC_TE('編輯失敗')+'：'+e); });
}
function delVideo(id){
  if(!confirm(TAC_TE('確定刪除這支影片？'))) return;
  post('/api/community/post/'+id+'/delete', {address: me})
    .then(function(){ alert(TAC_TE('已刪除')); loadVideos(); })
    .catch(function(e){ alert(TAC_TE('刪除失敗')+'：'+e); });
}
function avaFallback(img, ch){ img.parentNode.outerHTML = '<div class="ava">'+ch+'</div>'; }
</script>
{% endblock %}
