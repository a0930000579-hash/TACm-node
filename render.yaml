# Render Blueprint：一鍵部署 TACm 主網第二錨點節點
# 用法：把本資料夾推到 GitHub，Render 新增 Blueprint 選此 repo
services:
  - type: web
    name: tacm-anchor2
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: tacdata
      mountPath: /var/tac/data
      sizeGB: 5
    envVars:
      - key: TACM_MAX_SUPPLY
        value: "52003300"
