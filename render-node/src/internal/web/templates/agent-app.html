<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TACm AI Agent</title>
<style>
:root{
  --bg:#f4f3ee; --side:#f7f6f1; --main:#fcfcfa; --card:#ffffff;
  --line:#e7e5dd; --line2:#dcd8cf;
  --text:#262523; --muted:#7c7972; --faint:#aaa79f;
  --ink:#1c1b18; --brand:#c0643f; --brand-soft:#f3e3da;
  --ok:#3f9d6e; --danger:#cf4848; --warn:#b9852a;
  --user:#efede7;
  --shadow:0 12px 32px rgba(60,50,35,.10);
  --shadow-sm:0 2px 10px rgba(60,50,35,.07);
  --side-w:284px;
  --serif:Georgia,"Times New Roman","Songti TC","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit}
.app{display:flex;height:100dvh;overflow:hidden}

/* ---------- Sidebar ---------- */
.side{width:var(--side-w);flex:0 0 var(--side-w);background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:transform .25s ease;z-index:30}
.side-brand{display:flex;align-items:baseline;gap:7px;padding:20px 18px 12px}
.side-brand .wm{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.5px}
.side-brand .wm small{font-size:13px;color:var(--brand);font-family:inherit;margin-left:2px}
.side-brand .search{margin-left:auto;background:none;border:none;color:var(--muted);padding:5px;cursor:pointer;display:grid;place-items:center}
.side-brand .search svg{width:19px;height:19px}

.nav-group{padding:4px 12px;display:flex;flex-direction:column;gap:2px}
.nav-link{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-radius:11px;
  padding:10px 12px;color:var(--text);font-size:15px;cursor:pointer;text-decoration:none;text-align:left}
.nav-link svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
.nav-link:hover{background:rgba(0,0,0,.04)}

.section-label{padding:14px 22px 6px;font-size:12.5px;color:var(--faint);letter-spacing:.4px}

.conv-list{flex:1;overflow-y:auto;padding:2px 12px;display:flex;flex-direction:column;gap:2px;min-height:60px}
.conv-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;color:var(--muted);
  border-radius:11px;padding:10px 11px;font-size:14px;cursor:pointer;text-align:left}
.conv-item svg.cq{width:18px;height:18px;flex:0 0 auto;color:var(--faint)}
.conv-item:hover{background:rgba(0,0,0,.04)}
.conv-item.active{background:#fff;border-color:var(--line2);color:var(--text);box-shadow:var(--shadow-sm)}
.conv-item .ci-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item .ci-del{flex:0 0 auto;background:none;border:none;color:var(--faint);padding:2px;cursor:pointer;display:grid;place-items:center}
.conv-item .ci-del svg{width:15px;height:15px}
.conv-empty{color:var(--faint);font-size:12.5px;text-align:center;padding:18px 8px;line-height:1.6}

.side-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.model-select{position:relative}
.model-btn{width:100%;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;color:var(--text);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(63,157,110,.16)}
.dot.off{background:var(--faint)}
.model-btn .mb-name{flex:1;text-align:left;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-btn svg{width:15px;height:15px;color:var(--muted)}
.model-menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;max-height:260px;overflow-y:auto;z-index:40}
.model-menu.open{display:block}
.mm-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--text)}
.mm-item:hover{background:rgba(0,0,0,.04)}
.mm-item .mm-name{flex:1;text-align:left;font-size:13px}
.mm-item .mm-state{font-size:11px;color:var(--faint)}
.side-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lang-btn{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer}

.foot-user{display:flex;align-items:center;gap:10px}
.avatar-circle{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;
  font-size:15px;font-weight:600;flex:0 0 auto;text-decoration:none}
.avatar-circle svg{width:20px;height:20px}
.new-chat{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;background:var(--ink);
  border:none;color:#fff;border-radius:999px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}
.new-chat svg{width:17px;height:17px}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--main)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:rgba(252,252,250,.85);backdrop-filter:blur(10px)}
.hamburger{background:#fff;border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer}
.hamburger svg{width:19px;height:19px}
.tb-model{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;flex:1;min-width:0}
.tb-model .dot{width:8px;height:8px}
.tb-model span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-balance{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}

.messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.msg-wrap{max-width:760px;margin:0 auto;padding:20px 18px;display:flex;gap:13px}
.msg-wrap.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
.avatar.bot{background:var(--brand-soft);color:var(--brand)}
.avatar.user{background:#fff;color:var(--muted);border:1px solid var(--line)}
.avatar svg{width:18px;height:18px}
.msg-body{min-width:0;flex:1}
.msg-wrap.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{font-size:15.5px;line-height:1.7;word-break:break-word;color:var(--text)}
.msg-wrap.user .bubble{background:var(--user);padding:10px 15px;border-radius:18px 18px 6px 18px;max-width:100%;white-space:pre-wrap}
.msg-meta{font-size:11.5px;color:var(--faint);margin-top:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Markdown 元素（淺色鏈上配色） ---------- */
.md-p{margin:9px 0}.md-p:first-child{margin-top:0}
.md-h{font-family:var(--serif);line-height:1.35;margin:16px 0 8px;color:var(--ink)}
h1.md-h{font-size:22px}h2.md-h{font-size:19px}h3.md-h{font-size:17px}
h4.md-h,h5.md-h,h6.md-h{font-size:15px}
.md-ul,.md-ol{margin:8px 0;padding-left:22px}.md-ul li,.md-ol li{margin:4px 0}
.md-quote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--brand);background:var(--brand-soft);
  border-radius:0 10px 10px 0;color:#5d4a40}
.md-hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.md-code{background:#f1efe8;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;
  font-family:"SF Mono",Menlo,Consolas,monospace;color:#9a4a2c}
.md-link{color:var(--brand);text-decoration:none;border-bottom:1px solid rgba(192,100,63,.4)}
.md-link:hover{border-bottom-color:var(--brand)}
.md-img{max-width:100%;border-radius:12px;border:1px solid var(--line);margin:10px 0;display:block}
.md-file{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);
  border-radius:12px;padding:10px 14px;margin:10px 0;max-width:380px;text-decoration:none;color:var(--text);
  box-shadow:var(--shadow-sm)}
.md-file .mf-ico{display:grid;place-items:center;color:var(--brand);flex:0 0 auto}
.md-file .mf-ico svg{width:22px;height:22px}
.md-file .mf-txt{font-size:14px;font-weight:600}
.md-table-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
.md-table{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
.md-table th,.md-table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
.md-table th{background:#f4f2ec;font-family:var(--serif);color:var(--ink)}
.md-table tr:last-child td{border-bottom:none}

.code-block{background:#fbfaf7;border:1px solid var(--line2);border-radius:13px;margin:13px 0;overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-bottom:1px solid var(--line);background:#f4f2ec}
.code-lang{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.code-dl{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--brand);font-size:12px;cursor:pointer}
.code-dl svg{width:14px;height:14px}
.code-block pre{margin:0;padding:14px;overflow-x:auto;font-size:13px;line-height:1.55;font-family:"SF Mono",Menlo,Consolas,monospace;color:#33312c}

.file-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line2);border-radius:13px;padding:12px 14px;margin-top:12px;max-width:430px;box-shadow:var(--shadow-sm)}
.file-card svg{width:26px;height:26px;color:var(--brand);flex:0 0 auto}
.file-info{flex:1;min-width:0}
.file-info strong{display:block;font-size:14px}
.file-info span{font-size:12px;color:var(--muted)}
.file-dl{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;text-decoration:none;white-space:nowrap}

.trace{margin-top:11px;border:1px solid var(--line);border-radius:12px;background:#fbfaf7;overflow:hidden}
.trace summary{font-size:12.5px;color:var(--muted);cursor:pointer;padding:11px 13px;display:flex;align-items:center;gap:7px;list-style:none}
.trace summary::-webkit-details-marker{display:none}
.trace summary svg{width:15px;height:15px}
.trace-inner{padding:0 13px 12px;display:flex;flex-direction:column;gap:7px}
.trace-step{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5}
.trace-step .k{color:var(--brand);font-weight:600}
.trace-step.err{border-color:var(--danger)}
.cite{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.cite a{color:var(--brand);font-size:12.5px;word-break:break-all}

/* empty / greeting */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.empty-mark{width:54px;height:54px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:10px}
.empty-mark svg{width:30px;height:30px}
.empty h1{font-family:var(--serif);font-size:30px;font-weight:700;margin:6px 0;letter-spacing:-.5px}
.empty p{color:var(--muted);font-size:14.5px;max-width:440px;line-height:1.65;margin:0 0 18px}
.usage-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;box-shadow:var(--shadow-sm);text-align:left;margin-bottom:18px}
.usage-card .uc-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:4px}
.usage-card .uc-top svg{width:17px;height:17px;color:var(--brand)}
.usage-card .uc-sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;width:100%;max-width:560px}
.suggest-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;text-align:left;color:var(--text);cursor:pointer;font-size:13.5px;line-height:1.5}
.suggest-card:hover{border-color:var(--brand2);box-shadow:var(--shadow-sm)}
.suggest-card svg{width:19px;height:19px;color:var(--brand);margin-bottom:9px;display:block}

/* confirm */
.confirm{border-top:1px solid var(--line);background:#fff;padding:13px 16px}
.confirm-inner{max-width:760px;margin:0 auto}
.confirm p{margin:0 0 11px;font-size:13.5px;color:var(--warn);display:flex;gap:8px;align-items:center}
.confirm p svg{width:17px;height:17px;flex:0 0 auto}
.confirm-actions{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line2)}
.btn.primary{background:var(--ink);color:#fff}

/* composer */
.composer{padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.composer-inner{max-width:760px;margin:0 auto}
.composer-model{display:flex;margin:0 4px 8px}
.composer-model .model-select{position:relative;flex:0 0 auto;min-width:170px;max-width:60%}
.composer-model .model-btn{padding:8px 11px}
.composer-model .model-menu{bottom:calc(100% + 6px);max-height:230px}
.composer-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);
  border-radius:22px;padding:8px 8px 8px 10px;box-shadow:var(--shadow-sm)}
.composer-box:focus-within{border-color:var(--brand)}
.composer-plus{background:var(--user);border:none;color:var(--muted);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.composer-plus svg{width:19px;height:19px}
.composer-box textarea{flex:1;background:none;border:none;color:var(--text);font-size:15.5px;resize:none;max-height:140px;outline:none;font-family:inherit;line-height:1.4;padding:7px 2px}
.send{background:var(--ink);border:none;width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.send svg{width:18px;height:18px}
.send:disabled{opacity:.4}
.composer-hint{margin:8px 8px 0;font-size:11.5px;color:var(--warn);display:none}
.composer-hint.show{display:block}
.typing{display:inline-flex;gap:5px;align-items:center;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

.scrim{position:fixed;inset:0;background:rgba(40,35,25,.4);z-index:20;display:none}
.scrim.show{display:block}

@media (max-width:860px){
  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
  .side.open{transform:translateX(0)}
  .suggest{grid-template-columns:1fr}
  .msg-wrap{padding:16px 14px}
}
@media (min-width:861px){.hamburger{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-brand">
      <div class="wm">TACm<small>AI</small></div>
      <button class="search" id="searchBtn" type="button" aria-label="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>

    <div class="nav-group">
      <a class="nav-link" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span data-i18n="nav_chain">TAC智能鏈</span>
      </a>
      <a class="nav-link" href="/ai-market">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 4l-4 16"/></svg>
        <span data-i18n="nav_projects">專案</span>
      </a>
      <a class="nav-link" href="/files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span data-i18n="nav_files">檔案庫</span>
      </a>
      <a class="nav-link" href="/media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m10 9 5 3-5 3z"/></svg>
        <span data-i18n="nav_media">影音圖像</span>
      </a>
    </div>

    <div class="section-label" data-i18n="recent">最近</div>
    <div class="conv-list" id="convList"></div>

    <div class="side-foot">
      <div class="side-meta">
        <button class="lang-btn" id="langBtn" type="button">中 / EN</button>
      </div>
      <div class="foot-user">
        <a class="avatar-circle" id="memberEntry" href="/member" aria-label="member">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        </a>
        <button class="new-chat" id="newChat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="new_chat">新增工作階段</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <section class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" type="button" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="tb-model"><span class="dot" id="topDot"></span><span id="topModel">TACm AI</span></div>
      <div class="tb-balance" id="topBalance">TACm —</div>
    </header>

    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <div class="empty-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5L12 14.4 7.5 16.8l.9-5L4.8 8.3l5-.7z"/></svg>
        </div>
        <h1 data-i18n="empty_title">我是 TACm AI</h1>
        <p data-i18n="empty_desc">問我鏈上數據、DeFi，或請我寫程式、生成可下載檔案。選一個開始：</p>
        <div class="usage-card">
          <div class="uc-top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2"/></svg>
            <span data-i18n="uc_title">按次計費</span>
          </div>
          <div class="uc-sub" data-i18n="uc_sub">每輪 0.01 TACm，寫操作需確認；未連結地址時不計費。</div>
        </div>
        <div class="suggest" id="suggest"></div>
      </div>
    </div>

    <div class="confirm" id="confirm" hidden>
      <div class="confirm-inner">
        <p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span data-i18n="confirm_note">這是寫操作，需明確確認才會執行。</span></p>
        <div class="confirm-actions">
          <button class="btn ghost" id="cancelBtn" type="button" data-i18n="cancel">取消</button>
          <button class="btn primary" id="confirmBtn" type="button" data-i18n="confirm">確認執行</button>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="composer-model">
          <div class="model-select">
            <button class="model-btn" id="modelBtn" type="button">
              <span class="dot" id="sideDot"></span>

/* ---------- address / balance ----------

   改為快取字串：先同步讀 localStorage，再用 Promise 補齊（首次訪客需伺服器發址）。 */
var myAddr="";
function readAddrSync(){
  try{var ex=localStorage.getItem('tac_ex_wallet');if(ex){var eo=JSON.parse(ex);
    if(eo&&eo.addr&&eo.addr.indexOf('tx0')===0)return eo.addr}}catch(e){}

    myAddr=(a&&a.indexOf&&a.indexOf('tx0')===0)?a:readAddrSync();refreshBalance();

function refreshBalance(){

    topBalance.textContent="TACm "+(j&&j.tacm!=null?j.tacm:"—");
  }).catch(function(){topBalance.textContent="TACm —"});

/* ---------- rendering ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var dlIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
function download(name,content,mime){
  var blob=new Blob([content],{type:mime||"text/plain"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
// safeURL 只允許 http/https/相對路徑/錨點，阻擋 javascript: 等協議（防 XSS）。
function safeURL(u){
  u=String(u).trim();
  if(/^https?:\/\//i.test(u)||/^\/(?!\/)/.test(u)||/^#/.test(u)||/^\.?\//.test(u))return u;
  return "";
}
function isFileURL(u){return /^\/api\/ai\/file\//.test(u)||/\.[a-z0-9]{1,5}$/i.test(u)}
// inline 渲染：先處理行內程式碼（佔位避免內容被二次解析），再圖片/連結/粗體/斜體。
function inline(text){
  var codes=[];
  text=text.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return "\u0000C"+(codes.length-1)+"\u0000"});
  text=esc(text);
  // 圖片 ![alt](url)
  text=text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(m,alt,u){
    var su=safeURL(u);if(!su)return esc(alt);
    return '<img class="md-img" loading="lazy" alt="'+alt+'" src="'+su+'">';
  });
  // 連結 [text](url)：下載連結轉卡片式按鈕
  text=text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,tx,u){
    var su=safeURL(u);
    if(!su)return tx;
    if(isFileURL(su)){
      return '<a class="md-file" href="'+su+'" download><span class="mf-ico">'+dlIcon+'</span><span class="mf-txt">'+tx+'</span></a>';
    }
    return '<a class="md-link" href="'+su+'" target="_blank" rel="noopener">'+tx+'</a>';
  });
  text=text.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
           .replace(/__([^_]+)__/g,"<strong>$1</strong>")
           .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>")
           // 底線斜體遵守 CommonMark 字內規則：_ 緊鄰文數字（URL/檔名如 af_xx、hello_world）不觸發
           .replace(/(^|[^\w])_([^_]+?)_(?=[^\w]|$)/g,"$1<em>$2</em>");
  text=text.replace(/\u0000C(\d+)\u0000/g,function(m,i){return '<code class="md-code">'+esc(codes[+i])+'</code>'});
  return text;
}
// richHTML 完整 Markdown 渲染（標題/清單/引用/表格/分隔線/程式碼區塊/段落）。
function richHTML(src){
  var lines=String(src||"").replace(/\r\n/g,"\n").split("\n"),html="",i=0;
  var blocks=[];
  while(i<lines.length){
    var line=lines[i];
    if(/^\s*```/.test(line)){
      var lang1=line.replace(/^\s*```/,"").trim(),buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++}
      i++;var code=buf.join("\n");var fname="snippet."+(lang1||"txt");
      blocks.push('<div class="code-block"><div class="code-head"><span class="code-lang">'+esc(lang1||"text")+'</span>'+
        '<button class="code-dl" type="button" data-name="'+esc(fname)+'">'+dlIcon+'</button></div><pre>'+esc(code)+'</pre></div>');
      continue;
    }
    var hm=line.match(/^\s*(#{1,6})\s+(.*)$/);
    if(hm){blocks.push('<h'+hm[1].length+' class="md-h">'+inline(hm[2])+'</h'+hm[1].length+'>');i++;continue}
    if(/^\s*>\s?/.test(line)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++}
      blocks.push('<blockquote class="md-quote">'+inline(q.join(" "))+'</blockquote>');continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(line)){blocks.push('<hr class="md-hr">');i++;continue}
    if(/^\s*[-*+]\s+/.test(line)){var ul=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){ul.push('<li>'+inline(lines[i].replace(/^\s*[-*+]\s+/,""))+'</li>');i++}
      blocks.push('<ul class="md-ul">' + ul.join("") + '</ul>');continue}
    if(/^\s*\d+\.\s+/.test(line)){var ol=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){ol.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,""))+'</li>');i++}
      blocks.push('<ol class="md-ol">' + ol.join("") + '</ol>');continue}
    if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      var head=line.split("|").slice(1,-1);i+=2;var rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i].split("|").slice(1,-1));i++}
      var t='<div class="md-table-wrap"><table class="md-table"><thead><tr>'+head.map(function(c){return '<th>'+inline(c.trim())+'</th>'}).join("")+'</tr></thead><tbody>';
      rows.forEach(function(r){t+='<tr>'+r.map(function(c){return '<td>'+inline(c.trim())+'</td>'}).join("")+'</tr>'});
      blocks.push(t+'</tbody></table></div>');continue;
    }
    if(/^\s*$/.test(line)){i++;continue}
    var para=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^\s*(```|#{1,6}\s|>|\||[-*+]\s|\d+\.\s)/.test(lines[i])){para.push(lines[i]);i++}
    blocks.push('<p class="md-p">'+inline(para.join("\n"))+'</p>');
  }
  html=blocks.join("");
  if(!html)return esc(src);
  // 綁定程式碼區塊下載按鈕
  setTimeout(function(){
    html&&messages.querySelectorAll(".code-dl").forEach(function(btn){
      if(btn._bound)return;btn._bound=true;
      btn.addEventListener("click",function(){
        var pre=btn.closest(".code-block").querySelector("pre");
        download(btn.getAttribute("data-name"),pre.innerText,"text/plain");
      });
    });
  },0);
  return html;
}
function botAvatarSVG(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5L12 14.4 7.5 16.8l.9-5L4.8 8.3l5-.7z"/></svg>'}
function userAvatarSVG(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'}

function addMessageNode(role,data){
  var wrap=document.createElement("div");wrap.className="msg-wrap "+role;
  var av=document.createElement("div");av.className="avatar "+role;av.innerHTML=role==="bot"?botAvatarSVG():userAvatarSVG();
  var body=document.createElement("div");body.className="msg-body";
  var bubble=document.createElement("div");bubble.className="bubble";
  if(role==="user"){bubble.textContent=data.content||""}
  else if(data.typing){bubble.innerHTML='<span class="typing"><i></i><i></i><i></i></span>'}
  else{bubble.innerHTML=richHTML(data.content||"");attachExtras(bubble,body,data)}
  body.appendChild(bubble);wrap.appendChild(av);wrap.appendChild(body);
  messages.appendChild(wrap);
  messages.scrollTop=messages.scrollHeight;
  return wrap;
}
function attachExtras(bubble,body,data){
  if(data.model){var meta=document.createElement("div");meta.className="msg-meta";meta.textContent=data.model;body.appendChild(meta)}
  if(data.file){
    var fc=document.createElement("div");fc.className="file-card";
    fc.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'+
      '<div class="file-info"><strong>'+esc(data.file.filename)+'</strong><span>'+esc(data.file.language||"")+' · '+data.file.size+' B</span></div>';
    var a=document.createElement("a");a.className="file-dl";a.href=data.file.download_url;a.download=data.file.filename;a.textContent=(lang==="zh"?"下載":"Download");
    fc.appendChild(a);body.appendChild(fc);
  }
  if(data.citations&&data.citations.length){
    var box=document.createElement("div");box.className="cite";
    data.citations.forEach(function(c){var l=document.createElement("a");l.href=c.url;l.target="_blank";l.rel="noopener";l.textContent=c.title||c.url;box.appendChild(l)});
    body.appendChild(box);
  }
  if(data.trace&&data.trace.length){
    var det=document.createElement("details");det.className="trace";
    det.innerHTML='<summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'+t("reasoning")+" ("+data.trace.length+")</summary>";
    var inner=document.createElement("div");inner.className="trace-inner";
    data.trace.forEach(function(st){
      var d=document.createElement("div");d.className="trace-step"+(st.error?" err":"");
      d.innerHTML='<span class="k">'+esc(st.kind)+(st.tool?" / "+esc(st.tool):"")+'</span> '+(st.error?esc(st.error):esc(st.thought||st.result||""));
      inner.appendChild(d);
    });
    det.appendChild(inner);body.appendChild(det);
  }
}
function renderMessages(){
  messages.innerHTML="";
  var conv=store[activeId];
  if(!conv||!conv.messages.length){messages.appendChild(empty);empty.style.display="flex";return}
  conv.messages.forEach(function(m){addMessageNode(m.role,m)});
}

/* ---------- send ---------- */
var busy=false, pendingText="";
function sendMessage(text,isConfirm){
  if(busy)return;busy=true;send.disabled=true;
  if(!activeId){newConversation()}
  var conv=store[activeId];
  if(!isConfirm){
    conv.messages.push({role:"user",content:text});
    if(!conv.title)conv.title=text.slice(0,26);
    saveStore(store);renderConvList();
  }
  if(empty.parentNode)empty.parentNode.removeChild(empty);
  var typingNode=addMessageNode("bot",{typing:true});
  fetch("/api/ai/agent",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,address:myAddr,lang:lang,session_id:activeId,confirm:!!isConfirm,model:selectedModel})})
    .then(function(r){return r.json().then(function(j){return{status:r.status,body:j}})})
    .then(function(res){
      typingNode.remove();
      var j=res.body||{};
      if(res.status>=400){conv.messages.push({role:"bot",content:j.error||("Error "+res.status)});saveStore(store);renderMessages();finish();return}
      var data={role:"bot",content:j.answer||"",model:j.model,trace:j.trace,citations:j.citations};
      (j.trace||[]).forEach(function(st){
        if(st.kind==="tool"&&st.tool==="create_file"&&!st.error&&st.args){
          var um=(st.result||"").match(/\/api\/ai\/file\/[A-Za-z0-9_]+/);
          var sm=(st.result||"").match(/(\d+) bytes/);
          data.file={filename:st.args.filename,language:st.args.language,size:sm?sm[1]:0,download_url:um?um[0]:"#"};
        }
      });
      conv.messages.push(data);saveStore(store);renderMessages();
      if(j.needs_confirm){pendingText=text;confirmBox.hidden=false}else{confirmBox.hidden=true;refreshBalance()}
      finish();
    }).catch(function(e){typingNode.remove();conv.messages.push({role:"bot",content:"Network error: "+e.message});saveStore(store);renderMessages();finish()});
}
function finish(){busy=false;send.disabled=false;messages.scrollTop=messages.scrollHeight}

/* ---------- events ---------- */
function go(){var v=input.value.trim();if(!v||busy)return;input.value="";autoGrow();sendMessage(v,false)}
send.addEventListener("click",go);
input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}});
function autoGrow(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"}
input.addEventListener("input",autoGrow);
confirmBtn.addEventListener("click",function(){confirmBox.hidden=true;sendMessage(pendingText,true)});
cancelBtn.addEventListener("click",function(){confirmBox.hidden=true});
fileBtn.addEventListener("click",function(){fileHint.classList.toggle("show");input.focus()});
$("newChat").addEventListener("click",newConversation);
$("modelBtn").addEventListener("click",function(){modelMenu.classList.toggle("open")});
$("hamburger").addEventListener("click",function(){side.classList.add("open");scrim.classList.add("show")});
function closeDrawer(){side.classList.remove("open");scrim.classList.remove("show")}
scrim.addEventListener("click",closeDrawer);

/* suggestions */
var sug=$("suggest");
SUGGEST.forEach(function(s){
  var c=document.createElement("button");c.type="button";c.className="suggest-card";
  c.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+s.icon+'</svg>'+esc(s.prompt);
  c.addEventListener("click",function(){if(!activeId)newConversation();sendMessage(s.prompt,false)});
  sug.appendChild(c);
});

applyLang();renderConvList();fetchModels();initAddr();renderMessages();
// 由影音圖像頁帶入的生成提示：預填輸入框（使用者確認後再送出）。
(function(){var p=sessionStorage.getItem("tacm_media_prompt");if(p){sessionStorage.removeItem("tacm_media_prompt");input.value=p;autoGrow();input.focus()}})();
})();
</script>
</body>
