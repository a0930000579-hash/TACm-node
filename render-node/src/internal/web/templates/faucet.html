{% extends "base.html" %}
{% block title %}Faucet · 水龍頭{% endblock %}
{% block content %}
<section class="pg-banner">
  <div class="pg-txt"><h1 data-i18n="fc.title">測試幣水龍頭</h1><p data-i18n="fc.sub">開發者生態：為你的地址免費領取測試 TACm</p></div>
  <svg viewBox="0 0 40 40" class="pg-art"><path d="M8 8 h24 v6 H8 Z" fill="none" stroke="#68BE8D" stroke-width="2"/><path d="M12 14 v10 h16 v-10" fill="none" stroke="#68BE8D" stroke-width="2"/><path d="M20 24 v8" stroke="#68BE8D" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="33" r="2" fill="#68BE8D"/></svg>
</section>

<section class="panel" style="max-width:640px;margin:0 auto">
  <div class="panel-head">
    <h2 data-i18n="fc.claim">領取測試幣</h2>
    <span class="tag in" data-i18n="fc.limit">每地址每日 {{ limit }} TACm</span>
  </div>
  <form id="faucetForm" class="stack" style="display:grid;gap:12px;padding:8px 0 4px">
    <div>
      <label for="fcAddr" data-i18n="fc.addrLabel">你的 tx0 地址</label>
      <input id="fcAddr" name="address" class="input mono" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-family:inherit;font-size:14px"
        placeholder="tx01... 或 0x..." required />
    </div>
    <button type="submit" class="btn primary" id="fcBtn" style="justify-self:start;padding:10px 22px;border-radius:10px;font-weight:600">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      <span data-i18n="fc.claimBtn">領取 {{ limit }} TACm</span>
    </button>
  </form>
  <div id="fcResult" style="margin-top:12px;font-size:14px"></div>
</section>

<section class="panel" style="max-width:640px;margin:14px auto 0">
  <div class="panel-head"><h2 data-i18n="fc.how">如何使用</h2></div>
  <ol class="stack" style="display:grid;gap:8px;padding:4px 0 4px 20px;font-size:14px;line-height:1.7">
    <li data-i18n="fc.step1">填入你的錢包地址（tx01... 或 0x...）後點擊領取</li>
    <li data-i18n="fc.step2">交易將由節點金鑰簽發並在數秒內上鏈</li>
    <li data-i18n="fc.step3">到「錢包」或區塊瀏覽器確認到帳（每地址每日一次）</li>
  </ol>
</section>

<script>
(function () {
  var form = document.getElementById('faucetForm');
  var btn = document.getElementById('fcBtn');
  var res = document.getElementById('fcResult');
  if (!form) { return; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var addr = document.getElementById('fcAddr').value.trim();
    if (!addr) { res.textContent = 'Please enter an address'; return; }
    btn.disabled = true;
    var old = btn.innerHTML;
    btn.innerHTML = '…';
    fetch('/api/faucet/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: addr })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (out) {
        if (out.j && out.j.ok) {
          res.innerHTML = '<span class="tag in">OK</span> tx: <a class="mono" href="/tx/' + out.j.tx_hash + '">' + out.j.tx_hash + '</a>';
        } else {
          res.textContent = (out.j && out.j.error) ? out.j.error : 'request failed';
        }
      })
      .catch(function () { res.textContent = 'network error'; })
      .finally(function () { btn.disabled = false; btn.innerHTML = old; });
  });
})();
</script>
{% endblock %}
