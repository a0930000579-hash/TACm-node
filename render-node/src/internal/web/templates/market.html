{% extends "base.html" %}
{% block title %}TAC Community · Market{% endblock %}
{% block content %}
<style>
  /* M100：市集＝FB Marketplace 佈局（亮色、行動優先） */
  body{background:#f0f2f5;color:#1c1e21;margin:0}
  .topbar,.footer,.bottom-nav{display:none!important}
  .mk-wrap{max-width:480px;margin:0 auto;padding:0 0 76px}
  .cm-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid #e4e6eb;display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
  .cm-brand{font-weight:900;font-size:23px;color:#2e7d52;flex:none;cursor:pointer}
  .cm-spacer{flex:1}
  .cm-ic{width:38px;height:38px;border-radius:50%;background:#e4e6eb;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .cm-ic svg{width:20px;height:20px;stroke:#1c1e21;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mk-top{position:sticky;top:0;z-index:49;background:rgba(255,255,255,.97);border-bottom:1px solid #e4e6eb;padding:0 14px 0}
  .mk-top .srch{display:flex;align-items:center;gap:8px;background:#f0f2f5;border-radius:999px;padding:8px 14px;min-width:0;margin-top:2px}
  .mk-top .srch svg{width:16px;height:16px;stroke:#65676b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .mk-top .srch input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:14px}
  .mk-tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
  .mk-tabs::-webkit-scrollbar{display:none}
  .mk-tabs button{background:none;border:none;padding:8px 2px;font-size:15px;font-weight:700;color:#65676b;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .mk-tabs button.on{color:#2e7d52;border-color:#2e7d52}

  /* 探索：2 欄商品格網（FB Marketplace） */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 10px 0}
  .gcard{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
  .gcard .ph{aspect-ratio:1/1;background:#e9ebee;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .gcard .ph svg{width:40px;height:40px;stroke:#b0b3b8;fill:none;stroke-width:1.5}
  .gcard .bd{padding:8px 10px 10px}
  .gcard .pr{font-weight:700;font-size:14px;color:#1c1e21}
  .gcard .ti{font-size:13px;color:#65676b;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .gcard .sold{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;z-index:2}

  /* 賣東西儀表板 */
  .sell-hero{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
  .sell-hero .ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2e7d52,#68BE8D);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
  .mk-listbtn{flex:1;background:#2e7d52;color:#fff;border:none;border-radius:999px;padding:13px;font-size:16px;font-weight:800;cursor:pointer}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 4px}
  .stat{background:#fff;border:1px solid #e4e6eb;border-radius:12px;padding:14px;position:relative}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{font-size:13px;color:#65676b;margin-top:2px}
  .stat svg{position:absolute;right:12px;top:12px;width:22px;height:22px;stroke:#65676b;fill:none;stroke-width:1.8}
  .sec-h{font-size:16px;font-weight:800;padding:16px 16px 6px}
  .my-item{background:#fff;border:1px solid #e4e6eb;border-radius:12px;margin:0 16px 10px;padding:10px;display:flex;gap:10px;align-items:center}
  .my-item .ph{width:56px;height:56px;border-radius:8px;background:#e9ebee;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .my-item .ph img{width:100%;height:100%;object-fit:cover}
  .my-item .ph svg{width:22px;height:22px;stroke:#b0b3b8;fill:none;stroke-width:1.5}
  .my-item .info{flex:1;min-width:0}
  .my-item .pr{font-weight:800;font-size:14px}
  .my-item .ti{font-size:12px;color:#65676b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .my-item .acts{display:flex;flex-direction:column;gap:6px}
  .my-item .acts button{border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .my-item .buy{background:#2e7d52;color:#fff}
  .my-item .rev{background:#e4e6eb;color:#1c1e21}

  .mk-id{display:flex;gap:8px;margin:10px 16px 0}
  .mk-id input{flex:1;border:1px solid #dddfe2;border-radius:999px;padding:9px 14px;font-size:13px;outline:none;min-width:0}
  .mk-id button{background:#2e7d52;color:#fff;border:none;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;flex:none}
  .mk-empty{text-align:center;color:#65676b;padding:40px 20px;font-size:14px}

  /* 新上層抽屜（FB 新上架表單） */
  .sheet{position:fixed;left:50%;transform:translateX(-50%);right:0;bottom:0;width:100%;max-width:480px;z-index:120;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2);display:none;flex-direction:column;max-height:92dvh}
  .sheet.open{display:flex}
  .sheet .sh{position:relative;text-align:center;padding:14px;border-bottom:1px solid #f0f2f5}
  .sheet .sh b{font-size:16px}
  .sheet .sh .x{position:absolute;left:10px;top:10px;background:#e4e6eb;border:none;border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer}
  .sheet .sh .pub{position:absolute;right:14px;top:12px;background:none;border:none;color:#2e7d52;font-weight:800;font-size:15px;cursor:pointer}
  .sheet .sb{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
  .ph-add{width:88px;height:88px;border-radius:10px;background:#f0f2f5;border:1px solid #dddfe2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#65676b;font-size:12px;overflow:hidden;flex:none}
  .ph-add svg{width:26px;height:26px;stroke:#65676b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ph-add img{width:100%;height:100%;object-fit:cover}
  .fld{border:1px solid #dddfe2;border-radius:10px;padding:12px 14px;font-size:15px;margin-top:12px;width:100%;box-sizing:border-box;outline:none;background:#fff;font-family:inherit}
  .fld::placeholder{color:#8a8d91}
  .frow{display:flex;gap:10px;margin-top:12px}
  .frow .fld{margin-top:0}
  .opt{font-size:12px;color:#65676b;margin-top:4px}

  .mk-sheet{position:fixed;left:50%;transform:translateX(-50%);right:0;bottom:0;width:100%;max-width:480px;z-index:110;background:rgba(255,255,255,.99);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:none}
  .mk-sheet.open{display:block}
  .mk-sheet h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 12px}
  .mk-sheet .row{font-size:13px;color:#65676b;margin:6px 0;word-break:break-all}
  .mk-sheet .row b{color:#1c1e21}
  .mk-sheet .ok{color:#1b8a3a;font-size:13px;font-weight:700;margin:8px 0}
  .mk-sheet .err{color:#e41e3f;font-size:13px;margin:8px 0}
  .mk-sheet .close{position:absolute;right:14px;top:12px;background:#e4e6eb;border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .mk-sheet .go{width:100%;background:#1b8a3a;color:#fff;border:none;border-radius:999px;padding:11px;font-weight:800;font-size:14px;margin-top:6px;cursor:pointer}

  .cm-bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;display:flex;padding:5px 0 calc(5px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
  .cm-bottom a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;line-height:1.1;color:#65676b;text-decoration:none;white-space:nowrap;overflow:hidden}
  .cm-bottom a svg{width:21px;height:21px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cm-bottom a.on{color:#2e7d52}
  .cm-bottom a.on svg{stroke:#2e7d52}
</style>

<div class="mk-wrap">
  <div class="cm-top">
    <div class="cm-brand" onclick="location='/community'">TACm</div>
    <div class="cm-spacer"></div>
    <button class="cm-ic" onclick="location='/community'"><svg viewBox="0 0 24 24"><path d="M12 5 V19 M5 12 H19"/></svg></button>
    <button class="cm-ic" onclick="location='/community'"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/></svg></button>
    <button class="cm-ic" onclick="TAC_I18N.toggle()"><svg viewBox="0 0 24 24"><path d="M4 5 H17 M17 5 V18 M11 9 H20 V18 M7 18 C7 19.5 5.5 20 5 20 C4.5 20 4 19.5 4 18 C4 16.5 5.5 16 7 16 C8.5 16 10 16.5 10 18"/></svg></button>
  </div>
  <div class="mk-top">
    <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/></svg><input id="mkSearch" placeholder="搜尋 Marketplace" oninput="renderList()"></div>
    <div class="mk-tabs">
      <button id="tabExplore" class="on" onclick="switchTab('explore')">探索</button>
      <button id="tabSell" onclick="switchTab('sell')">賣東西</button>
    </div>
  </div>

  <div class="mk-id">
    <input id="myAddr" placeholder="錢包地址（tx0…）" value="" readonly>
    <button onclick="setMe()">切換</button>
  </div>

  <!-- 探索：2 欄格網 -->
  <div id="viewExplore">
    <div class="grid" id="mkList"><div class="mk-empty">載入中…</div></div>
  </div>

  <!-- 賣東西儀表板 -->
  <div id="viewSell" style="display:none">
    <div class="sell-hero">
      <div class="ava" id="sellAva">?</div>
      <button class="mk-listbtn" onclick="openNewSheet()">＋ 上架商品</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="stListed">0</div><div class="l">刊登中的商品</div><svg viewBox="0 0 24 24"><path d="M20.6 13.5 L11 23 L4 16 L4 6 L13 1 L20.6 8.5 Z"/><path d="M13 1 L13 13 L4 6"/></svg></div>
      <div class="stat"><div class="n" id="stSold">0</div><div class="l">已售出</div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5 L11 15.5 L16 9"/></svg></div>
    </div>
    <div class="sec-h">你的商品</div>
    <div id="myList"></div>
  </div>
</div>

<!-- 新上架抽屜 -->
<div class="sheet" id="newSheet">
  <div class="sh"><button class="x" onclick="closeNewSheet()">×</button><b>新上架</b><button class="pub" onclick="publishItem()">發佈</button></div>
  <div class="sb">
    <div class="ph-add" id="phAdd" onclick="pickPhoto()"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17 L9 12 L13 15 L16 12 L21 16"/><path d="M12 8.5 V12 M10.2 10.2 H13.8"/></svg><span>新增相片</span></div>
    <div class="opt">相片：<span id="phCount">0</span>/1 · 請選擇商品主要相片</div>
    <input class="fld" id="mkTitle" placeholder="標題">
    <input class="fld" id="mkPrice" type="number" min="0" step="0.01" placeholder="價格（TACM）">
    <select class="fld" id="mkCat"><option value="">類別</option><option>電子產品</option><option>車輛</option><option>手錶</option><option>時尚衣物</option><option>家居生活</option><option>遊戲娛樂</option><option>其他</option></select>
    <select class="fld" id="mkCond"><option value="">狀況</option><option>全新</option><option>幾乎全新</option><option>良好</option><option>普通</option></select>
    <textarea class="fld" id="mkBody" rows="3" placeholder="說明（選填）"></textarea>
    <div class="opt" style="margin-top:10px;font-weight:700;color:#1c1e21">地點</div>
    <input class="fld" id="mkLoc" placeholder="縣市（選填）">
    <div id="mkMsg" style="font-size:12px;color:#e41e3f;margin-top:10px"></div>
  </div>
</div>
<input type="file" id="phFile" accept="image/*" style="display:none">

<div class="mk-sheet" id="buySheet">
  <button class="close" onclick="closeBuy()">關閉</button>
  <h3>確認購買</h3>
  <div id="buyInfo"></div>
  <button class="go" id="buyGo" onclick="confirmBuy()">確認付款（一鍵轉帳）</button>
</div>
<div class="mk-sheet" id="reviewSheet">
  <button class="close" onclick="closeReview()">關閉</button>
  <h3>評價商品</h3>
  <input type="hidden" id="reviewId">
  <div class="row">評分（1-5）</div>
  <select id="reviewStars" style="width:100%;padding:9px;margin:4px 0 8px;border:1px solid #dddfe2;border-radius:10px">
    <option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option><option value="2">2 星</option><option value="1">1 星</option>
  </select>
  <textarea id="reviewComment" placeholder="Comment (optional)" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #dddfe2;border-radius:10px"></textarea>
  <button class="go" style="background:#f0b90b;color:#1c1e21" onclick="rate()">送出評價</button>
  <div id="reviewMsg" style="font-size:12px;color:#e41e3f;margin-top:6px"></div>
</div>

<nav class="cm-bottom">
  <a href="/community"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 V21 H15 V14 H9 V21 H3 Z"/></svg><span>首頁</span></a>
  <a href="/community/videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg><span>影片</span></a>

  <a href="/community/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 7.5 13.5 12 13.5 C16.5 13.5 20 16 20 21"/></svg><span>個人</span></a>
</nav>

<script src="/static/js/community-wallet.js"></script>
<script>
function get(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
function post(p,b){ return fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})}).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||r.status)}); return r.json(); }); }
function shortAddr(a){ if(!a) return '—'; if(a.length<=16) return a; return a.slice(0,10)+'…'+a.slice(-6); }
function timeAgo(ts){ var d=Date.now()/1000-ts; if(d<60) return '剛剛'; if(d<3600) return Math.floor(d/60)+' 分鐘前'; if(d<86400) return Math.floor(d/3600)+' 小時前'; return Math.floor(d/86400)+' 天前'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}); }

var me = '', allItems = [];
cmBindAddr({ input:'#myAddr', onResolve:function(a){ me=a; document.getElementById('myAddr').value=a; loadMarket(); }});
function setMe(){ cmBindAddr({input:'#myAddr', onResolve:function(a){ me=a; document.getElementById('myAddr').value=a; loadMarket(); }}); }

function switchTab(t){
  document.getElementById('tabExplore').classList.toggle('on', t==='explore');
  document.getElementById('tabSell').classList.toggle('on', t==='sell');
  document.getElementById('viewExplore').style.display = t==='explore'?'block':'none';
  document.getElementById('viewSell').style.display = t==='sell'?'block':'none';
  if(t==='sell') renderMy();
}

function loadMarket(){
  get('/api/community/market').then(function(d){
    allItems = d.items||[];
    renderList();
  }).catch(function(){ document.getElementById('mkList').innerHTML='<div class="mk-empty">載入失敗</div>'; });
}
function titleOf(p){ return String((p.content||'').split('\n')[0]||'').slice(0,60); }
function renderList(){
  var q=(document.getElementById('mkSearch').value||'').trim().toLowerCase();
  var items = allItems.filter(function(p){ return !q || titleOf(p).toLowerCase().indexOf(q)>=0; });
  var el=document.getElementById('mkList');
  el.innerHTML = items.map(function(p){
    var sold = p.sold ? '<div class="sold">已售出</div>' : '';
    var ph = p.image_url
      ? '<div class="ph"><img src="'+escapeHtml(p.image_url)+'" loading="lazy" alt=""></div>'
      : '<div class="ph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17 L9 12 L13 15 L16 12 L21 16"/></svg></div>';
    return '<div class="gcard" onclick="buyIntent('+p.id+')">'+sold+ph+
      '<div class="bd"><div class="pr">NT$'+money(p.price_tacm)+'</div><div class="ti">'+escapeHtml(titleOf(p))+'</div></div></div>';
  }).join('') || '<div class="mk-empty" style="grid-column:1/3">市集尚無商品</div>';
}

function renderMy(){
  var mine = allItems.filter(function(p){ return p.address===me; });
  document.getElementById('stListed').textContent = mine.filter(function(p){return !p.sold;}).length;
  document.getElementById('stSold').textContent = mine.filter(function(p){return p.sold;}).length;
  var el=document.getElementById('myList');
  el.innerHTML = mine.map(function(p){
    var ph = p.image_url ? '<div class="ph"><img src="'+escapeHtml(p.image_url)+'" alt=""></div>'
      : '<div class="ph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17 L9 12 L13 15 L16 12 L21 16"/></svg></div>';
    return '<div class="my-item">'+ph+'<div class="info"><div class="pr">NT$'+money(p.price_tacm)+(p.sold?' <span style="color:#e41e3f;font-size:11px">已售出</span>':'')+'</div><div class="ti">'+escapeHtml(titleOf(p))+'</div></div>'+
      '<div class="acts"><button class="buy" onclick="buyIntent('+p.id+')">購買</button><button class="rev" onclick="openReview('+p.id+')">評價</button></div></div>';
  }).join('') || '<div class="mk-empty">你還沒有商品，點「上架商品」開始</div>';
}

/* 相片上傳 */
var pickedImg = null;
function openNewSheet(){
  if(!me){ alert('請先於錢包中心選擇錢包地址'); return; }
  document.getElementById('newSheet').classList.add('open');
}
function closeNewSheet(){ document.getElementById('newSheet').classList.remove('open'); }
function pickPhoto(){ document.getElementById('phFile').click(); }
document.getElementById('phFile').addEventListener('change', function(){
  var f=this.files[0]; if(!f) return;
  var fd=new FormData(); fd.append('file', f);
  document.getElementById('phAdd').innerHTML='<span>上傳中…</span>';
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok) throw new Error(j.error||'upload failed');
    pickedImg=j.url;
    document.getElementById('phAdd').innerHTML='<img src="'+j.url+'" alt="">';
    document.getElementById('phCount').textContent='1';
  }).catch(function(e){ document.getElementById('phAdd').innerHTML='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17 L9 12 L13 15 L16 12 L21 16"/></svg><span>新增相片</span>'; alert('上傳失敗：'+e); });
});

function publishItem(){
  var title=document.getElementById('mkTitle').value.trim();
  var price=parseFloat(document.getElementById('mkPrice').value);
  var cat=document.getElementById('mkCat').value;
  var cond=document.getElementById('mkCond').value;
  var body=document.getElementById('mkBody').value.trim();
  var loc=document.getElementById('mkLoc').value.trim();
  if(!title || !(price>0)){ document.getElementById('mkMsg').textContent='請填寫商品名稱與價格'; return; }
  var content=title + (cat?'\n【類別】'+cat:'') + (cond?'\n【狀況】'+cond:'') + (loc?'\n【地點】'+loc:'') + (body?'\n'+body:'');
  document.getElementById('mkMsg').textContent='';
  post('/api/community/market/create', {address:me, title:title, body:content, price_tacm:price, image_url:pickedImg||null}).then(function(){
    closeNewSheet();
    document.getElementById('mkTitle').value=''; document.getElementById('mkPrice').value=''; document.getElementById('mkBody').value=''; document.getElementById('mkLoc').value='';
    document.getElementById('phAdd').innerHTML='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17 L9 12 L13 15 L16 12 L21 16"/></svg><span>新增相片</span>';
    document.getElementById('phCount').textContent='0'; pickedImg=null;
    loadMarket();
  }).catch(function(e){ document.getElementById('mkMsg').textContent='上架失敗：'+e; });
}

function buyIntent(id){
  if(!me){ alert('請先輸入錢包地址'); return; }
  get('/api/community/market/'+id+'/buy-intent?address='+encodeURIComponent(me)).then(function(d){
    document.getElementById('buySheet').classList.add('open');
    document.getElementById('buyInfo').innerHTML =
      '<div class="row">商品 ID：<b>#'+id+'</b></div>'+
      '<div class="row">賣家：<b>'+shortAddr(d.to)+'</b></div>'+
      '<div class="row">金額：<b>NT$'+money(d.amount_tacm)+'</b></div>'+
      '<div class="row">鏈上費：<b>NT$'+money(d.fee_tacm||0)+'</b></div>'+
      '<div class="row">合計：<b>NT$'+money(Number(d.amount_tacm)+Number(d.fee_tacm||0))+'</b></div>'+
      '<div class="row">memo：<b>'+d.memo+'</b></div>';
    document.getElementById('buyGo').dataset.id = id;
  }).catch(function(e){ alert('購買意向失敗：'+e); });
}
function confirmBuy(){
  var id=document.getElementById('buyGo').dataset.id;
  var btn=document.getElementById('buyGo'); btn.disabled=true; btn.textContent='處理中…';
  post('/api/community/market/'+id+'/buy', {address:me}).then(function(d){
    document.getElementById('buyInfo').innerHTML =
      '<div class="ok">付款成功　實付 NT$'+money(d.fee_tacm||0)+' 鏈上費</div>'+
      '<div class="row">賣家：<b>'+shortAddr(d.to)+'</b></div>';
    setTimeout(function(){ document.getElementById('buySheet').classList.remove('open'); loadMarket(); },1200);
  }).catch(function(e){
    document.getElementById('buyInfo').innerHTML='<div class="err">'+e+'</div>';
    btn.disabled=false; btn.textContent='確認付款（一鍵轉帳）';
  });
}
function closeBuy(){ document.getElementById('buySheet').classList.remove('open'); }
function openReview(id){
  if(!me){ alert('請先輸入錢包地址'); return; }
  document.getElementById('reviewSheet').classList.add('open');
  document.getElementById('reviewId').value=id; document.getElementById('reviewComment').value=''; document.getElementById('reviewMsg').textContent='';
}
function rate(){
  var id=document.getElementById('reviewId').value;
  post('/api/community/market/'+id+'/review', {address:me, rating:parseInt(document.getElementById('reviewStars').value||'5',10), comment:document.getElementById('reviewComment').value.trim()}).then(function(){
    document.getElementById('reviewSheet').classList.remove('open'); loadMarket();
  }).catch(function(e){ document.getElementById('reviewMsg').textContent='評價失敗：'+e; });
}
function closeReview(){ document.getElementById('reviewSheet').classList.remove('open'); }
</script>
{% endblock %}
