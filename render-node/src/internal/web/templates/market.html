{% extends "base.html" %}
{% block title %}TAC Community · Market{% endblock %}
{% block content %}
<style>
  /* M97：市集獨立頁（FB 風格極簡亮色，禁黑） */
  body{background:#f0f2f5;color:#1c1e21;margin:0}
  .topbar,.footer,.bottom-nav{display:none!important}
  .mk-wrap{max-width:480px;margin:0 auto;padding:0 0 72px}
  .mk-top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);border-bottom:1px solid #dddfe2;display:flex;align-items:center;gap:10px;padding:10px 14px}
  .mk-top button{background:none;border:none;padding:6px;border-radius:50%;cursor:pointer}
  .mk-top button svg{width:22px;height:22px;stroke:#1c1e21;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mk-top .t{font-weight:800;font-size:16px}
  .mk-id{display:flex;gap:8px;margin:12px 16px}
  .mk-id input{flex:1;border:1px solid #dddfe2;border-radius:999px;padding:10px 14px;font-size:14px;outline:none;min-width:0}
  .mk-id button{background:#1877f2;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;flex:none}
  .mk-sell{background:#fff;border:1px solid #dddfe2;border-radius:14px;margin:0 16px;padding:14px}
  .mk-sell h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 10px}
  .mk-sell h3 svg{width:18px;height:18px;stroke:#e41e3f;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mk-sell input,.mk-sell textarea{width:100%;box-sizing:border-box;border:1px solid #dddfe2;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:8px;outline:none;font-family:inherit}
  .mk-sell .row2{display:flex;gap:8px}
  .mk-sell .row2 input{flex:1}
  .mk-btn{width:100%;background:#1877f2;color:#fff;border:none;border-radius:999px;padding:10px;font-weight:800;font-size:14px;cursor:pointer}
  .mk-sec{margin:18px 16px 4px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
  .mk-sec svg{width:18px;height:18px;stroke:#e41e3f;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mk-item{background:#fff;border:1px solid #dddfe2;border-radius:12px;margin:0 16px 10px;padding:12px}
  .mk-item .it-t{font-weight:700;font-size:14px;word-break:break-word;line-height:1.5}
  .mk-item .it-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:#65676b;margin-top:4px;flex-wrap:wrap}
  .mk-item .it-price{font-weight:800;color:#1b8a3a;font-size:15px}
  .mk-item img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
  .mk-item .it-acts{display:flex;gap:6px;margin-top:8px}
  .mk-item .it-acts button{flex:1;border:none;border-radius:999px;padding:8px;font-size:13px;font-weight:700;cursor:pointer}
  .mk-item .it-acts .buy{background:#1b8a3a;color:#fff}
  .mk-item .it-acts .rev{background:#f0b90b;color:#1c1e21}
  .mk-item .it-acts .sold{background:#e4e6eb;color:#65676b}
  .mk-empty{text-align:center;color:#65676b;padding:40px 20px;font-size:14px}
  .mk-sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.98);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s ease}
  .mk-sheet.open{transform:translateY(0)}
  .mk-sheet h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 12px}
  .mk-sheet .row{font-size:13px;color:#65676b;margin:6px 0;word-break:break-all}
  .mk-sheet .row b{color:#1c1e21}
  .mk-sheet .ok{color:#1b8a3a;font-size:13px;font-weight:700;margin:8px 0}
  .mk-sheet .err{color:#e41e3f;font-size:13px;margin:8px 0}
  .mk-sheet .close{position:absolute;right:14px;top:12px;background:#e4e6eb;border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
  .mk-sheet .go{width:100%;background:#1b8a3a;color:#fff;border:none;border-radius:999px;padding:11px;font-weight:800;font-size:14px;margin-top:6px}
  .mk-sheet select,.mk-sheet textarea{width:100%;box-sizing:border-box;border:1px solid #dddfe2;border-radius:10px;padding:9px;font-size:13px;margin:4px 0 8px;font-family:inherit}
  .mk-bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .mk-bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#65676b;text-decoration:none}
  .mk-bottom a svg{width:22px;height:22px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mk-bottom a.on{color:#1877f2}
  .mk-bottom a.on svg{stroke:#1877f2}
</style>

<div class="mk-wrap">
  <div class="mk-top">
    <button onclick="location='/community'"><svg viewBox="0 0 24 24"><path d="M19 12 H6 M11 6 L5 12 L11 18"/></svg></button>
    <div class="t"><svg viewBox="0 0 28 28" style="width:20px;height:20px;vertical-align:-4px;stroke:#1877f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px"><path d="M14 4 C8 4 5 9 5 14 c0 4 2 7 4 9 v2 h10 v-2 c2-2 4-5 4-9 C23 9 20 4 14 4 Z"/><circle cx="14" cy="13" r="3.4"/><path d="M10.5 21.5 h7"/></svg><span data-i18n="cm.brand">TAC 社群</span></div>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button onclick="location='/community/ads'"><svg viewBox="0 0 24 24"><path d="M3 11 V15 H5 L9 19 V7 L5 11 Z"/><path d="M13 8 C15 9.5 15 14.5 13 16"/><path d="M17 5 C20.5 8 20.5 16 17 19"/></svg></button>
      <button onclick="TAC_I18N.toggle()">EN</button>
    </div>
  </div>

  <div class="mk-id">
    <input id="myAddr" placeholder="enter wallet address (tx0)…" value="">
    <button onclick="setMe()"><span data-i18n="cm.switch">切換</span></button>
  </div>

  <div class="mk-sell">
    <h3><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span data-i18n="cm.sell">發布商品</span></h3>
    <input id="mkTitle" placeholder="item name / 商品名稱">
    <textarea id="mkBody" placeholder="description / 商品描述"></textarea>
    <div class="row2">
      <input id="mkPrice" type="number" min="0" step="0.01" placeholder="price TACM">
      <input id="mkImg" placeholder="image url (optional)">
    </div>
    <button class="mk-btn" onclick="publishItem()"><span data-i18n="cm.listItem">上架</span></button>
    <div id="mkMsg" style="font-size:12px;color:#e41e3f;margin-top:8px"></div>
  </div>

  <div class="mk-sec"><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span data-i18n="cm.market">市集</span></div>
  <div id="mkList"><div class="mk-empty">載入中…</div></div>
</div>

<div class="mk-sheet" id="buySheet">
  <button class="close" onclick="closeBuy()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h3><span data-i18n="cm.buyTitle">確認購買</span></h3>
  <div id="buyInfo"></div>
  <button class="go" id="buyGo" onclick="confirmBuy()"><span data-i18n="cm.confirmPay">確認付款（一鍵轉帳）</span></button>
</div>
<div class="mk-sheet" id="reviewSheet">
  <button class="close" onclick="closeReview()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h3><span data-i18n="cm.rateItem">評價市集商品</span></h3>
  <input type="hidden" id="reviewId">
  <div class="row"><span data-i18n="cm.rating">評分（1-5）</span></div>
  <select id="reviewStars">
    <option value="5">5 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg></option>
    <option value="4">4 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg></option>
    <option value="3">3 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg></option>
    <option value="2">2 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg></option>
    <option value="1">1 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg></option>
  </select>
  <textarea id="reviewComment" placeholder="Comment (optional)"></textarea>
  <button class="go" style="background:#f0b90b;color:#1c1e21" onclick="rate()"><span data-i18n="cm.submit">送出評價</span></button>
  <div id="reviewMsg" style="font-size:12px;color:#e41e3f;margin-top:6px"></div>
</div>

<nav class="mk-bottom">
  <a href="/community"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 V21 H15 V14 H9 V21 H3 Z"/></svg><span data-i18n="cm.home">首頁</span></a>
  <a href="/community/videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg><span data-i18n="cm.video">影片</span></a>
  <a href="/community/friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20 C2.5 15.5 5 13 9 13 C13 13 15.5 15.5 15.5 20"/><circle cx="17" cy="9" r="2.8"/><path d="M16 13.5 C19 13.5 21.5 15.5 21.5 19"/></svg><span data-i18n="cm.friends">好友</span></a>
  <a href="/community/market" class="on"><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span data-i18n="cm.market">市集</span></a>
  <a href="/community/notifications"><svg viewBox="0 0 24 24"><path d="M12 3 C8 3 6 6 6 9.5 V15 L4 17 H20 L18 15 V9.5 C18 6 16 3 12 3 Z"/><path d="M9.5 20 C10 21.5 11 22 12 22 C13 22 14 21.5 14.5 20"/></svg><span data-i18n="cm.notify">通知</span></a>
  <a href="/community/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 7.5 13.5 12 13.5 C16.5 13.5 20 16 20 21"/></svg><span data-i18n="cm.me">個人</span></a>
</nav>

<script>
function get(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
function post(p,b){ return fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})}).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||r.status)}); return r.json(); }); }
function shortAddr(a){ if(!a) return '—'; if(a.length<=16) return a; return a.slice(0,10)+'…'+a.slice(-6); }
function timeAgo(ts){ var d=Date.now()/1000-ts; if(d<60) return TAC_TE('剛剛'); if(d<3600) return Math.floor(d/60)+TAC_TE(' 分鐘前'); if(d<86400) return Math.floor(d/3600)+TAC_TE(' 小時前'); return Math.floor(d/86400)+TAC_TE(' 天前'); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var me = localStorage.getItem('cm_id') || '';
function setMe(){ me = document.getElementById('myAddr').value.trim(); localStorage.setItem('cm_id', me); loadMarket(); }
document.getElementById('myAddr').value = me;
get('/status').then(function(st){ if(!me){ me = st.address||''; document.getElementById('myAddr').value = me; } loadMarket(); }).catch(function(){ loadMarket(); });

function loadMarket(){
  var el = document.getElementById('mkList');
  get('/api/community/market').then(function(d){
    var items = d.items||[];
    el.innerHTML = items.map(function(p){
      var soldTag = p.sold ? '<span class="mk-tag">'+TAC_TE('已售出')+'</span>' : '';
      var btn = p.sold
        ? '<button class="sold" disabled>'+TAC_TE('已售出')+'</button>'
        : '<button class="buy" onclick="buyIntent('+p.id+')">'+TAC_TE('購買')+'</button>';
      var price = '<div class="it-price">'+Number(p.price_tacm||0).toLocaleString('en-US',{maximumFractionDigits:4})+' TACM</div>';
      var img = p.image_url ? '<img src="'+escapeHtml(p.image_url)+'" loading="lazy" alt="">' : '';
      return '<div class="mk-item"><div class="it-t">'+escapeHtml((p.content||'').replace(/<[^>]+>/g,' ').replace(/\n/g,' ').slice(0,80))+' '+soldTag+'</div>'+
        '<div class="it-meta">'+price+'<span>'+starsHTML(p.rating||0, p.rating_count||0, p.id)+'</span></div>'+img+
        '<div class="it-meta">'+TAC_TE('賣家')+' '+shortAddr(p.address)+' · '+timeAgo(p.created_at)+'</div>'+
        '<div class="it-acts">'+btn+'<button class="rev" onclick="openReview('+p.id+')">'+TAC_TE('評價')+'</button></div></div>';
    }).join('') || '<div class="mk-empty">'+TAC_TE('市集尚無商品')+'</div>';
  }).catch(function(){ el.innerHTML = '<div class="mk-empty">'+TAC_TE('載入失敗')+'</div>'; });
}

function publishItem(){
  var addr = me || document.getElementById('myAddr').value.trim();
  if(!addr){ document.getElementById('mkMsg').textContent = TAC_TE('請先輸入你的錢包地址'); return; }
  me = addr; localStorage.setItem('cm_id', me);
  var title = document.getElementById('mkTitle').value.trim();
  var body = document.getElementById('mkBody').value.trim();
  var price = parseFloat(document.getElementById('mkPrice').value);
  var img = document.getElementById('mkImg').value.trim();
  var content = title + (body ? '\n' + body : '');
  if(!title || !(price>0)){ document.getElementById('mkMsg').textContent = TAC_TE('請填寫商品名稱與價格'); return; }
  post('/api/community/market/create', {address:me, title:title, body:content, price_tacm:price, image_url:img||null}).then(function(){
    document.getElementById('mkTitle').value=''; document.getElementById('mkBody').value=''; document.getElementById('mkPrice').value=''; document.getElementById('mkImg').value='';
    document.getElementById('mkMsg').textContent=''; loadMarket();
  }).catch(function(e){ document.getElementById('mkMsg').textContent = TAC_TE('上架失敗：')+e; });
}

function buyIntent(id){
  if(!me){ document.getElementById('mkMsg').textContent = TAC_TE('請先輸入你的錢包地址'); return; }
  get('/api/community/market/'+id+'/buy-intent?address='+encodeURIComponent(me)).then(function(d){
    document.getElementById('buySheet').classList.add('open');
    document.getElementById('buyInfo').innerHTML =
      '<div class="row">'+TAC_TE('商品 ID')+'：<b>#'+id+'</b></div>'+
      '<div class="row">'+TAC_TE('賣家')+'：<b>'+shortAddr(d.to)+'</b></div>'+
      '<div class="row">'+TAC_TE('金額')+'：<b>'+Number(d.amount_tacm).toLocaleString('en-US',{maximumFractionDigits:4})+' TACM</b></div>'+
      '<div class="row">'+TAC_TE('鏈上費')+'：<b>'+Number(d.fee_tacm||0).toLocaleString('en-US',{maximumFractionDigits:4})+' TACM</b></div>'+
      '<div class="row">'+TAC_TE('合計')+'：<b>'+(Number(d.amount_tacm)+Number(d.fee_tacm||0)).toLocaleString('en-US',{maximumFractionDigits:4})+' TACM</b></div>'+
      '<div class="row">memo：<b>'+d.memo+'</b></div>';
    document.getElementById('buyGo').dataset.id = id;
  }).catch(function(e){ alert(TAC_TE('購買意向失敗：')+e); });
}
function confirmBuy(){
  var id = document.getElementById('buyGo').dataset.id;
  var btn = document.getElementById('buyGo'); btn.disabled = true; btn.textContent = TAC_TE('處理中…');
  post('/api/community/market/'+id+'/buy', {address:me}).then(function(d){
    document.getElementById('buyInfo').innerHTML =
      '<div class="ok">'+TAC_TE('付款成功　實付 ')+Number(d.fee_tacm||0).toLocaleString('en-US',{maximumFractionDigits:4})+TAC_TE(' TACM 鏈上費（已入資金池）')+'</div>'+
      '<div class="row">'+TAC_TE('賣家')+'：<b>'+shortAddr(d.to)+'</b></div>'+
      '<div class="row">memo：<b>'+d.memo+'</b></div>';
    setTimeout(function(){ document.getElementById('buySheet').classList.remove('open'); loadMarket(); }, 1200);
  }).catch(function(e){
    document.getElementById('buyInfo').innerHTML = '<div class="err"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg> '+e+'</div>';
    btn.disabled = false; btn.textContent = TAC_TE('確認付款（一鍵轉帳）');
  });
}
function closeBuy(){ document.getElementById('buySheet').classList.remove('open'); }

function starsHTML(avg, n, pid){
  if(!n){ return '<span class="cm-stars" onclick="openReviews(event,'+pid+')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg> (0)</span>'; }
  var full = Math.round(avg); var s = '';
  for(var i=1;i<=5;i++){ s += (i<=full)?'':''; }
  return '<span class="cm-stars" onclick="openReviews(event,'+pid+')">'+s+' ('+n+')</span>';
}
function openReviews(ev, id){
  ev.stopPropagation();
  get('/api/community/market/'+id+'/reviews').then(function(d){
    var list = (d.items||[]);
    var html = list.map(function(r){
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M12 3l2.8 6 6.2.6-4.6 4.2 1.3 6.2L12 17l-5.7 3 1.3-6.2L3 9.6 9.2 9 12 3z"/></svg>'.repeat(r.rating) + ' ' + shortAddr(r.address) + ' ' + timeAgo(r.created_at) + (r.comment?' — '+r.comment:'');
    }).join('\n') || TAC_TE('尚無評價');
    alert('Reviews (' + list.length + ')\n\n' + html);
  }).catch(function(){});
}
function openReview(id){
  if(!me){ document.getElementById('mkMsg').textContent = TAC_TE('請先輸入你的錢包地址'); return; }
  document.getElementById('reviewSheet').classList.add('open');
  document.getElementById('reviewId').value = id;
  document.getElementById('reviewStars').value = 5;
  document.getElementById('reviewComment').value = '';
  document.getElementById('reviewMsg').textContent = '';
}
function rate(){
  var id = document.getElementById('reviewId').value;
  var rating = parseInt(document.getElementById('reviewStars').value||'5', 10);
  var comment = document.getElementById('reviewComment').value.trim();
  post('/api/community/market/'+id+'/review', {address:me, rating:rating, comment:comment}).then(function(){
    document.getElementById('reviewSheet').classList.remove('open'); loadMarket();
  }).catch(function(e){ document.getElementById('reviewMsg').textContent = TAC_TE('評價失敗：')+e; });
}
function closeReview(){ document.getElementById('reviewSheet').classList.remove('open'); }
</script>
{% endblock %}
