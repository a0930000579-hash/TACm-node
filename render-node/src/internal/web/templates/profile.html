{% extends "base.html" %}
{% block title %}TAC Community · Profile{% endblock %}
{% block content %}
<style>
  /* M95：個人主頁（FB 風：封面＋頭像＋鏈上資產＋統計＋我的貼文，全亮色） */
  body{background:#f0f2f5;color:#1c1e21;margin:0}
  .topbar,.footer,.bottom-nav{display:none!important}
  .pf-wrap{max-width:480px;margin:0 auto;padding:0 0 72px}
  .pf-top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);border-bottom:1px solid #dddfe2;display:flex;align-items:center;gap:10px;padding:10px 14px}
  .pf-top button{background:none;border:none;padding:6px;border-radius:50%;cursor:pointer}
  .pf-top button svg{width:22px;height:22px;stroke:#1c1e21;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pf-top .t{font-weight:800;font-size:16px}
  .pf-cover{height:150px;background:linear-gradient(135deg,#1877f2,#68BE8D,#f0b90b);position:relative;border-radius:0 0 14px 14px}
  .pf-ava{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:#1877f2;border:4px solid #fff;position:absolute;left:16px;bottom:-42px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .pf-head{padding:52px 16px 12px}
  .pf-head .addr{font-weight:800;font-size:18px;word-break:break-all}
  .pf-head .full{font-size:12px;color:#65676b;word-break:break-all;margin-top:2px}
  .pf-head .stats{display:flex;gap:6px;margin-top:10px;font-size:13px;color:#65676b;flex-wrap:wrap}
  .pf-head .stats b{color:#1c1e21}
    .pf-name-row{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:#1c1e21;margin-top:4px}
  .pf-edit{display:inline-flex;align-items:center;gap:4px;background:#e4e6eb;border:none;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:#65676b;cursor:pointer}
  .pf-edit svg{width:14px;height:14px;stroke:#65676b;fill:none;stroke-width:1.8}
  .pf-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
  .pf-modal-box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:360px}
  .pf-modal-box h3{margin:0 0 12px;font-size:16px}
  .pf-modal-box label{display:block;font-size:12px;color:#65676b;margin:10px 0 4px}
  .pf-modal-box input{width:100%;box-sizing:border-box;border:1px solid #dddfe2;border-radius:8px;padding:9px 10px;font-size:13px}
  .pf-modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .pf-modal-acts button{background:#e4e6eb;border:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .pf-modal-acts button.blue{background:#1877f2;color:#fff}
  .pf-ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .pf-ava.photo{background:#fff}
  .pf-post .hd .op{display:inline-flex;gap:6px;margin-left:6px}
  .pf-post .hd .op button{background:#e4e6eb;border:none;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;color:#65676b;cursor:pointer}
  .pf-post .hd .op button.del{color:#e41e3f}
  .pf-actions{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
  .pf-btn{flex:1;min-width:120px;background:#e4e6eb;border:none;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:700;color:#1c1e21;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .pf-btn svg{width:16px;height:16px;stroke:#1c1e21;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pf-btn.blue{background:#1877f2;color:#fff}
  .pf-btn.blue svg{stroke:#fff}
  .pf-assets{background:#fff;border:1px solid #dddfe2;border-radius:14px;margin:0 16px;padding:14px}
  .pf-assets h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 12px}
  .pf-assets h3 svg{width:18px;height:18px;stroke:#1877f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pf-asset-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:14px}
  .pf-asset-row:last-child{border-bottom:none}
  .pf-asset-row .sym{font-weight:700}
  .pf-asset-row .amt{font-weight:800}
  .pf-asset-row .amt.usd{color:#f0b90b}.pf-asset-row .amt.tacm{color:#1877f2}.pf-asset-row .amt.tiusd{color:#31a24c}
  .pf-posts{margin:16px 0 0}
  .pf-posts h3{display:flex;align-items:center;gap:8px;font-size:14px;padding:0 16px;margin:0 0 10px}
  .pf-posts h3 svg{width:18px;height:18px;stroke:#1877f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pf-post{background:#fff;border:1px solid #dddfe2;border-radius:12px;margin:0 16px 10px;padding:12px}
  .pf-post .hd{display:flex;align-items:center;gap:8px;font-size:13px;color:#65676b;margin-bottom:6px}
  .pf-post .bd{font-size:14px;line-height:1.5}
  .pf-post .media{max-width:100%;border-radius:10px;margin-top:8px}
  .pf-post .media video{width:100%;max-height:320px;border-radius:10px;background:#f0f2f5}
  .pf-empty{color:#65676b;font-size:13px;padding:8px 16px}
  .pf-bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .pf-bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#65676b;text-decoration:none}
  .pf-bottom a svg{width:22px;height:22px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pf-bottom a.on{color:#1877f2}
  .pf-bottom a.on svg{stroke:#1877f2}
  .pf-id{display:flex;gap:8px;margin:12px 16px}
  .pf-id input{flex:1;border:1px solid #dddfe2;border-radius:999px;padding:10px 14px;font-size:14px;outline:none}
  .pf-id button{background:#1877f2;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px}
</style>

<div class="pf-wrap">
  <div class="pf-top">
    <button onclick="location='/community'"><svg viewBox="0 0 24 24"><path d="M19 12 H6 M11 6 L5 12 L11 18"/></svg></button>
    <div class="t"><svg viewBox="0 0 28 28" style="width:20px;height:20px;vertical-align:-4px;stroke:#1877f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px"><path d="M14 4 C8 4 5 9 5 14 c0 4 2 7 4 9 v2 h10 v-2 c2-2 4-5 4-9 C23 9 20 4 14 4 Z"/><circle cx="14" cy="13" r="3.4"/><path d="M10.5 21.5 h7"/></svg><span data-i18n="cm.brand">TAC 社群</span></div>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button onclick="location='/community/ads'"><svg viewBox="0 0 24 24"><path d="M3 11 V15 H5 L9 19 V7 L5 11 Z"/><path d="M13 8 C15 9.5 15 14.5 13 16"/><path d="M17 5 C20.5 8 20.5 16 17 19"/></svg></button>
      <button onclick="TAC_I18N.toggle()">EN</button>
    </div>
  </div>

  <div class="pf-id">
    <input id="myAddr" placeholder="enter wallet address (tx0)…" value="">
    <button onclick="setMe()" data-i18n="cm.switch">切換</button>
  </div>

  <div class="pf-cover"><div class="pf-ava" id="pfAva">?</div></div>
  <div class="pf-head">
    <div class="addr" id="pfAddr">—</div>
    <div class="pf-name-row"><span id="pfName">—</span><button class="pf-edit" onclick="openEditProfile()"><svg viewBox="0 0 24 24"><path d="M4 20 L4 15.5 L15.5 4 C16.9 2.6 19.1 2.6 20.5 4 C21.9 5.4 21.9 7.6 20.5 8.5 L9 20 Z"/><path d="M13.5 6 L18 10.5"/></svg><span data-i18n="cm.editProfile">編輯</span></button></div>
    <div class="full" id="pfFull">—</div>
    <div class="stats" id="pfStats"></div>
  </div>
  <div class="pf-modal" id="pfModal" style="display:none">
    <div class="pf-modal-box">
      <h3 data-i18n="cm.editProfile">編輯個人資料</h3>
      <label data-i18n="cm.dispName">對外顯示名稱</label>
      <input id="pfNameIn" maxlength="40" placeholder="輸入顯示名稱…" data-i18n-placeholder="cm.namePh">
      <label data-i18n="cm.avatar">個人頭像（圖片網址或上傳後網址）</label>
      <input id="pfAvaIn" placeholder="https://… 或 /static/…" data-i18n-placeholder="cm.avaPh">
      <div class="pf-modal-acts">
        <button onclick="closeEditProfile()" data-i18n="cm.cancel">取消</button>
        <button class="blue" onclick="saveProfile()" data-i18n="cm.save">儲存</button>
      </div>
    </div>
  </div>
  <div class="pf-actions">
    <button class="pf-btn blue" onclick="location='/wallet'"><svg viewBox="0 0 24 24"><path d="M3 7 V19 C3 20.1 3.9 21 5 21 H19 C20.1 21 21 20.1 21 19 V14 M3 7 C3 5.9 3.9 5 5 5 H18 C19.1 5 20 5.9 20 7 V8 M16 15 H16.01"/></svg><span data-i18n="cm.myWallet">我的錢包</span></button>
    <button class="pf-btn" onclick="location='/mining'"><svg viewBox="0 0 24 24"><path d="M12 3 L19 7 V17 L12 21 L5 17 V7 Z"/><path d="M12 3 V21 M5 7 L19 17 M19 7 L5 17"/></svg><span data-i18n="cm.myMiner">我的礦機</span></button>
    <button class="pf-btn" onclick="location='/exchange'"><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span data-i18n="cm.exchange">交易所</span></button>
    <button class="pf-btn" style="background:#f3e8ff;color:#9c27b0" onclick="location='/community/ads'"><svg viewBox="0 0 24 24" style="stroke:#9c27b0"><path d="M3 11 V15 H5 L9 19 V7 L5 11 Z"/><path d="M13 8 C15 9.5 15 14.5 13 16"/><path d="M17 5 C20.5 8 20.5 16 17 19"/></svg><span data-i18n="cm.myAds">我的廣告</span></button>
    <button class="pf-btn" onclick="location='/community'"><svg viewBox="0 0 24 24"><path d="M12 20 C6 15.5 3 11.5 3 8.2 C3 5.6 5 4 7.2 4 C9 4 10.5 5 12 7 C13.5 5 15 4 16.8 4 C19 4 21 5.6 21 8.2 C21 11.5 18 15.5 12 20 Z"/></svg><span data-i18n="cm.myPosts">我的貼文</span></button>
  </div>

  <div class="pf-assets">
    <h3><svg viewBox="0 0 24 24"><path d="M3 7 V19 C3 20.1 3.9 21 5 21 H19 C20.1 21 21 20.1 21 19 V14 M3 7 C3 5.9 3.9 5 5 5 H18 C19.1 5 20 5.9 20 7 V8 M16 15 H16.01"/></svg><span data-i18n="cm.chainAssets">鏈上資產</span></h3>
    <div class="pf-asset-row"><span class="sym">TACM</span><span class="amt tacm" id="aTacm">—</span></div>
    <div class="pf-asset-row"><span class="sym">TiUSD</span><span class="amt tiusd" id="aTiusd">—</span></div>
    <div class="pf-asset-row"><span class="sym">USDT</span><span class="amt usd" id="aUsdt">—</span></div>
    <div class="pf-asset-row"><span class="sym">互動積分</span><span class="amt" id="aPts">—</span></div>
    <div class="pf-asset-row"><span class="sym">交易所餘額（TACM）</span><span class="amt" id="aEx">—</span></div>
  </div>

  <div class="pf-posts">
    <h3><svg viewBox="0 0 24 24"><path d="M4 20 L4 15.5 L15.5 4 C16.9 2.6 19.1 2.6 20.5 4 C21.9 5.4 21.9 7.6 20.5 8.5 L9 20 Z"/><path d="M13.5 6 L18 10.5"/></svg><span data-i18n="cm.myPosts">我的貼文</span></h3>
    <div id="pfPosts"></div>
  </div>
</div>

<nav class="pf-bottom">
  <a href="/community"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 V21 H15 V14 H9 V21 H3 Z"/></svg><span data-i18n="cm.home">首頁</span></a>
  <a href="/community/videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg><span data-i18n="cm.video">影片</span></a>
  <a href="/community/friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20 C2.5 15.5 5 13 9 13 C13 13 15.5 15.5 15.5 20"/><circle cx="17" cy="9" r="2.8"/><path d="M16 13.5 C19 13.5 21.5 15.5 21.5 19"/></svg><span data-i18n="cm.friends">好友</span></a>
  <a href="/community/market"><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span data-i18n="cm.market">市集</span></a>
  <a href="/community/notifications"><svg viewBox="0 0 24 24"><path d="M12 3 C8 3 6 6 6 9.5 V15 L4 17 H20 L18 15 V9.5 C18 6 16 3 12 3 Z"/><path d="M9.5 20 C10 21.5 11 22 12 22 C13 22 14 21.5 14.5 20"/></svg><span data-i18n="cm.notify">通知</span></a>
  <a href="/community/profile" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 7.5 13.5 12 13.5 C16.5 13.5 20 16 20 21"/></svg><span data-i18n="cm.me">個人</span></a>
</nav>

<script>
function get(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
function post(p,b){ return fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})}).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||r.status)}); return r.json(); }); }
var me = (localStorage.getItem('cm_id')||'');
if(!me){ try{ me = localStorage.getItem('tac_guest_addr')||''; }catch(e){} }
function shortAddr(a){ if(!a) return '—'; if(a.length<=16) return a; return a.slice(0,10)+'…'+a.slice(-6); }
function timeAgo(ts){ var d=Date.now()/1000-ts; if(d<60) return '剛剛'; if(d<3600) return Math.floor(d/60)+' 分鐘前'; if(d<86400) return Math.floor(d/3600)+' 小時前'; return Math.floor(d/86400)+' 天前'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setMe(){ me = document.getElementById('myAddr').value.trim(); localStorage.setItem('cm_id', me); load(); }
document.getElementById('myAddr').value = me;
window.addEventListener('DOMContentLoaded', function(){
  if(!me){ get('/status').then(function(st){ me = st.address||''; document.getElementById('myAddr').value = me; load(); }).catch(function(){ load(); }); } else { load(); }
});

function load(){
  if(!me){ document.getElementById('pfAddr').textContent='—'; document.getElementById('pfPosts').innerHTML='<div class="pf-empty">'+TAC_TE('請先輸入你的錢包地址（tx0 開頭）')+'</div>'; return; }
  var avaEl = document.getElementById('pfAva');
  avaEl.textContent = me.slice(0,1).toUpperCase();
  avaEl.classList.remove('photo'); avaEl.querySelectorAll('img').forEach(function(i){i.remove();});
  document.getElementById('pfAddr').textContent = shortAddr(me);
  document.getElementById('pfFull').textContent = me;
  document.getElementById('pfName').textContent = TAC_TE('未命名');
  Promise.all([
    get('/api/me/assets?address='+encodeURIComponent(me)),
    get('/api/community/feed?limit=200'),
    get('/api/community/following?address='+encodeURIComponent(me)),
    get('/api/community/followers?address='+encodeURIComponent(me)),
    get('/api/community/profile/meta?address='+encodeURIComponent(me)).catch(function(){ return {address:me}; })
  ]).then(function(res){
    var a = res[0];
    var pr = res[4]||{address:me};
    document.getElementById('pfName').textContent = (pr.display_name||'') || TAC_TE('未命名');
    document.getElementById('pfNameIn').value = pr.display_name||'';
    document.getElementById('pfAvaIn').value = pr.avatar_url||'';
    if(pr.avatar_url){
      avaEl.classList.add('photo');
      var im = document.createElement('img'); im.src = pr.avatar_url;
      im.onerror = function(){ avaEl.classList.remove('photo'); avaEl.innerHTML=''; avaEl.textContent = me.slice(0,1).toUpperCase(); };
      avaEl.innerHTML=''; avaEl.appendChild(im);
    } else {
      avaEl.classList.remove('photo'); avaEl.innerHTML=''; avaEl.textContent = me.slice(0,1).toUpperCase();
    }
    var w = a.wallet||{}, ex = a.exchange||{}, cm = a.community||{}, exa = ex.available||{};
    var fmt = function(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:4}); };
    document.getElementById('aTacm').textContent = fmt(w.tacm);
    document.getElementById('aTiusd').textContent = fmt(w.tiusd);
    document.getElementById('aUsdt').textContent = fmt(w.usdt);
    document.getElementById('aPts').textContent = fmt(cm.points);
    document.getElementById('aEx').textContent = fmt(exa.TACM);
    var mine = (res[1].items||[]).filter(function(p){ return p.address===me; });
    var fw = res[2].items||[], fr = res[3].items||[];
    document.getElementById('pfStats').innerHTML =
      '<span><b>'+mine.length+'</b> '+TAC_TE('則貼文')+'</span><span><b>'+fw.length+'</b> '+TAC_TE('追蹤中')+'</span><span><b>'+fr.length+'</b> '+TAC_TE('追蹤者')+'</span>';
    var el = document.getElementById('pfPosts');
    el.innerHTML = mine.length ? mine.map(function(p){
      var media = '';
      if(p.image_url) media = '<img class="media" src="'+escapeHtml(p.image_url)+'" alt="">';
      if(p.video_url) media = '<video class="media" src="'+escapeHtml(p.video_url)+'" controls playsinline preload="metadata"></video>';
      var op = (p.address===me)
        ? '<span class="op"><button onclick="editPost('+p.id+')">'+TAC_TE('編輯')+'</button><button class="del" onclick="delPost('+p.id+')">'+TAC_TE('刪除')+'</button></span>'
        : '';
      return '<div class="pf-post"><div class="hd">'+escapeHtml(p.author_name||shortAddr(p.address))+' · '+timeAgo(p.created_at)+' · <b>'+ (p.kind==='video'?TAC_TE('影片'):(p.kind==='market'?TAC_TE('市集'):TAC_TE('動態'))) +'</b>'+op+'</div>'+
        '<div class="bd">'+escapeHtml(p.content)+'</div>'+media+'</div>';
    }).join('') : '<div class="pf-empty">'+TAC_TE('尚無動態，來發第一篇吧！')+'</div>';
  }).catch(function(e){ alert('載入失敗：'+e); });
}

function openEditProfile(){ document.getElementById('pfModal').style.display='flex'; }
function closeEditProfile(){ document.getElementById('pfModal').style.display='none'; }
function saveProfile(){
  var dn = document.getElementById('pfNameIn').value.trim();
  var av = document.getElementById('pfAvaIn').value.trim();
  post('/api/community/profile/meta', {address: me, display_name: dn, avatar_url: av})
    .then(function(){ alert(TAC_TE('已儲存')); closeEditProfile(); load(); })
    .catch(function(e){ alert(TAC_TE('儲存失敗')+'：'+e); });
}
function editPost(id){
  var cur = '';
  var cards = document.querySelectorAll('.pf-post');
  for(var i=0;i<cards.length;i++){ if(cards[i].querySelector('.op')){ cur = cards[i].querySelector('.bd').innerText; break; } }
  var txt = prompt(TAC_TE('編輯貼文內容：'), cur);
  if(txt===null) return;
  post('/api/community/post/'+id+'/edit', {address: me, content: txt})
    .then(function(){ alert(TAC_TE('已更新')); load(); })
    .catch(function(e){ alert(TAC_TE('編輯失敗')+'：'+e); });
}
function delPost(id){
  if(!confirm(TAC_TE('確定刪除這則貼文？'))) return;
  post('/api/community/post/'+id+'/delete', {address: me})
    .then(function(){ alert(TAC_TE('已刪除')); load(); })
    .catch(function(e){ alert(TAC_TE('刪除失敗')+'：'+e); });
}
</script>
{% endblock %}
