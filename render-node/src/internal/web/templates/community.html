{% extends "base.html" %}
{% block title %}TAC Community · Feed{% endblock %}
{% block content %}
<style>
  /* M100：首頁動態牆＝FB 滾動模式（行動優先、單欄、卡片貼文、浮動膠囊導航） */
  html,body{background:#f0f2f5!important;color:#1c1e21;margin:0}
  .topbar,.footer,.bottom-nav,.navlinks{display:none!important}
  .cm-wrap{max-width:520px;margin:0 auto;padding:0 0 86px}

  /* 頂欄 */
  .cm-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid #e4e6eb;display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
  .cm-brand{font-weight:900;font-size:23px;color:#2e7d52;flex:none}
  .cm-spacer{flex:1}
  .cm-ic{width:38px;height:38px;border-radius:50%;background:#e4e6eb;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .cm-ic svg{width:20px;height:20px;stroke:#1c1e21;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 發文卡片 */
  .cm-card{background:#fff;border-radius:12px;padding:12px;margin:10px 10px 0}
  .cm-comp{display:flex;align-items:center;gap:10px}
  .cm-myava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2e7d52,#68BE8D);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .cm-pill{flex:1;min-width:0;background:#f0f2f5;border-radius:999px;padding:11px 16px;color:#65676b;font-size:14px;cursor:pointer;text-align:left}
  .cm-comp-div{border-top:1px solid #e4e6eb;margin-top:10px;padding-top:8px;display:flex}
  .cm-comp-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:none;color:#65676b;font-weight:700;font-size:13px;cursor:pointer;padding:6px}
  .cm-comp-btn svg{width:20px;height:20px;fill:none;stroke:#2e7d52;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* 熱門貼文（橫向縮圖列） */
  .cm-popscroll{display:flex;gap:9px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
  .cm-popscroll::-webkit-scrollbar{display:none}
  .cm-pop{flex:0 0 auto;width:150px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #e4e6eb;cursor:pointer}
  .cm-pop .ph{height:110px;background:#e4e6eb;position:relative;overflow:hidden}
  .cm-pop .ph img,.cm-pop .ph video{width:100%;height:100%;object-fit:cover;display:block}
  .cm-pop .ph .vk{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .cm-pop .ph .vk svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2}
  .cm-pop .ti{font-size:12px;font-weight:700;padding:7px 9px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cm-pop .nm{font-size:11px;color:#65676b;padding:0 9px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 內建背景圖選擇 */
  .cm-bgrow{display:flex;gap:8px;overflow-x:auto;margin:10px 0 2px;scrollbar-width:none;padding-bottom:2px}
  .cm-bgrow::-webkit-scrollbar{display:none}
  .cm-bgopt{flex:0 0 auto;width:58px;height:58px;border-radius:12px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative;background:#e4e6eb}
  .cm-bgopt img{width:100%;height:100%;object-fit:cover;display:block}
  .cm-bgopt.sel{border-color:#2e7d52}
  .cm-bgopt .none{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:11px;color:#65676b;font-weight:700}
  .cm-bglabel{font-size:12px;color:#65676b;font-weight:700;margin-top:8px}

  /* 背景文字貼文：文字直接疊在背景上（FB 底色貼文模式，與一般圖片貼文不同） */
  .cm-bgpost{position:relative;min-height:330px;display:flex;align-items:center;justify-content:center;padding:42px 28px;overflow:hidden}
  .cm-bgpost img.bgsrc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .cm-bgpost .bt{position:relative;z-index:1;font-size:25px;font-weight:800;line-height:1.4;text-align:center;white-space:pre-wrap;word-break:break-word;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.38)}
  .cm-bgpost.dark .bt{color:#103826;text-shadow:0 1px 3px rgba(255,255,255,.45)}

  /* FB 風分享底層 */
  .cm-share{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;z-index:220;display:none;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 26px rgba(0,0,0,.2)}
  .cm-share.open{display:block}
  .cm-share .grab{width:38px;height:4px;border-radius:99px;background:#ccd0d5;margin:0 auto 12px}
  .cm-share .sh-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .cm-share .sh-head .tt{font-weight:800;font-size:16px}
  .cm-share .sh-head .x{margin-left:auto;background:#f0f2f5;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
  .cm-share select{flex:1;min-width:0;border:1px solid #dddfe2;border-radius:999px;padding:9px 12px;font-size:13px;background:#f7f8fa;font-weight:700}
  .cm-share .sh-row{display:flex;gap:8px;margin-bottom:10px}
  .cm-share input.sh-msg{width:100%;box-sizing:border-box;border:1px solid #dddfe2;border-radius:999px;padding:11px 15px;font-size:14px;outline:none;margin-bottom:10px}
  .cm-share .sh-go{width:100%;background:#1877f2;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:15px;cursor:pointer}
  .cm-share .sh-h{font-size:15px;font-weight:800;margin:14px 0 10px}
  .sh-friends{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .sh-friends::-webkit-scrollbar{display:none}
  .sh-fr{flex:0 0 auto;width:64px;text-align:center;cursor:pointer}
  .sh-fr .av{width:58px;height:58px;border-radius:50%;overflow:hidden;background:#e4e6eb;margin:0 auto 5px}
  .sh-fr .av img{width:100%;height:100%;object-fit:cover}
  .sh-fr .nb{font-size:11px;color:#1c1e21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-grid{display:flex;gap:10px;flex-wrap:wrap}
  .sh-tile{flex:0 0 calc(20% - 8px);text-align:center;cursor:pointer}
  .sh-tile .ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 5px}
  .sh-tile .ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
  .sh-tile .nb{font-size:11px;color:#1c1e21;line-height:1.2}

  /* 貼文 */
  .cm-post{background:#fff;border-radius:12px;margin:12px 10px 0;overflow:hidden}
  .cm-head{display:flex;align-items:center;gap:9px;padding:12px 12px 8px}
  .cm-ava{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:linear-gradient(135deg,#2e7d52,#68BE8D);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .cm-ava img{width:100%;height:100%;object-fit:cover}
  .cm-hd-nm{font-weight:700;font-size:14px;line-height:1.2}
  .cm-hd-tm{font-size:12px;color:#65676b;margin-top:1px}
  .cm-hd-op{margin-left:auto;display:flex;gap:6px}
  .cm-hd-op button{background:#f0f2f5;border:none;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;color:#65676b;cursor:pointer}
  .cm-hd-op button.del{color:#e41e3f}
  .cm-follow{background:#e7f3ff;color:#1877f2;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .cm-follow.on{background:#f0f2f5;color:#65676b}
  .cm-text{padding:2px 12px 10px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .cm-media img{width:100%;display:block;background:#e4e6eb;max-height:560px;object-fit:cover;cursor:zoom-in}
  .cm-media video{width:100%;display:block;background:#000;max-height:560px}
  .cm-tagline{display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px;font-size:12px;font-weight:700;color:#2e7d52;background:#e8f5e9;border-radius:7px;padding:3px 9px}
  .cm-tagline.live{background:#ffebe8;color:#e41e3f}
  .cm-price{display:inline-block;margin:0 12px 8px;background:#e8f5e9;color:#2e7d52;font-weight:800;border-radius:8px;padding:5px 11px;font-size:13px}

  /* 反應計數列 */
  .cm-count{display:flex;align-items:center;padding:9px 12px 8px;font-size:13px;color:#65676b}
  .cm-count .lk{width:20px;height:20px;border-radius:50%;background:#1877f2;display:flex;align-items:center;justify-content:center;margin-right:6px}
  .cm-count .lk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6}
  .cm-count .right{margin-left:auto;display:flex;gap:10px}
  .cm-actrow{display:flex;border-top:1px solid #e4e6eb;padding:4px 8px}
  .cm-act{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:none;color:#65676b;font-weight:700;font-size:13px;padding:8px;cursor:pointer;border-radius:8px}
  .cm-act:hover{background:#f2f3f5}
  .cm-act svg{width:19px;height:19px;fill:none;stroke:#65676b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cm-act.on{color:#2e7d52}
  .cm-act.on svg{stroke:#2e7d52}

  /* 留言 */
  .cm-comments{display:none;border-top:1px solid #e4e6eb;padding:10px 12px}
  .cm-comments.open{display:block}
  .cm-cm{display:flex;gap:8px;margin-bottom:9px}
  .cm-cm .cav{width:32px;height:32px;border-radius:50%;background:#e4e6eb;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#65676b}
  .cm-cm .cb{background:#f0f2f5;border-radius:14px;padding:7px 11px;font-size:13px;line-height:1.4}
  .cm-cm .cb b{font-weight:700;margin-right:5px}
  .cm-cadd{display:flex;gap:7px;margin-top:4px}
  .cm-cadd input{flex:1;min-width:0;border:none;background:#f0f2f5;border-radius:999px;padding:10px 14px;font-size:13px;outline:none}
  .cm-cadd button{background:#2e7d52;color:#fff;border:none;border-radius:999px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer}

  /* 橫向推薦區（你可能認識/Reels） */
  .cm-sectitle{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;padding:16px 14px 8px}
  .cm-sectitle svg{width:21px;height:21px;fill:none;stroke:#1c1e21;stroke-width:1.9}
  .cm-hscroll{display:flex;gap:9px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
  .cm-hscroll::-webkit-scrollbar{display:none}
  .cm-fcard{flex:0 0 auto;width:150px;background:#fff;border:1px solid #e4e6eb;border-radius:14px;overflow:hidden}
  .cm-fcard .ph{height:120px;background:#e4e6eb;display:flex;align-items:center;justify-content:center}
  .cm-fcard .ph img{width:100%;height:100%;object-fit:cover}
  .cm-fcard .ph svg{width:34px;height:34px;stroke:#b0b3b8;fill:none;stroke-width:1.6}
  .cm-fcard .nm{font-size:13px;font-weight:700;padding:8px 10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cm-fcard .meta{font-size:11px;color:#65676b;padding:0 10px 8px}
  .cm-fcard button{width:calc(100% - 20px);margin:0 10px 10px;background:#e7f3ff;color:#1877f2;border:none;border-radius:8px;padding:7px;font-size:12px;font-weight:700;cursor:pointer}
  .cm-reel{flex:0 0 auto;width:130px;height:200px;border-radius:14px;overflow:hidden;position:relative;background:#000;cursor:pointer}
  .cm-reel video{width:100%;height:100%;object-fit:cover}
  .cm-reel .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65))}
  .cm-reel .nm{position:absolute;left:8px;right:8px;bottom:8px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .cm-empty{color:#65676b;text-align:center;padding:34px 20px;font-size:14px;background:#fff;border-radius:12px;margin:12px 10px 0}

  /* 全屏發文 modal */
  .cm-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
  .cm-modal-card{background:#fff;border-radius:16px;width:100%;max-width:500px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
  .cm-modal-head{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #e4e6eb;font-weight:800;font-size:15px}
  .cm-modal-head .x{margin-left:auto;background:#f0f2f5;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
  .cm-modal-body{padding:14px;overflow-y:auto}
  .cm-modal-id{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .cm-modal textarea{width:100%;box-sizing:border-box;min-height:120px;border:none;font-size:16px;resize:none;outline:none;font-family:inherit;line-height:1.5}
  .cm-media-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #dddfe2;border-radius:999px;padding:9px 15px;font-size:13px;color:#2e7d52;font-weight:700;background:#fff;cursor:pointer}
  .cm-media-btn svg{width:17px;height:17px;fill:none;stroke:#2e7d52;stroke-width:1.8}
  .cm-preview{margin:10px 0}
  .cm-preview img,.cm-preview video{max-width:100%;max-height:220px;border-radius:10px}
  .cm-kind{display:flex;gap:8px;margin:10px 0}
  .cm-kind select,.cm-kind input{flex:1;min-width:0;border:1px solid #dddfe2;border-radius:8px;padding:9px;font-size:13px}
  .cm-pub{width:100%;background:#2e7d52;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}

  /* 購買/評價抽屜 */
  .cm-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;background:#fff;border-radius:16px 16px 0 0;z-index:150;display:none;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 26px rgba(0,0,0,.2)}
  .cm-sheet.open{display:block}
  .cm-sheet h3{margin:0 0 10px;font-size:16px}
  .cm-sheet .row{font-size:13px;color:#1c1e21;padding:7px 0;border-bottom:1px solid #f0f2f5;word-break:break-all}
  .cm-sheet .row b{color:#2e7d52}
  .cm-sheet .go{width:100%;background:#1b8a3a;color:#fff;border:none;border-radius:999px;padding:11px;font-weight:800;margin-top:8px;cursor:pointer}

  /* 底部浮動膠囊 */
  .cm-bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;display:flex;padding:5px 0 calc(5px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
  .cm-bottom a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;line-height:1.1;color:#65676b;text-decoration:none;position:relative;white-space:nowrap;overflow:hidden}
  .cm-bottom a svg{width:21px;height:21px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cm-bottom a.on{color:#2e7d52}
  .cm-bottom a.on svg{stroke:#2e7d52}
</style>

<div class="cm-wrap">
  <div class="cm-top">
    <div class="cm-brand">TACm</div>
    <div class="cm-spacer"></div>
    <button class="cm-ic" onclick="openModal()"><svg viewBox="0 0 24 24"><path d="M12 5 V19 M5 12 H19"/></svg></button>
    <button class="cm-ic" onclick="toggleSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/></svg></button>
    <button class="cm-ic" onclick="TAC_I18N.toggle()"><svg viewBox="0 0 24 24"><path d="M4 5 H17 M17 5 V18 M11 9 H20 V18 M7 18 C7 19.5 5.5 20 5 20 C4.5 20 4 19.5 4 18 C4 16.5 5.5 16 7 16 C8.5 16 10 16.5 10 18"/></svg></button>
  </div>

  <div id="searchBar" style="display:none;padding:10px 12px 0">
    <input id="cmSearch" oninput="filterFeed()" placeholder="搜尋貼文…" style="width:100%;box-sizing:border-box;border:1px solid #dddfe2;border-radius:999px;padding:11px 16px;font-size:14px;outline:none">
  </div>

  <!-- 發文卡片 -->
  <div class="cm-card">
    <div class="cm-comp">
      <div class="cm-myava" id="myAva">?</div>
      <div class="cm-pill" onclick="openModal()"><svg viewBox="0 0 24 24" style="width:16px;height:16px;vertical-align:-3px;stroke:#65676b;fill:none;stroke-width:2;margin-right:5px"><path d="M4 20 L4 15.5 L15.5 4 C16.9 2.6 19.1 2.6 20.5 4 C21.9 5.4 21.9 7.6 20.5 8.5 L9 20 Z"/></svg>在想些什麼？</div>
    </div>
    <div class="cm-comp-div">
      <button class="cm-comp-btn" onclick="openModal()"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 19 L10 13 L14 17 L17 13 L21 18"/></svg>相片</button>
      <button class="cm-comp-btn" onclick="openModal('video')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg>影片</button>
      <button class="cm-comp-btn" onclick="openModal('market')"><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/></svg>商品</button>
    </div>
  </div>

  <!-- 熱門貼文 -->
  <div id="popularBlock"></div>

  <!-- 動態牆 -->
  <div id="feed"></div>

  <!-- 推薦 -->
  <div id="suggestBlock"></div>
  <div id="reelBlock"></div>
</div>

<!-- 全屏發文 -->
<div class="cm-modal" id="cmModal">
  <div class="cm-modal-card">
    <div class="cm-modal-head"><span id="modalTitle">建立貼文</span><button class="x" onclick="closeModal()">×</button></div>
    <div class="cm-modal-body">
      <div class="cm-modal-id"><div class="cm-myava" id="mAva">?</div><b id="mName">—</b></div>
      <textarea id="cmText" placeholder="在想些什麼？"></textarea>
      <div>
        <button type="button" class="cm-media-btn" onclick="document.getElementById('cmFile').click()"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 19 L10 13 L14 17 L17 13 L21 18"/></svg>上傳圖片/影片</button>
        <input type="file" id="cmFile" accept="image/*,video/*" style="display:none" onchange="uploadMedia(this)">
      </div>
      <div class="cm-bglabel">內建背景圖（點選套用，再點一次取消）</div>
      <div class="cm-bgrow" id="bgRow"></div>
      <div class="cm-preview" id="cmPreview"></div>
      <div class="cm-kind">
        <select id="postKindM">
          <option value="post">動態</option>
          <option value="video">影片</option>
          <option value="live">直播</option>
          <option value="market">市集商品</option>
        </select>
        <input id="postPriceM" placeholder="商品價格" style="display:none">
      </div>
      <div id="mMsg" style="font-size:12px;color:#e41e3f;margin-top:6px"></div>
      <button class="cm-pub" onclick="publish()">發佈</button>
    </div>
  </div>
</div>

<!-- 購買 -->
<div class="cm-sheet" id="buySheet">
  <h3>確認購買</h3>
  <div id="buyInfo"></div>
  <button class="go" onclick="confirmBuy()">確認付款</button>
</div>
<div class="cm-sheet" id="reviewSheet">
  <h3>評價商品</h3>
  <input type="hidden" id="reviewId">
  <div class="row">評分
    <select id="reviewStars" style="width:100%;margin-top:6px;padding:8px;border:1px solid #dddfe2;border-radius:8px">
      <option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option><option value="2">2 星</option><option value="1">1 星</option>
    </select>
  </div>
  <textarea id="reviewComment" placeholder="Comment (optional)" style="width:100%;box-sizing:border-box;margin-top:8px;padding:9px;border:1px solid #dddfe2;border-radius:10px"></textarea>
  <button class="go" style="background:#f0b90b;color:#1c1e21" onclick="submitReview()">送出評價</button>
</div>

<!-- FB 風分享 -->
<div class="cm-share" id="shareSheet">
  <div class="grab"></div>
  <div class="sh-head"><div class="tt">分享貼文</div><button class="x" onclick="closeShare()">×</button></div>

    <select id="shareWhere">
      <option value="feed">動態消息</option>
      <option value="story">你的限時動態</option>
    </select>

      <option value="public">公開</option>
      <option value="friends">朋友</option>

    </select>
  </div>

  <div class="sh-h">分享到</div>

</div>

<script src="/static/js/community-wallet.js"></script>
<script>
function get(p){return fetch(p).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function post(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.error||r.status)});return r.json();});}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shortAddr(a){if(!a)return '—';if(a.length<=14)return a;return a.slice(0,8)+'…'+a.slice(-5);}
function timeAgo(ts){var d=Date.now()/1000-ts;if(d<60)return'剛剛';if(d<3600)return Math.floor(d/60)+' 分鐘前';if(d<86400)return Math.floor(d/3600)+' 小時前';return Math.floor(d/86400)+' 天前';}
function money(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:4});}

var me='', allPosts=[], allAds=[], followedSet={};
function toggleSearch(){var b=document.getElementById('searchBar');b.style.display=b.style.display==='none'?'block':'none';}
function filterFeed(){var q=(document.getElementById('cmSearch').value||'').trim().toLowerCase();document.querySelectorAll('#feed .cm-post').forEach(function(c){c.style.display=(!q||(c.innerText||'').toLowerCase().indexOf(q)>=0)?'':'none';});}

function avaHtml(p){
  return p.avatar_url?'<div class="cm-ava"><img src="'+escapeHtml(p.avatar_url)+'" alt=""></div>'
    :'<div class="cm-ava">'+(p.author_name||p.author||p.address||'T').slice(0,1).toUpperCase()+'</div>';
}
function nameOf(p){return escapeHtml(p.author_name||'')||shortAddr(p.address);}
function titleOf(p){return String((p.content||'').split('\n')[0]||'').slice(0,50);}
function isBgPost(p){return p.kind!=='video'&&p.kind!=='live'&&p.kind!=='market'&&typeof p.image_url==='string'&&p.image_url.indexOf('/static/img/bg/')===0;}
function bgNameOf(p){var m=String(p.image_url).match(/\/bg\/([a-z]+)\.svg/);return m?m[1]:'';}
function bgPostCard(p){
  var dark=bgNameOf(p)==='mint'?' dark':'';
  return '<div class="cm-bgpost'+dark+'"><img class="bgsrc" src="'+escapeHtml(p.image_url)+'" alt=""><div class="bt">'+escapeHtml(p.content||'')+'</div></div>';
}

function renderPopular(){
  var withMedia=allPosts.filter(function(p){return p.kind!=='market'&&(p.image_url||p.video_url);});
  withMedia.sort(function(a,b){return (b.likes+b.comments)-(a.likes+a.comments);});
  var list=withMedia.slice(0,10);
  var el=document.getElementById('popularBlock');
  if(!list.length){el.innerHTML='';return;}
  var cards=list.map(function(p){
    var thumb=p.video_url
      ? '<video src="'+escapeHtml(p.video_url)+'" muted playsinline preload="metadata"></video><span class="vk"><svg viewBox="0 0 24 24"><path d="M8 5 V19 L19 12 Z"/></svg></span>'
      : '<img src="'+escapeHtml(p.image_url)+'" alt="">';
    var click=p.video_url?'location=\'/community/videos\'':'lightbox(\''+escapeHtml(p.image_url)+'\')';
    return '<div class="cm-pop" onclick="'+click+'"><div class="ph">'+thumb+'</div><div class="ti">'+(titleOf(p)||'貼文')+'</div><div class="nm">'+nameOf(p)+'</div></div>';
  }).join('');
  el.innerHTML='<div class="cm-sectitle"><svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9 L22 9.5 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9.5 L9.5 9 Z"/></svg>熱門貼文</div><div class="cm-popscroll">'+cards+'</div>';
}

function renderFeed(){
  var posts=allPosts.filter(function(p){return p.kind!=='market';});
  var el=document.getElementById('feed');
  if(!posts.length&&!allAds.length){el.innerHTML='<div class="cm-empty">尚無動態，來發第一篇吧！</div>';renderSuggest();return;}
  var out=[],ai=0;
  posts.forEach(function(p,i){out.push(postCard(p));if((i+1)%4===0&&ai<allAds.length){out.push(adCard(allAds[ai++]));}});
  el.innerHTML=out.join('');
  renderSuggest();
}

function postCard(p){
  var tag='';
  if(p.kind==='video')tag='<span class="cm-tagline"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg>影片</span>';
  else if(p.kind==='live')tag='<span class="cm-tagline live"><i style="width:7px;height:7px;border-radius:50%;background:#e41e3f"></i>直播</span>';
  var op=(me&&p.address===me)?'<div class="cm-hd-op"><button onclick="editPost('+p.id+')">編輯</button><button class="del" onclick="delPost('+p.id+')">刪除</button></div>':'';
  var follow=(me&&p.address&&p.address!==me)?'<button class="cm-follow" data-a="'+p.address+'" onclick="toggleFollow(this,\''+p.address+'\')">'+(followedSet[p.address]?'已追蹤':'追蹤')+'</button>':'';
  var bgPost=isBgPost(p);
  var media='';
  if(!bgPost){
    if(p.image_url)media='<div class="cm-media"><img src="'+escapeHtml(p.image_url)+'" loading="lazy" onclick="lightbox(this.src)" alt=""></div>';
    if(p.video_url)media='<div class="cm-media"><video src="'+escapeHtml(p.video_url)+'" controls playsinline preload="metadata"></video></div>';
  }
  var bodyBlock=bgPost?bgPostCard(p):('<div class="cm-text">'+(p.content||'')+'</div>'+tag+media);
  var rightCounts='<div class="right"><span>'+p.comments+' 則留言</span><span>'+(p.shares||0)+' 次分享</span></div>';
  return '<div class="cm-post" data-id="'+p.id+'">'+
    '<div class="cm-head">'+avaHtml(p)+
    '<div><div class="cm-hd-nm">'+nameOf(p)+'</div><div class="cm-hd-tm">'+timeAgo(p.created_at)+'</div></div>'+
    '<div class="cm-hd-op">'+follow+op+'</div></div>'+
    bodyBlock+
    '<div class="cm-count"><span class="lk"><svg viewBox="0 0 24 24"><path d="M7 21 V10 M3 12 V19 C3 20 4 21 5 21 H17 C18 21 19 20 19.5 18.5 L21 10 C21 9 20.5 8 19.5 8 H14 L15 4.5 C15.5 3 14.5 2 13.5 2 H12.5 L8 9 V21"/></svg></span>'+p.likes+rightCounts+'</div>'+
    '<div class="cm-actrow">'+
      '<button class="cm-act" onclick="likePost('+p.id+')"><svg viewBox="0 0 24 24"><path d="M7 21 V10 M3 12 V19 C3 20 4 21 5 21 H17 C18 21 19 20 19.5 18.5 L21 10 C21 9 20.5 8 19.5 8 H14 L15 4.5 C15.5 3 14.5 2 13.5 2 H12.5 L8 9 V21"/></svg>讚</button>'+
      '<button class="cm-act" onclick="toggleComments('+p.id+')"><svg viewBox="0 0 24 24"><path d="M21 12 C21 16 17.5 19 12 19 C10.5 19 9 18.7 7.7 18.2 L4 20 L5.3 16.5 C3.9 15.3 3 13.8 3 12 C3 8 6.5 5 12 5 C17.5 5 21 8 21 12 Z"/></svg>留言</button>'+
      '<button class="cm-act" onclick="sharePost('+p.id+')"><svg viewBox="0 0 24 24"><path d="M12 3 L20 9 L12 15 L12 11 C8 11 5 12.5 3.5 16 C4 12 6.5 9 12 9 Z"/></svg>分享</button>'+
    '</div>'+
    '<div class="cm-comments" id="cmt-'+p.id+'"><div id="cmtlist-'+p.id+'"></div>'+
    '<div class="cm-cadd"><input id="cmtin-'+p.id+'" placeholder="寫下留言…"><button onclick="addComment('+p.id+')">送出</button></div></div>'+
    '</div>';
}

function adCard(a){
  trackImp(a.id);
  var media=a.media_url?(/\.(mp4|webm)(\?|$)/i.test(a.media_url)?'<div class="cm-media"><video src="'+escapeHtml(a.media_url)+'" controls playsinline></video></div>':'<div class="cm-media"><img src="'+escapeHtml(a.media_url)+'" alt=""></div>'):'';
  return '<div class="cm-post"><div style="padding:10px 12px 4px;font-size:12px;color:#9c27b0;font-weight:700">Sponsored · TAC 廣告</div>'+
    '<div class="cm-text" style="font-weight:700;font-size:15px">'+escapeHtml(a.title)+'</div>'+(a.body?'<div class="cm-text">'+escapeHtml(a.body)+'</div>':'')+media+
    '<div class="cm-actrow"><button class="cm-act" onclick="adClick('+a.id+',\''+escapeHtml(a.target||'')+'\')"><svg viewBox="0 0 24 24" stroke="#9c27b0"><path d="M4 12 H20 M14 6 L20 12 L14 18"/></svg>了解更多</button></div></div>';
}
function trackImp(id){try{post('/api/community/ads/'+id+'/impression',{address:me});}catch(e){}}
function adClick(id,t){try{post('/api/community/ads/'+id+'/click',{address:me});}catch(e){}if(t)window.open(t,'_blank');}

function renderSuggest(){
  // 你可能認識的朋友：動態作者，非本人、未追蹤
  var cand={};
  allPosts.forEach(function(p){if(p.address&&p.address!==me&&!followedSet[p.address])cand[p.address]=p;});
  var list=Object.keys(cand).slice(0,8);
  var videos=allPosts.filter(function(p){return p.video_url;}).slice(0,8);
  var sb=document.getElementById('suggestBlock');
  sb.innerHTML=list.length?('<div class="cm-sectitle"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20 C2.5 15.5 5 13 9 13 C13 13 15.5 15.5 15.5 20"/><circle cx="17" cy="9" r="2.8"/></svg>你可能認識的朋友</div><div class="cm-hscroll">'+list.map(function(a){
    var p=cand[a];
    return '<div class="cm-fcard"><div class="ph">'+(p.avatar_url?'<img src="'+escapeHtml(p.avatar_url)+'" alt="">':'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 7.5 13.5 12 13.5 C16.5 13.5 20 16 20 21"/></svg>')+'</div><div class="nm">'+shortAddr(a)+'</div><button onclick="quickFollow(\''+a+'\',this)">加朋友</button></div>';
  }).join('')+'</div>'):'';
  var rb=document.getElementById('reelBlock');
  rb.innerHTML=videos.length?('<div class="cm-sectitle"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg>FlipOn</div><div class="cm-hscroll">'+videos.map(function(p){
    return '<div class="cm-reel" onclick="location=\'/community/videos\'"><video src="'+escapeHtml(p.video_url)+'" muted playsinline preload="metadata"></video><div class="ov"></div><div class="nm">'+titleOf(p)+'</div></div>';
  }).join('')+'</div>'):'';
}
function quickFollow(a,btn){
  if(!me){alert('請先選擇錢包地址');return;}
  fetch('/api/community/follow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({follower:me,followee:a})}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(){followedSet[a]=1;btn.textContent='已追蹤';refreshFollowState();}).catch(function(e){alert('操作失敗：'+e);});
}
function refreshFollowState(){document.querySelectorAll('.cm-follow').forEach(function(b){var a=b.getAttribute('data-a');if(a){b.textContent=followedSet[a]?'已追蹤':'追蹤';}});}

function toggleFollow(btn,a){
  var on=followedSet[a];
  fetch('/api/community/follow',{method:on?'DELETE':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({follower:me,followee:a})}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(){if(on)delete followedSet[a];else followedSet[a]=1;refreshFollowState();}).catch(function(e){alert('操作失敗：'+e);});
}

function likePost(id){if(!me){alert('請先選擇錢包地址');return;}post('/api/community/post/'+id+'/like',{address:me}).then(refresh).catch(function(e){alert('按讚失敗：'+e);});}
function toggleComments(id){var b=document.getElementById('cmt-'+id);b.classList.toggle('open');if(b.classList.contains('open'))loadComments(id);}
function loadComments(id){get('/api/community/post/'+id+'/comments').then(function(d){document.getElementById('cmtlist-'+id).innerHTML=(d.items||[]).map(function(c){
  return '<div class="cm-cm"><div class="cav">'+shortAddr(c.address).slice(0,2)+'</div><div class="cb"><b>'+shortAddr(c.address)+'</b>'+escapeHtml(c.body)+'</div></div>';
}).join('')||'<div style="color:#65676b;font-size:13px">尚無留言</div>';}).catch(function(){});}
function addComment(id){if(!me){alert('請先選擇錢包地址');return;}var inp=document.getElementById('cmtin-'+id);var b=inp.value.trim();if(!b)return;post('/api/community/post/'+id+'/comments',{address:me,body:b}).then(function(){inp.value='';loadComments(id);refresh();}).catch(function(e){alert('留言失敗：'+e);});}
/* ===== FB 風分享 ===== */
var _shareId=null;
function sharePost(id){
  if(!me){alert('請先選擇錢包地址');return;}
  _shareId=id;
  document.getElementById('shareMsg').value='';
  document.getElementById('shareWhere').value='feed';
  document.getElementById('shareAud').value='public';
  renderShareFriends();renderShareGrid();
  document.getElementById('shareSheet').classList.add('open');
}
function closeShare(){document.getElementById('shareSheet').classList.remove('open');_shareId=null;}
function shareLink(){return location.origin+'/community?post='+_shareId;}
function renderShareFriends(){
  // 站內無私訊後台：追蹤中的朋友點擊＝複製連結（稍後可接 DM）
  var adds=Object.keys(followedSet);
  var el=document.getElementById('shareFriends');
  if(!adds.length){el.innerHTML='<div style="font-size:13px;color:#65676b">尚無追蹤朋友，可用下方外部 App 分享</div>';return;}
  el.innerHTML=adds.slice(0,10).map(function(a){
    return '<div class="sh-fr" onclick="sendToFriend()"><div class="av"><img src="/static/img/bg/ocean.svg" alt=""></div><div class="nb">'+shortAddr(a)+'</div></div>';
  }).join('');
}
function sendToFriend(){copyLink();alert('已複製連結，可貼給朋友（站內私訊尚未開放）');}
function copyLink(){
  var u=shareLink();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u);}
  else{prompt('貼文連結：',u);}
}
function iconTile(bg,label,path,extra){
  return '<div class="sh-tile" onclick="'+(extra||("openShare('"+path+"')"))+'"><div class="ic" style="background:'+bg+'">'+extraIcon(path)+'</div><div class="nb">'+label+'</div></div>';
}
function extraIcon(kind){
  if(kind==='copy')return '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8 V6 C16 4.9 15.1 4 14 4 H6 C4.9 4 4 4.9 4 6 V14 C4 15.1 4.9 16 6 16 H8"/></svg>';
  if(kind==='more')return '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  if(kind==='story')return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8 V16 M8 12 H16"/></svg>';
  return '<svg viewBox="0 0 24 24"><path d="M4 12 L20 4 L13 20 L11 14 Z"/></svg>';
}
function renderShareGrid(){
  var u=encodeURIComponent(shareLink()),t=encodeURIComponent('看看這篇 TACm 貼文：'+shareLink());
  var tiles=[];
  tiles.push('<div class="sh-tile" onclick="shareAsStory()"><div class="ic" style="background:#1c1e21">'+extraIcon('story')+'</div><div class="nb">限時動態</div></div>');
  tiles.push('<div class="sh-tile" onclick="openShare(\'https://www.facebook.com/sharer/sharer.php?u='+u+'\')"><div class="ic" style="background:#0084ff"><svg viewBox="0 0 24 24"><path d="M4 12 L20 4 L13 20 L11 14 Z"/></svg></div><div class="nb">Messenger</div></div>');
  tiles.push('<div class="sh-tile" onclick="openShare(\'https://social-plugins.line.me/lineit/share?url='+u+'\')"><div class="ic" style="background:#06c755"><svg viewBox="0 0 24 24"><path d="M4 12 L20 4 L13 20 L11 14 Z"/></svg></div><div class="nb">LINE</div></div>');
  tiles.push('<div class="sh-tile" onclick="openShare(\'https://api.whatsapp.com/send?text='+t+'\')"><div class="ic" style="background:#25d366"><svg viewBox="0 0 24 24"><path d="M4 12 L20 4 L13 20 L11 14 Z"/></svg></div><div class="nb">WhatsApp</div></div>');
  tiles.push('<div class="sh-tile" onclick="nativeMore()"><div class="ic" style="background:#65676b">'+extraIcon('more')+'</div><div class="nb">更多</div></div>');
  tiles.push('<div class="sh-tile" onclick="copyLink();alert(\'已複製連結\')"><div class="ic" style="background:#8a8d91">'+extraIcon('copy')+'</div><div class="nb">複製連結</div></div>');
  document.getElementById('shareGrid').innerHTML=tiles.join('');
}
function openShare(url){window.open(url,'_blank','noopener,width=640,height=600');}
function nativeMore(){
  var data={title:'TACm 貼文',text:'看看這篇 TACm 貼文',url:shareLink()};
  if(navigator.share){navigator.share(data).catch(function(){});}
  else{copyLink();alert('已複製連結（此瀏覽器不支援系統分享）');}
}
function shareAsStory(){closeShare();openModal();document.getElementById('cmText').value=shareLink();}
function doReshare(){
  var where=document.getElementById('shareWhere').value;
  var msg=(document.getElementById('shareMsg').value||'').trim();
  if(where==='story'){shareAsStory();return;}
  var content=(msg?msg+'\n':'')+'轉發：'+shareLink();
  post('/api/community/post',{address:me,kind:'post',content:content,image_url:null,video_url:null,price_tacm:null}).then(function(){
    closeShare();alert('已分享到動態消息');refresh();
  }).catch(function(e){alert('分享失敗：'+e);});
}

function editPost(id){var txt=prompt('編輯貼文內容：');if(txt===null)return;post('/api/community/post/'+id+'/edit',{address:me,content:txt}).then(refresh).catch(function(e){alert('編輯失敗：'+e);});}
function delPost(id){if(!confirm('確定刪除這則貼文？'))return;post('/api/community/post/'+id+'/delete',{address:me}).then(refresh).catch(function(e){alert('刪除失敗：'+e);});}

/* lightbox */
function lightbox(src){var b=document.getElementById('imgLb');if(!b){b=document.createElement('div');b.id='imgLb';b.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out';b.onclick=function(){b.style.display='none';};document.body.appendChild(b);}b.innerHTML='<img src="'+src+'" style="max-width:95vw;max-height:92vh;border-radius:10px">';b.style.display='flex';}

/* 內建背景圖 */
var builtinBgs=[
  {name:'aurora',url:'/static/img/bg/aurora.svg'},
  {name:'sunset',url:'/static/img/bg/sunset.svg'},
  {name:'ocean',url:'/static/img/bg/ocean.svg'},
  {name:'grape',url:'/static/img/bg/grape.svg'},
  {name:'mint',url:'/static/img/bg/mint.svg'},
  {name:'gold',url:'/static/img/bg/gold.svg'}
];
function renderBgRow(){
  var html='<div class="cm-bgopt'+(window._bgUrl?'':' sel')+'" onclick="pickBg(\'\')"><div class="none">無</div></div>';
  html+=builtinBgs.map(function(b){
    var sel=window._bgUrl===b.url?' sel':'';
    return '<div class="cm-bgopt'+sel+'" onclick="pickBg(\''+b.url+'\')"><img src="'+b.url+'" alt=""></div>';
  }).join('');
  document.getElementById('bgRow').innerHTML=html;
}
function pickBg(url){
  if(window._bgUrl===url){window._bgUrl='';}
  else{
    window._bgUrl=url;
    window._mediaUrl='';
    document.getElementById('cmFile').value='';
  }
  syncPreview();
  renderBgRow();
}
function syncPreview(){
  var el=document.getElementById('cmPreview');
  if(window._mediaUrl){el.innerHTML=window._mediaIsVideo?'<video src="'+window._mediaUrl+'" controls playsinline></video>':'<img src="'+window._mediaUrl+'" alt="">';}
  else if(window._bgUrl){
    var txt=(document.getElementById('cmText').value||'').trim();
    var dark=window._bgUrl.indexOf('/mint.svg')>=0?' dark':'';
    el.innerHTML='<div class="cm-bgpost'+dark+'" style="min-height:220px"><img class="bgsrc" src="'+window._bgUrl+'" alt=""><div class="bt" style="font-size:20px">'+escapeHtml(txt)+'</div></div>';
  }
  else{el.innerHTML='';}
}

/* modal */
function openModal(kind){
  if(!me){alert('請先於錢包中心選擇錢包地址');return;}
  document.getElementById('mAva').textContent=(me||'?').slice(0,1).toUpperCase();
  document.getElementById('mName').textContent=shortAddr(me);
  document.getElementById('cmModal').style.display='flex';
  var sel=document.getElementById('postKindM');
  if(kind==='video')sel.value='video';else if(kind==='market')sel.value='market';else sel.value='post';
  document.getElementById('postPriceM').style.display=sel.value==='market'?'block':'none';
  window._bgUrl='';window._mediaUrl='';window._mediaIsVideo=false;
  renderBgRow();syncPreview();
  setTimeout(function(){document.getElementById('cmText').focus();},60);
}
function closeModal(){document.getElementById('cmModal').style.display='none';document.getElementById('cmPreview').innerHTML='';document.getElementById('cmFile').value='';document.getElementById('mMsg').textContent='';document.getElementById('cmText').value='';window._mediaUrl='';window._bgUrl='';window._mediaIsVideo=false;}
document.addEventListener('change',function(e){if(e.target&&e.target.id==='postKindM'){document.getElementById('postPriceM').style.display=e.target.value==='market'?'block':'none';}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='cmText'&&window._bgUrl){syncPreview();}});
function uploadMedia(inp){
  var f=inp.files[0];if(!f)return;if(f.size>64*1024*1024){alert('檔案超過 64MB');inp.value='';return;}
  var fd=new FormData();fd.append('file',f);
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
    window._mediaUrl=d.url;
    window._mediaIsVideo=d.type.indexOf('video')>=0;
    window._bgUrl='';
    syncPreview();renderBgRow();
    var sel=document.getElementById('postKindM');if(window._mediaIsVideo&&sel.value==='post')sel.value='video';
  }).catch(function(e){document.getElementById('mMsg').textContent='上傳失敗：'+e;});
}
function publish(){
  var kind=document.getElementById('postKindM').value;
  var content=(document.getElementById('cmText').value||'').trim();
  var media=(window._mediaUrl||'').trim();
  var bg=(window._bgUrl||'').trim();
  var isVid=kind==='video'||kind==='live';
  var imageMedia=isVid?'':(media||bg);
  if(!content&&!media&&!bg){document.getElementById('mMsg').textContent='內容不可為空';return;}
  if(kind==='market'&&!(parseFloat(document.getElementById('postPriceM').value)>0)){document.getElementById('mMsg').textContent='商品請填價格';return;}
  var price=kind==='market'?parseFloat(document.getElementById('postPriceM').value)||0:null;
  post('/api/community/post',{address:me,kind:kind,content:content,image_url:imageMedia||null,video_url:isVid?media:null,price_tacm:price}).then(function(){closeModal();refresh();}).catch(function(e){document.getElementById('mMsg').textContent='發佈失敗：'+e;});
}

/* 購買/評價（市集商品從 /market 頁觸發，保留閉環） */
function buyIntent(id){get('/api/community/market/'+id+'/buy-intent?address='+encodeURIComponent(me)).then(function(d){
  document.getElementById('buySheet').classList.add('open');
  document.getElementById('buyInfo').innerHTML='<div class="row">賣家：<b>'+shortAddr(d.to)+'</b></div><div class="row">金額：<b>'+money(d.amount_tacm)+'</b></div><div class="row">鏈上費：<b>'+money(d.fee_tacm||0)+'</b></div><div class="row">memo：<b>'+d.memo+'</b></div>';
  document.getElementById('buyGoId')&&0;window._buyId=id;
}).catch(function(e){alert('購買意向失敗：'+e);});}
function confirmBuy(){post('/api/community/market/'+window._buyId+'/buy',{address:me}).then(function(d){document.getElementById('buySheet').classList.remove('open');alert('付款成功，鏈上費 '+money(d.fee_tacm||0));refresh();}).catch(function(e){alert('付款失敗：'+e);});}
function openReview(id){document.getElementById('reviewSheet').classList.add('open');document.getElementById('reviewId').value=id;}
function submitReview(){var id=document.getElementById('reviewId').value;post('/api/community/market/'+id+'/review',{address:me,rating:parseInt(document.getElementById('reviewStars').value,10),comment:document.getElementById('reviewComment').value.trim()}).then(function(){document.getElementById('reviewSheet').classList.remove('open');refresh();}).catch(function(e){alert('評價失敗：'+e);});}

function loadFollowed(){if(!me)return Promise.resolve();return get('/api/community/following?address='+encodeURIComponent(me)).then(function(d){(d.items||[]).forEach(function(a){followedSet[a]=1;});}).catch(function(){});}
function refresh(){
  Promise.all([get('/api/community/feed'),get('/api/community/market'),loadFollowed()]).then(function(rs){
    allPosts=rs[0].items||[];allAds=rs[0].ads||[];
    var marketItems=(rs[1].items||[]).filter(function(p){return p.kind==='market';});
    renderPopular();renderFeed();
  }).catch(function(e){document.getElementById('feed').innerHTML='<div class="cm-empty">載入失敗：'+e+'</div>';});
}

cmBindAddr({onResolve:function(a){me=a;document.getElementById('myAva').textContent=(a||'?').slice(0,1).toUpperCase();refresh();}});
</script>
