{% extends "base.html" %}
{% block title %}TAC Community · Feed{% endblock %}
{% block content %}
<style>
  /* M31：社群採淺色（背景去深色） */
  body { background: #f0f2f5; color: #1c1e21; }
  .container { background: transparent; }
  .footer { background: #fff; border-top-color: #dddfe2; color: #65676b; }
  .bottom-nav { background: rgba(255, 255, 255, 0.97); border-top-color: #dddfe2; }
  .bottom-nav a { color: #65676b; }
  .bottom-nav { display:none !important; }
  .navlinks { display:none !important; }
  .cm-wrap{max-width:1080px;margin:0 auto}
  .cm-head{background:#1877f2;background:linear-gradient(135deg,#1877f2,#166fe5);border-radius:16px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}

  .cm-head .cm-sub{font-size:12px;opacity:.85}

  .cm-tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:#e7f3ff;color:#1877f2}

  .cm-tag.ad{background:#fff3e0;color:#e65100}
  .cm-id{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .cm-id input{flex:1;min-width:0;border:1px solid #dddfe2;border-radius:8px;padding:9px 10px;font-size:13px;background:#f5f6f7;color:#1c1e21;font-family:ui-monospace,monospace}
  .cm-id button{background:#1877f2;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;flex:none}
  .cm-composer{display:flex;flex-direction:column;gap:10px}
  .cm-stories{display:flex;gap:10px;overflow-x:auto;padding:10px 4px;margin-bottom:2px;-webkit-overflow-scrolling:touch}
  .cm-story{flex:0 0 auto;width:64px;text-align:center;cursor:pointer}
  .cm-story .sav{width:58px;height:58px;border-radius:50%;border:3px solid #f0b90b;object-fit:cover;display:block;background:#e4e6eb;color:#65676b;font-size:20px;font-weight:700;line-height:52px;margin:0 auto}
  .cm-story .stx{font-size:10px;color:#65676b;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cm-img{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin:10px 0;cursor:zoom-in;background:#e4e6eb}
  .cm-stars{font-size:13px;color:#f0b90b;cursor:pointer;margin-top:6px}
  .cm-comp-top{display:flex;align-items:flex-start;gap:10px}
  .cm-comp-ava{width:40px;height:40px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;margin-top:2px}
  .cm-comp-main{flex:1;min-width:0}
  .cm-comp-input{width:100%;box-sizing:border-box;min-height:52px;border:1px solid #dddfe2;border-radius:999px;padding:14px 18px;font-size:14px;background:#f0f2f5;cursor:text;color:#65676b;display:flex;align-items:center}

  .rich-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .rich-btn{border:1px solid #dddfe2;background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:13px;color:#1b8a3a}
  .rich-btn:hover{background:#e8f5e9}
  .cm-editor{width:100%;box-sizing:border-box;min-height:72px;border:1px solid #dddfe2;border-radius:12px;padding:10px 12px;font-size:14px;background:#fff;overflow-y:auto;line-height:1.5;display:none}

  .cm-editor b,.cm-editor strong{font-weight:700}.cm-editor i,.cm-editor em{font-style:italic}
  .cm-stars{color:#f0b90b;font-size:12px;letter-spacing:1px}

  .cm-composer .cm-side{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;width:100%}
  .cm-composer .cm-side select,.cm-composer .cm-side input{flex:1;min-width:110px;border:1px solid #dddfe2;border-radius:8px;padding:9px;font-size:13px;background:#fff;box-sizing:border-box}
  .cm-composer .cm-side .cm-post-btn{flex:1;min-width:110px}
  .cm-post-btn{background:#1877f2;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .cm-post{margin-bottom:12px;padding:14px}
  .cm-author{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .cm-ava{width:40px;height:40px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
  .cm-author .nm{font-weight:700;font-size:14px;color:#1c1e21}
  .cm-ava.photo{background:#fff;overflow:hidden}

  .cm-author .tm{font-size:11px;color:#65676b}
  .cm-body{font-size:14px;color:#050505;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
  .cm-price{display:inline-block;background:#e7f3ff;color:#1877f2;font-weight:800;border-radius:8px;padding:4px 10px;font-size:13px;margin-bottom:10px}
  .cm-actions{display:flex;gap:8px;border-top:1px solid #e4e6eb;padding-top:8px}

  .cm-act.on{background:#e7f3ff;color:#1877f2}
  .cm-comments{margin-top:8px;border-top:1px solid #e4e6eb;padding-top:8px;display:none}

  .cm-com{margin:6px 0;font-size:13px}
  .cm-com b{color:#1877f2;margin-right:6px}
  .cm-comadd{display:flex;gap:6px;margin-top:8px}

  .cm-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e4e6eb}
  .cm-item:last-child{border-bottom:none}

  .cm-item .it-p{font-weight:800;color:#1877f2;font-size:13px;flex:none}
  .cm-item button{background:#e7f3ff;color:#1877f2;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;flex:none}
  .cm-buy{position:fixed;left:0;right:0;bottom:0;top:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:70}
  .cm-buy.open{display:flex}
  .cm-buy .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px;max-height:80vh;overflow:auto}
  .cm-buy .sheet h3{margin:0 0 10px;font-size:16px;color:#1c1e21}
  .cm-buy .row{font-size:13px;color:#1c1e21;padding:8px 0;border-bottom:1px solid #e4e6eb;word-break:break-all}
  .cm-buy .row b{color:#1877f2}
  .cm-buy .close{background:#f0f2f5;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:14px;margin-top:12px;width:100%;cursor:pointer}

  .cm-ad .ad-t{font-weight:800;font-size:14px;color:#1c1e21}
  .cm-ad .ad-b{font-size:13px;color:#65676b;margin-top:4px}
  .cm-ad .ad-m{font-size:11px;color:#1877f2;margin-top:6px;font-weight:600}
  .cm-empty{color:#65676b;font-size:13px;text-align:center;padding:20px 0}
  .cm-msg{font-size:12px;color:#f02849;margin-top:8px;text-align:center;min-height:14px}
  .mono-s{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
  .cm-topbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .cm-feedtab{background:#f0f2f5;border:1px solid #dddfe2;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:#65676b;cursor:pointer}
  .cm-feedtab.on{background:#e7f3ff;color:#1877f2;border-color:#1877f2}
  .cm-follow{background:#1877f2;color:#fff;border:none;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;flex:none;margin-left:auto}
  .cm-follow.on{background:#f0f2f5;color:#65676b}
  .cm-reward-line{font-size:13px;color:#1c1e21;margin:6px 0;word-break:break-all}
  .cm-reward-top{border-top:1px solid #e4e6eb;margin-top:10px;padding-top:8px}
  .cm-rt-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#65676b;padding:5px 0;border-bottom:1px solid #f0f2f5}
  .cm-rt-item b{color:#1877f2}
  /* ===== M93 Facebook 化 ===== */
  .cm-topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #dddfe2;padding:8px 0;margin-bottom:10px;border-radius:0}
  .cm-topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 4px}
  /* v165：窄屏頂欄收斂，防橫向溢出（390/360/320px） */
  @media (max-width:430px){
    .cm-topbar-in{gap:6px}
    .cm-tbl span{display:none}
    .cm-tb-right{gap:2px}
    .cm-tb-btn{padding:7px 6px}
    .cm-tb-btn span{display:none}
  }
  .cm-tbl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:#1877f2;flex:none}
  .cm-tbl svg{width:28px;height:28px}
  .cm-search{flex:1;min-width:0;position:relative}
  .cm-search input{width:100%;box-sizing:border-box;border:1px solid #dddfe2;background:#f0f2f5;border-radius:999px;padding:9px 14px 9px 34px;font-size:13px;color:#1c1e21}
  .cm-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#65676b}
  .cm-tb-btn{flex:none;background:#e7f3ff;color:#1877f2;border:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .cm-video{width:100%;border-radius:10px;margin:10px 0;background:#000;max-height:420px}
  .cm-live-badge{display:inline-flex;align-items:center;gap:4px;background:#e41e3f;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px}
  .cm-live-badge i{width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block;animation:cmblink 1.2s infinite}
  @keyframes cmblink{50%{opacity:.3}}
  .cm-bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .cm-bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#65676b;text-decoration:none;position:relative}
  .cm-bottom a svg{width:22px;height:22px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cm-bottom a.on{color:#1877f2}
  .cm-bottom a.on svg{stroke:#1877f2}
  .cm-bottom .bdg{position:absolute;top:-2px;right:-6px;background:#e41e3f;color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px}
  body{padding-bottom:64px}
  .cm-post .cm-author .cm-ava,.cm-comp-ava{background:linear-gradient(135deg,#1877f2,#68BE8D)}
  /* ===== M94：社群 FB 化——單一頂欄/全屏發文/簡約圖標/直播與個人 ===== */
  .topbar,.footer{display:none!important}
  .cm-tb-right{display:flex;align-items:center;gap:4px;margin-left:auto}
  .cm-tb-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#65676b;font-size:13px;font-weight:600;padding:7px 9px;border-radius:999px;cursor:pointer;text-decoration:none}
  .cm-tb-btn svg{width:18px;height:18px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  #cmLangBtn{background:#f0f2f5;color:#1c1e21}
  .cm-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}

  .cm-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #e4e6eb;font-weight:700;font-size:15px;color:#1c1e21}
  .cm-modal-x{background:none;border:none;font-size:16px;color:#65676b;cursor:pointer;padding:6px 10px}

  .cm-modal-id{display:flex;align-items:center;gap:10px;margin-bottom:10px}

  .cm-modal-media{margin:6px 0}
  .cm-media-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #dddfe2;border-radius:999px;padding:9px 16px;font-size:13px;color:#1877f2;font-weight:700;background:#fff;cursor:pointer}

  .cm-preview{margin:10px 0}

  .cm-act svg{width:18px;height:18px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<div class="cm-wrap">
  <div class="cm-topbar"><div class="cm-topbar-in">
    <div class="cm-tbl">
      <svg viewBox="0 0 28 28"><path d="M14 4 C8 4 5 9 5 14 c0 4 2 7 4 9 v2 h10 v-2 c2-2 4-5 4-9 C23 9 20 4 14 4 Z"/><circle cx="14" cy="13" r="3.4"/><path d="M10.5 21.5 h7"/></svg>
      <span data-i18n="cm.brand">TAC 社群</span>

<!-- 社群統一權威地址（比照交易所 v160 錢包中心）：cmResolveAddr / cmBindAddr -->
<script src="/static/js/community-wallet.js"></script>
<script>
// M95：首頁＝全部動態牆；底部導航跳獨立頁（影片/好友/通知/個人）。
function tabFeed(t){
  if(t==='all'){ scope=''; document.getElementById('tabAll').classList.add('on'); document.getElementById('tabFollow').classList.remove('on'); refresh(); }
  else if(t==='following'){ scope='following'; document.getElementById('tabAll').classList.remove('on'); document.getElementById('tabFollow').classList.add('on'); refresh(); }
}
function filterFeed(){
  var q = document.getElementById('cmSearch').value.trim().toLowerCase();
  var cards = document.querySelectorAll('#feed .cm-post');
  cards.forEach(function(c){
    var txt = (c.innerText||'').toLowerCase();
    c.style.display = (q==='' || txt.indexOf(q)>=0) ? '' : 'none';
  });
}
// 影片/直播 kind 時顯示影片網址輸入。
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='postKind'){
    var k = e.target.value;
    document.getElementById('cmVidWrap').style.display = (k==='video'||k==='live') ? '' : 'none';
    document.getElementById('postPrice').parentElement.style.display = (k==='market') ? '' : 'none';
  }
});

// M31：RPC 預設同源（同埠合併模式 RPC 即 web 埠）；仍可用 ?rpc=端口 覆蓋。
function get(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
function post(p,b){ return fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})}).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||r.status)}); return r.json(); }); }
var me = '';
function shortAddr(a){ if(!a) return '—'; if(a.length<=16) return a; return a.slice(0,10)+'…'+a.slice(-6); }
function timeAgo(ts){ var d=Date.now()/1000-ts; if(d<60) return '剛剛'; if(d<3600) return Math.floor(d/60)+' 分鐘前'; if(d<86400) return Math.floor(d/3600)+' 小時前'; return Math.floor(d/86400)+' 天前'; }
// 身分＝權威地址（錢包中心為準）；手動輸入框唯讀，「切換」僅重新向權威來源同步。
function setIdentity(){ cmBindAddr({input:'#myAddr', onResolve:function(a){ me=a; syncRewards(); refresh(); }}); }
function ensureMe(){
  refreshAva();
  if(!me){ me = window.cmAddr || ''; document.getElementById('myAddr').value=me; }
  if(!me){ document.getElementById('postMsg').textContent = TAC_TE('請先於錢包中心選擇錢包地址（tx0 開頭）'); return false; }
  return true;
}

function renderFeed(fd){
  var items = (fd.items||[]).filter(function(p){ return p.kind!=='market'; });
  var ads = fd.ads||[];
  var el = document.getElementById('feed');
  if(!items.length && !ads.length){ el.innerHTML='<div class="cm-card cm-empty">尚無動態，來發第一篇吧！</div>'; return; }
  var out = []; var ai = 0;
  items.forEach(function(p, i){
    out.push(postCard(p));
    if((i+1)%4===0 && ai<ads.length){ out.push(adCard(ads[ai++])); }
  });
  while(ai<ads.length && out.length>=4){ out.push(adCard(ads[ai++])); }
  el.innerHTML = out.join('');
  refreshFollowBtns();
  if(window._cmTab==='video'){
    document.querySelectorAll('#feed .cm-post').forEach(function(c){
      c.style.display = (c.querySelector('video')||c.querySelector('.cm-live-badge')) ? '' : 'none';
    });
  }
  return;
  function postCard(p){
    var market = p.kind==='market';
    var likeOn = '';
    var price = p.price_tacm ? '<div class="cm-price">'+Number(p.price_tacm).toLocaleString('en-US',{maximumFractionDigits:4})+' TACM</div>' : '';
    var buyBtn = market ? '<button class="cm-act" onclick="buyIntent('+p.id+')"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg>購買</button>' : '';
    var tagTxt = p.kind==='market' ? '市集' : (p.kind==='video' ? '<span class="cm-tag video"><svg viewBox="0 0 24 24" style="width:12px;height:12px;vertical-align:-1px;stroke:#1877f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:3px"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg>影片</span>' : (p.kind==='live' ? '<span class="cm-live-badge"><i></i>直播</span>' : '動態'));
    var tagCls = p.kind==='market' ? ' market' : '';
    var vidHtml = p.video_url ? '<div class="cm-vwrap" onclick="openVideo(\''+escapeHtml(p.video_url)+'\')"><video class="cm-video" src="'+escapeHtml(p.video_url)+'" controls preload="metadata" playsinline></video><span class="cm-vplay"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M8 5 L19 12 L8 19 Z"/></svg>'+TAC_TE('開啟影片')+'</span></div>' : '';
    // M73-B：追蹤按鈕（非本人貼文）。
    var followBtn = (me && p.address && p.address!==me) ? '<button class="cm-follow" data-a="'+p.address+'" onclick="toggleFollow(this,\''+p.address+'\')">追蹤</button>' : '';
    var avaHtml = p.avatar_url
      ? '<div class="cm-ava photo"><img src="'+escapeHtml(p.avatar_url)+'" alt=""></div>'
      : '<div class="cm-ava">'+(p.author_name||p.author||p.address||TAC_TE('T')).slice(0,1).toUpperCase()+'</div>';
    var nmTxt = escapeHtml(p.author_name||'') || shortAddr(p.address);
    var op = (me && p.address===me)
      ? '<span class="cm-op"><button onclick="editPost('+p.id+')">'+TAC_TE('編輯')+'</button><button class="del" onclick="delPost('+p.id+')">'+TAC_TE('刪除')+'</button></span>'
      : '';
    return '<div class="cm-card cm-post">'+
      '<div class="cm-author">'+avaHtml+
      '<div><div class="nm">'+nmTxt+'</div><div class="tm">'+timeAgo(p.created_at)+' · <span class="cm-tag'+tagCls+'">'+tagTxt+'</span></div></div>'+op+followBtn+'</div>'+
      '<div class="cm-body">'+(p.content||TAC_TE(''))+'</div>'+
      (p.image_url?'<img class="cm-img" src="'+escapeHtml(p.image_url)+'" loading="lazy" onclick="lightbox(this.src)" alt="">':'')+
      vidHtml+
      (market?stars:'')+(market?price:'')+
      '<div class="cm-actions">'+
      '<button class="cm-act" onclick="likePost('+p.id+',this)"><svg viewBox="0 0 24 24"><path d="M7 21 V10 M3 12 V19 C3 20 4 21 5 21 H17 C18 21 19 20 19.5 18.5 L21 10 C21 9 20.5 8 19.5 8 H14 L15 4.5 C15.5 3 14.5 2 13.5 2 H12.5 L8 9 V21"/></svg>讚 <span>'+p.likes+'</span></button>'+
      '<button class="cm-act" onclick="toggleComments('+p.id+',this)"><svg viewBox="0 0 24 24"><path d="M21 12 C21 16 17.5 19 12 19 C10.5 19 9 18.7 7.7 18.2 L4 20 L5.3 16.5 C3.9 15.3 3 13.8 3 12 C3 8 6.5 5 12 5 C17.5 5 21 8 21 12 Z"/></svg>留言 <span>'+p.comments+'</span></button>'+
      '<button class="cm-act" onclick="sharePost('+p.id+')"><svg viewBox="0 0 24 24"><path d="M12 3 L20 9 L12 15 L12 11 C8 11 5 12.5 3.5 16 C4 12 6.5 9 12 9 Z"/></svg>分享</button>'+
      buyBtn+
      '</div>'+
      '<div class="cm-comments" id="cmt-'+p.id+'"><div id="cmtlist-'+p.id+'"></div>'+
      '<div class="cm-comadd"><input id="cmtin-'+p.id+'" placeholder="Write a comment..."><button onclick="addComment('+p.id+')">送出</button></div></div>'+
      '</div>';
  }

  function adCard(a){
    trackImp(a.id);
    var media = '';
    if(a.media_url){
      media = /\.(mp4|webm|m3u8)(\?|$)/i.test(a.media_url)
        ? '<div class="cm-vwrap" onclick="openVideo(\''+escapeHtml(a.media_url)+'\')"><video class="cm-video" src="'+escapeHtml(a.media_url)+'" controls preload="metadata" playsinline></video></div>'
        : '<img class="cm-img" src="'+escapeHtml(a.media_url)+'" loading="lazy" alt="">';
    }
    return '<div class="cm-card cm-post cm-adpost">'+
      '<div class="cm-adhead"><svg viewBox="0 0 24 24" style="width:15px;height:15px;vertical-align:-3px;stroke:#9c27b0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:5px"><path d="M3 11 V15 H5 L9 19 V7 L5 11 Z"/><path d="M13 8 C15 9.5 15 14.5 13 16"/><path d="M17 5 C20.5 8 20.5 16 17 19"/></svg>Sponsored · TAC 廣告 · 曝光 '+a.impressions+'</div>'+
      '<div class="cm-body" style="font-weight:700;font-size:15px">'+escapeHtml(a.title)+'</div>'+
      (a.body?'<div class="cm-body">'+escapeHtml(a.body)+'</div>':'')+
      media+
      '<div class="cm-actions">'+
      '<button class="cm-act" onclick="adClick('+a.id+',\''+escapeHtml(a.target||'')+'\')"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#9c27b0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:4px"><path d="M4 12 H20 M14 6 L20 12 L14 18"/></svg>'+TAC_TE('了解更多')+'</button>'+
      '</div></div>';
  }
}
function trackImp(id){ try{ post('/api/community/ads/'+id+'/impression', {address:me}); }catch(e){} }
function adClick(id, target){ try{ post('/api/community/ads/'+id+'/click', {address:me}); }catch(e){} if(target){ window.open(target,'_blank'); } }
function refreshFollowBtns(){
  if(!me) return;
  get('/api/community/following?address='+encodeURIComponent(me)).then(function(d){
    var set = {};
    (d.items||[]).forEach(function(a){ set[a]=1; });
    document.querySelectorAll('.cm-follow').forEach(function(btn){
      var a = btn.getAttribute('data-a');
      if(!a) return;
      if(set[a]){ btn.classList.add('on'); btn.textContent = TAC_TE('已追蹤'); }
      else { btn.classList.remove('on'); btn.textContent = TAC_TE('追蹤'); }

function loadRewards(){

  get('/api/community/rewards?address='+encodeURIComponent(addr)).then(function(d){

  }

function uploadMedia(inp){
  if(!inp.files || !inp.files.length) return;
  var f = inp.files[0];
  if(f.size > 64*1024*1024){ alert('檔案超過 64MB 上限'); inp.value=''; return; }
  var fd = new FormData();
  fd.append('file', f);
  fetch('/api/upload', {method:'POST', body: fd})
    .then(function(r){ if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||r.status); }); return r.json(); })
    .then(function(d){
      window._cmMediaUrl = d.url;
      document.getElementById('cmMediaTag').textContent = f.name;
      var pv = document.getElementById('cmPreview');
      pv.innerHTML = (d.type.indexOf('video')>=0)
        ? '<video src="'+d.url+'" controls preload="metadata" playsinline></video>'
        : '<img src="'+d.url+'" alt="">';
      var kindSel = document.getElementById('postKindM');
      if(d.type.indexOf('video')>=0 && kindSel.value==='post'){ kindSel.value='video'; }
    })
    .catch(function(e){ document.getElementById('mMsg').textContent='上傳失敗：'+e; });
}
function closeComposer(){
  var inp = document.getElementById('compInput');
  var panel = document.getElementById('compPanel');
  var ed = document.getElementById('postContent');

}
function refreshAva(){

function publish(){
  if(!ensureMe()) return;
  var kind = document.getElementById('postKindM').value;
  var content = (document.getElementById('cmText').value||'').trim();
  var mediaUrl = (window._cmMediaUrl||'').trim();
  if(!content && !mediaUrl){ document.getElementById('mMsg').textContent='內容不可為空'; return; }
  if(kind==='market' && !(parseFloat(document.getElementById('postPriceM').value)>0)){ document.getElementById('mMsg').textContent='市集請填價格'; return; }
  if((kind==='video'||kind==='live') && !mediaUrl){ document.getElementById('mMsg').textContent='請先上傳圖片/影片'; return; }
  var pprice = kind==='market' ? (parseFloat(document.getElementById('postPriceM').value)||0) : null;
  var isVideo = (kind==='video'||kind==='live');
  post('/api/community/post', {address:me, kind:kind, content:content, image_url: (mediaUrl&&!isVideo)?mediaUrl:null, video_url: isVideo?mediaUrl:null, price_tacm:pprice})
    .then(function(){ closeModal(); refresh(); })
    .catch(function(e){ document.getElementById('mMsg').textContent='發布失敗：'+e; });
}
