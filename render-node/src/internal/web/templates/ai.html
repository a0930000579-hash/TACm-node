{% extends "base.html" %}
{% block title %}TACm AI{% endblock %}
{% block content %}
<div class="ai-app" id="aiApp">
  <!-- 頂部：品牌＋導覽回鏈上 -->
  <header class="ai-top">
    <div class="ai-brand">
      <svg class="ai-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v1a3 3 0 0 1 0 6v1a3 3 0 0 1-3 3h-1v1a4 4 0 0 1-8 0v-1H7a3 3 0 0 1-3-3v-1a3 3 0 0 1 0-6v-1a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/><circle cx="9.5" cy="11" r="1"/><circle cx="14.5" cy="11" r="1"/><path d="M9 15h6"/></svg>
      <div>
        <strong>TACm AI</strong>
        <span class="ai-sub" data-i18n="brand_sub">TAC AI 智能鏈助手</span>
      </div>
    </div>
    <div class="ai-top-actions">
      <button class="icon-btn" id="langBtn" type="button" aria-label="language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
      </button>
    </div>
  </header>

  <!-- 鏈上導覽列 -->
  <nav class="ai-nav" id="aiNav">
    <a href="/wallet"><span class="nav-ico">▣</span><span data-i18n="nav_wallet">錢包</span></a>
    <a href="/exchange"><span class="nav-ico">⇄</span><span data-i18n="nav_exchange">交易所</span></a>
    <a href="/dex"><span class="nav-ico">◈</span><span data-i18n="nav_dex">DEX</span></a>
    <a href="/defi"><span class="nav-ico">⬢</span><span data-i18n="nav_defi">DeFi</span></a>
    <a href="/explorer"><span class="nav-ico">◧</span><span data-i18n="nav_explorer">區塊瀏覽</span></a>
    <a href="/network"><span class="nav-ico">⛓</span><span data-i18n="nav_network">網路</span></a>
    <a href="/ai-market"><span class="nav-ico">✦</span><span data-i18n="nav_market">模型市場</span></a>
  </nav>

  <!-- 計費/用量條 -->
  <div class="ai-meter">
    <div class="meter-item">
      <span class="meter-lbl" data-i18n="meter_balance">TACm 餘額</span>
      <strong id="balanceVal">—</strong>
    </div>
    <div class="meter-item">
      <span class="meter-lbl" data-i18n="meter_turn">本輪費用</span>
      <strong id="turnFee">—</strong>
    </div>
    <div class="meter-item">
      <span class="meter-lbl" data-i18n="meter_total">累計費用</span>
      <strong id="totalFee">0.00</strong>
    </div>
  </div>

  <!-- 對話區 -->
  <main class="chat-box" id="chatBox">
    <div class="welcome" id="welcome">
      <svg class="welcome-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h2 data-i18n="welcome_title">我是 TACm AI</h2>
      <p data-i18n="welcome_desc">問我鏈上數據、DeFi，或請我寫程式、生成可下載檔案。</p>
      <div class="chips" id="suggestChips">
        <button type="button" class="chip" data-prompt="What is my TACm balance?">What is my TACm balance?</button>
        <button type="button" class="chip" data-prompt="Write a Go hello world and give me a downloadable file" data-i18n="chip_code">寫 Go 並給我下載檔</button>
        <button type="button" class="chip" data-prompt="What is the TAC price?">TAC price?</button>
      </div>
    </div>
  </main>

  <!-- 確認列 -->
  <div class="confirm-bar" id="confirmBar" hidden>
    <p data-i18n="confirm_note">這是寫操作，需明確確認才會執行。</p>
    <div class="confirm-actions">
      <button class="btn ghost" id="cancelBtn" type="button" data-i18n="cancel">取消</button>
      <button class="btn primary" id="confirmBtn" type="button" data-i18n="confirm">確認執行</button>
    </div>
  </div>

  <!-- 輸入區 -->
  <footer class="composer">
    <div class="composer-row">
      <button class="icon-btn file-toggle" id="fileModeBtn" type="button" aria-label="file mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      </button>
      <textarea id="messageInput" rows="1" data-i18n-ph="placeholder" placeholder="傳訊息給 TACm AI…"></textarea>
      <button class="send-btn" id="sendBtn" type="button" aria-label="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
    <p class="file-hint" id="fileHint" hidden data-i18n="file_hint">檔案模式：請描述要生成的檔案（名稱與語言）。</p>
  </footer>
</div>

<style>
:root{
  --bg:#0f1220; --panel:#171b2e; --panel2:#1f2540; --line:#2a3152;
  --text:#eef1ff; --muted:#9aa3c7; --brand:#5b7cff; --brand2:#8a6bff;
  --ok:#33d69f; --warn:#ffb648; --danger:#ff6b7a;
  --bubble-user:#2c3d7a; --bubble-bot:#1d2340;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation}
.ai-app{display:flex;flex-direction:column;height:100dvh;max-width:860px;margin:0 auto;position:relative}
.ai-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(15,18,32,.9);backdrop-filter:blur(8px)}
.ai-brand{display:flex;align-items:center;gap:10px}
.ai-logo{width:30px;height:30px;color:var(--brand)}
.ai-brand strong{display:block;font-size:16px}
.ai-sub{display:block;font-size:12px;color:var(--muted)}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{background:var(--brand);border-color:var(--brand)}
.ai-nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.ai-nav::-webkit-scrollbar{display:none}
.ai-nav a{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.ai-nav a:active{background:var(--brand);color:#fff}
.nav-ico{color:var(--brand);font-size:13px}
.ai-meter{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.meter-item{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.meter-lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.meter-item strong{font-size:15px}
.chat-box{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.welcome{margin:auto;text-align:center;color:var(--muted);max-width:420px}
.welcome-ico{width:54px;height:54px;color:var(--brand);margin-bottom:8px}
.welcome h2{color:var(--text);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.chip:active{background:var(--brand)}
.msg{display:flex;max-width:88%}
.msg.user{align-self:flex-end}
.msg.bot{align-self:flex-start;width:100%;max-width:100%}
.bubble{padding:12px 14px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--bubble-user);border-bottom-right-radius:6px}
.msg.bot .bubble{background:var(--bubble-bot);border:1px solid var(--line);border-bottom-left-radius:6px;width:100%}
.msg-meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center}
.code-block{background:#0b0e1c;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);background:#11152a}
.code-lang{font-size:11px;color:var(--muted);text-transform:uppercase}
.code-dl{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--brand);font-size:12px;cursor:pointer}
.code-dl svg{width:14px;height:14px}
.code-block pre{margin:0;padding:12px;overflow-x:auto;font-size:13px;line-height:1.5;font-family:"SF Mono",Menlo,Consolas,monospace}
.file-card{display:flex;align-items:center;gap:12px;background:#11152a;border:1px solid var(--brand);border-radius:12px;padding:11px 14px;margin-top:10px}
.file-card svg{width:26px;height:26px;color:var(--brand);flex:0 0 auto}
.file-info{flex:1;min-width:0}
.file-info strong{display:block;font-size:14px}
.file-info span{font-size:12px;color:var(--muted)}
.file-dl{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
.trace{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.trace summary{font-size:12px;color:var(--muted);cursor:pointer}
.trace-step{background:#0b0e1c;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:7px;font-size:12px}
.trace-step .k{color:var(--brand);font-weight:600}
.trace-step.err{border-color:var(--danger)}
.cite{margin-top:8px}
.cite a{color:var(--brand);font-size:12px;display:block;word-break:break-all}
.confirm-bar{padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
.confirm-bar p{margin:0 0 10px;font-size:13px;color:var(--warn)}
.confirm-actions{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.primary{background:var(--brand);color:#fff}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:11px 14px;font-size:15px;resize:none;max-height:120px;outline:none;font-family:inherit}
.send-btn{background:var(--brand);border:none;width:44px;height:44px;border-radius:12px;color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.send-btn svg{width:20px;height:20px}
.send-btn:disabled{opacity:.5}
.file-hint{margin:8px 4px 0;font-size:12px;color:var(--warn)}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (min-width:720px){.msg.bot{max-width:92%}}
</style>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var chat=$("chatBox"), input=$("messageInput"), sendBtn=$("sendBtn"),
      confirmBar=$("confirmBar"), confirmBtn=$("confirmBtn"), cancelBtn=$("cancelBtn"),
      balanceVal=$("balanceVal"), turnFee=$("turnFee"), totalFee=$("totalFee"),
      welcome=$("welcome"), fileModeBtn=$("fileModeBtn"), fileHint=$("fileHint");

  var I18N={
    en:{brand_sub:"TAC AI Smart Chain assistant",nav_wallet:"Wallet",nav_exchange:"Exchange",nav_dex:"DEX",nav_defi:"DeFi",nav_explorer:"Explorer",nav_network:"Network",nav_market:"Model Market",
      meter_balance:"TACm Balance",meter_turn:"Turn fee",meter_total:"Total fees",welcome_title:"I'm TACm AI",welcome_desc:"Ask about on-chain data, DeFi, or request code and downloadable files.",
      chip_code:"Write Go and give me a file",confirm_note:"This is a write action and needs explicit confirmation.",cancel:"Cancel",confirm:"Confirm",placeholder:"Message TACm AI…",file_hint:"File mode: describe the file (name and language)."},
    zh:{brand_sub:"TAC AI 智能鏈助手",nav_wallet:"錢包",nav_exchange:"交易所",nav_dex:"DEX",nav_defi:"DeFi",nav_explorer:"區塊瀏覽",nav_network:"網路",nav_market:"模型市場",
      meter_balance:"TACm 餘額",meter_turn:"本輪費用",meter_total:"累計費用",welcome_title:"我是 TACm AI",welcome_desc:"問我鏈上數據、DeFi，或請我寫程式、生成可下載檔案。",
      chip_code:"寫 Go 並給我下載檔",confirm_note:"這是寫操作，需明確確認才會執行。",cancel:"取消",confirm:"確認執行",placeholder:"傳訊息給 TACm AI…",file_hint:"檔案模式：請描述要生成的檔案（名稱與語言）。"}
  };
  var lang=(localStorage.getItem("titan_lang")||"zh");
  function applyLang(){
    var d=I18N[lang];
    document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=d[el.getAttribute("data-i18n")]});
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){el.setAttribute("placeholder",d[el.getAttribute("data-i18n-ph")])});
  }
  $("langBtn").addEventListener("click",function(){lang=(lang==="zh"?"en":"zh");localStorage.setItem("titan_lang",lang);applyLang()});
  applyLang();

  var sessionId="ai-"+(localStorage.getItem("tac_guest")||"anon");
  var pendingMessage="", fileMode=false, sessionTotal=0, busy=false;

  // ensureGuestAddr 回傳 Promise（非字串），同步呼叫會把 Promise 物件當 address 送出→bad_json。
  // 改為快取字串：啟動時先同步讀 localStorage，再用 Promise 補齊（首次訪客需伺服器發址）。
  var myAddr="";
  function readAddrSync(){
    try{var ex=localStorage.getItem('tac_ex_wallet');if(ex){var eo=JSON.parse(ex);
      if(eo&&eo.addr&&eo.addr.indexOf('tx0')===0)return eo.addr}}catch(e){}
    var a=localStorage.getItem('tac_guest_addr');
    return (a&&a.indexOf('tx0')===0)?a:"";
  }
  function initAddr(){
    myAddr=readAddrSync();
    if(window.ensureGuestAddr){ensureGuestAddr().then(function(a){
      myAddr=(a&&a.indexOf&&a.indexOf('tx0')===0)?a:readAddrSync();refreshBalance();
    }).catch(function(){})}
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

  var dlIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';

  function download(name,content,mime){
    var blob=new Blob([content],{type:mime||"text/plain"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
  }

  // 輕量渲染：文字＋fenced code blocks（每個附下載）。
  function renderRich(bubble,text){
    var parts=text.split(/```/);
    var html="";
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      if(i%2===1){
        var nl=p.indexOf("\n");
        var cl=nl>0?p.slice(0,nl).trim():"";
        var code=nl>0?p.slice(nl+1):p;
        var fname="snippet."+(cl||"txt");
        html+='<div class="code-block"><div class="code-head"><span class="code-lang">'+esc(cl||"text")+'</span>'+
          '<button class="code-dl" type="button" data-name="'+esc(fname)+'" data-code="'+esc(code)+'">'+dlIcon+' Download</button></div><pre>'+esc(code)+'</pre></div>';
      }else if(p.trim()){html+='<span>'+esc(p)+'</span>';}
    }
    bubble.innerHTML=html||esc(text);
    bubble.querySelectorAll(".code-dl").forEach(function(btn){
      btn.addEventListener("click",function(){download(btn.getAttribute("data-name"),btn.getAttribute("data-code"),"text/plain")});
    });
  }

  function addMsg(role,text){
    if(welcome){welcome.remove();welcome=null}
    var wrap=document.createElement("div");wrap.className="msg "+role;
    var bubble=document.createElement("div");bubble.className="bubble";
    if(role==="bot"){renderRich(bubble,text)}else{bubble.textContent=text}
    wrap.appendChild(bubble);chat.appendChild(wrap);
    chat.scrollTop=chat.scrollHeight;
    return wrap;
  }
  function addFileCard(wrap,file){
    var card=document.createElement("div");card.className="file-card";
    card.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'+
      '<div class="file-info"><strong>'+esc(file.filename)+'</strong><span>'+esc(file.language||"")+' · '+file.size+' B</span></div>';
    var a=document.createElement("a");a.className="file-dl";a.href=file.download_url;a.download=file.filename;a.textContent=(lang==="zh"?"下載":"Download");
    card.appendChild(a);wrap.appendChild(card);
  }
  function addMeta(wrap,model,trace,citations){
    var meta=document.createElement("div");meta.className="msg-meta";
    if(model){var m=document.createElement("span");m.textContent=model;meta.appendChild(m)}
    wrap.appendChild(meta);
    if(citations&&citations.length){
      var box=document.createElement("div");box.className="cite";
      citations.forEach(function(c){var a=document.createElement("a");a.href=c.url;a.target="_blank";a.rel="noopener";a.textContent=c.title||c.url;box.appendChild(a)});
      wrap.appendChild(box);
    }
    if(trace&&trace.length){
      var det=document.createElement("details");det.className="trace";
      var sum=document.createElement("summary");sum.textContent=(lang==="zh"?"推理軌跡 ("+trace.length+")":"Reasoning ("+trace.length+")");det.appendChild(sum);
      trace.forEach(function(st){
        var d=document.createElement("div");d.className="trace-step"+(st.error?" err":"");
        d.innerHTML='<span class="k">'+esc(st.kind)+(st.tool?" / "+esc(st.tool):"")+'</span> '+(st.error?esc(st.error):esc(st.thought||st.result||""));
        det.appendChild(d);
      });
      wrap.appendChild(det);
    }
  }
  function typing(){
    var wrap=addMsg("bot","");
    var b=wrap.querySelector(".bubble");b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    return wrap;
  }

  function refreshBalance(){
    var a=myAddr;if(!a){balanceVal.textContent="—";return}
    fetch("/api/wallet/info?address="+encodeURIComponent(a)).then(function(r){return r.json()}).then(function(j){
      if(j&&j.tacm!=null)balanceVal.textContent=j.tacm;
    }).catch(function(){balanceVal.textContent="—"});
  }

  function send(message,confirm){
    if(busy)return;busy=true;sendBtn.disabled=true;
    if(!confirm){addMsg("user",message);pendingMessage=message}
    var tw=typing();
    fetch("/api/ai/agent",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:message,address:myAddr,lang:lang,session_id:sessionId,confirm:!!confirm})})
      .then(function(r){return r.json().then(function(j){return{status:r.status,body:j}})})
      .then(function(res){
        tw.remove();
        var j=res.body||{};
        if(res.status>=400){addMsg("bot",j.error||("Error "+res.status));finish();return}
        var wrap=addMsg("bot",j.answer||"");
        // 計費顯示
        if(j.billing){
          turnFee.textContent=(j.billing.charged?j.billing.amount.toFixed(2):"—")+" TACm";
          if(j.billing.charged){sessionTotal+=j.billing.amount;totalFee.textContent=sessionTotal.toFixed(2)}
        }
        // 從 trace 找生成檔案
        (j.trace||[]).forEach(function(st){
          if(st.kind==="tool"&&st.tool==="create_file"&&!st.error&&st.args){
            var args=st.args;
            // 下載 URL 由後端工具結果帶（在 result 字串）；用 args 重建卡片，URL 從 result 解析
            var urlMatch=(st.result||"").match(/\/api\/ai\/file\/[A-Za-z0-9_]+/);
            var sizeMatch=(st.result||"").match(/(\d+) bytes/);
            addFileCard(wrap,{filename:args.filename,language:args.language,size:sizeMatch?sizeMatch[1]:0,download_url:urlMatch?urlMatch[0]:"#"});
          }
        });
        addMeta(wrap,j.model,j.trace,j.citations);
        if(j.needs_confirm){confirmBar.hidden=false}else{refreshBalance()}
        finish();
      }).catch(function(e){tw.remove();addMsg("bot","Network error: "+e.message);finish()});
  }
  function finish(){busy=false;sendBtn.disabled=false;chat.scrollTop=chat.scrollHeight}

  sendBtn.addEventListener("click",function(){go(false)});
  input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go(false)}});
  function go(confirm){
    var v=input.value.trim();if(!v||busy)return;input.value="";autoGrow();send(v,confirm);
  }
  confirmBtn.addEventListener("click",function(){confirmBar.hidden=true;send(pendingMessage,true)});
  cancelBtn.addEventListener("click",function(){confirmBar.hidden=true});
  document.querySelectorAll(".chip").forEach(function(c){c.addEventListener("click",function(){input.value=c.getAttribute("data-prompt");autoGrow()})});
  fileModeBtn.addEventListener("click",function(){fileMode=!fileMode;fileModeBtn.classList.toggle("on",fileMode);fileHint.hidden=!fileMode});
  function autoGrow(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px"}
  input.addEventListener("input",autoGrow);

  initAddr();
})();
</script>
{% endblock %}
