{% extends "base.html" %}
{% block title %}TAC Live · 直播{% endblock %}
{% block content %}
<div class="cm-top">
  <div class="cm-brand" onclick="location='/community'">TACm</div>
  <div class="cm-spacer"></div>
  <button class="cm-ic" onclick="location='/community'"><svg viewBox="0 0 24 24"><path d="M12 5 V19 M5 12 H19"/></svg></button>
  <button class="cm-ic" onclick="location='/community'"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/></svg></button>
  <button class="cm-ic" onclick="TAC_I18N.toggle()"><svg viewBox="0 0 24 24"><path d="M4 5 H17 M17 5 V18 M11 9 H20 V18 M7 18 C7 19.5 5.5 20 5 20 C4.5 20 4 19.5 4 18 C4 16.5 5.5 16 7 16 C8.5 16 10 16.5 10 18"/></svg></button>
</div>
<style>
  body { background:#f0f2f5; color:#1c1e21; }
  .container { background:transparent; }
  .topbar,.footer,.bottom-nav,.navlinks { display:none !important; }
  .cm-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid #e4e6eb;display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
  .cm-brand{font-weight:900;font-size:23px;color:#2e7d52;flex:none;cursor:pointer}
  .cm-spacer{flex:1}
  .cm-ic{width:38px;height:38px;border-radius:50%;background:#e4e6eb;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .cm-ic svg{width:20px;height:20px;stroke:#1c1e21;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cm-bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #dddfe2;display:flex;padding:5px 0 calc(5px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
  .cm-bottom a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;line-height:1.1;color:#65676b;text-decoration:none;white-space:nowrap;overflow:hidden}
  .cm-bottom a svg{width:21px;height:21px;stroke:#65676b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .lv-wrap{max-width:480px;margin:0 auto;padding-bottom:72px}
  .lv-card{background:#fff;border:1px solid #dddfe2;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
  .lv-card h2{margin:0 0 12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .lv-room{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e4e6eb;border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;transition:box-shadow .15s}
  .lv-room:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .lv-thumb{width:96px;height:62px;border-radius:10px;background:linear-gradient(135deg,#E41E3F,#ff8a80);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;position:relative;overflow:hidden}
  .lv-thumb svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
  .lv-thumb .lv-live{position:absolute;top:4px;left:4px;background:#fff;color:#e41e3f;font-size:9px;font-weight:900;border-radius:4px;padding:1px 5px}
  .lv-thumb.ended{background:linear-gradient(135deg,#9aa0a6,#c8cdd2)}
  .lv-meta{flex:1;min-width:0}
  .lv-meta .t{font-weight:700;font-size:14px;color:#1c1e21;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-meta .s{font-size:12px;color:#65676b;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lv-badge{background:#e41e3f;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
  .lv-badge i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:lvblink 1.2s infinite}
  .lv-badge.end{background:#9aa0a6}
  @keyframes lvblink{50%{opacity:.3}}
  .lv-form{display:flex;gap:8px;flex-wrap:wrap}
  .lv-form input{flex:1;min-width:160px;border:1px solid #dddfe2;border-radius:10px;padding:10px 12px;font-size:13px;background:#fff;color:#1c1e21;box-sizing:border-box}
  .lv-btn{background:#e41e3f;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer}
  .lv-btn.ghost{background:#f0f2f5;color:#65676b;border:1px solid #dddfe2}
  .lv-btn.green{background:#1b8a3a}
  .lv-room-view{display:flex;flex-direction:column;gap:12px}
  .lv-stage{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#E41E3F,#ff8a80);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff}
  .lv-stage svg{width:64px;height:64px;stroke:#fff;fill:none;stroke-width:1.8;opacity:.9}
  .lv-stage .title{position:absolute;left:12px;bottom:10px;font-weight:800;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .lv-stage .stat{position:absolute;right:12px;top:10px;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
  .lv-chat{background:#fff;border:1px solid #e4e6eb;border-radius:12px;padding:10px;height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .lv-msg{font-size:13px;line-height:1.5}
  .lv-msg b{color:#2e7d52}
  .lv-msg .tm{color:#a7a8aa;font-size:10px;margin-left:6px}
  .lv-send{display:flex;gap:8px;margin-top:8px}
  .lv-send input{flex:1;min-width:0;border:1px solid #dddfe2;border-radius:999px;padding:10px 14px;font-size:13px;background:#f0f2f5}
  .lv-send button{background:#2e7d52;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px}
  .lv-empty{color:#65676b;text-align:center;padding:30px 10px;font-size:13px}
</style>

<div class="lv-wrap">
  <!-- 列表視圖 -->
  <div id="lvList">
    <div class="lv-card">
      <h2><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg> 正在直播</h2>
      <div id="rooms"><div class="lv-empty">載入中…</div></div>
    </div>
    <div class="lv-card">
      <h2><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M2 12a15 15 0 0 1 20 0"/><path d="M5 15a10 10 0 0 1 14 0"/><circle cx="12" cy="19" r="1.5"/></svg> 我要開播</h2>
      <div class="lv-form">
        <input id="lvAddr" placeholder="wallet address (tx0…)" value="" readonly title="以錢包中心為準">
        <input id="lvTitle" placeholder="直播標題，例如：今晚一起挖礦聊幣市" value="">
        <button class="lv-btn" onclick="startLive()">開播</button>
      </div>
      <p id="lvMsg" style="font-size:12px;color:#65676b;margin:8px 0 0;word-break:break-all">—</p>
    </div>
  </div>

  <!-- 房間視圖 -->
  <div id="lvRoom" class="lv-room-view" style="display:none">
    <div class="lv-stage">
      <svg viewBox="0 0 64 64"><rect x="8" y="16" width="34" height="34" rx="6"/><path d="M42 28 L58 20 V46 L42 38" stroke-linejoin="round"/></svg>
      <div class="title" id="lvRoomTitle"></div>
      <div class="stat" id="lvRoomStat"></div>
    </div>
    <div class="lv-chat" id="lvChat"></div>
    <div class="lv-send">
      <input id="lvSend" placeholder="說點什麼…" onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">送出</button>
      <button class="lv-btn ghost" onclick="leaveRoom()">離開</button>
      <button class="lv-btn green" id="lvEndBtn" style="display:none" onclick="endLive()">結束直播</button>
    </div>
  </div>
</div>

<nav class="cm-bottom">
  <a href="/community"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 V21 H15 V14 H9 V21 H3 Z"/></svg><span>首頁</span></a>
  <a href="/community/videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg><span>影片</span></a>
  <a href="/community/friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20 C2.5 15.5 5 13 9 13 C13 13 15.5 15.5 15.5 20"/><circle cx="17" cy="9" r="2.8"/><path d="M16 13.5 C19 13.5 21.5 15.5 21.5 19"/></svg><span>好友</span></a>
  <a href="/community/market"><svg viewBox="0 0 24 24"><path d="M4 7 H20 L18.5 16 H5.5 Z"/><circle cx="9" cy="20" r="1.6"/><circle cx="15.5" cy="20" r="1.6"/><path d="M7 10 V6 C7 3.8 8.8 2.5 10.5 2.5 C12 2.5 13 3.6 13 5"/></svg><span>市集</span></a>
  <a href="/community/notifications"><svg viewBox="0 0 24 24"><path d="M12 3 C8 3 6 6 6 9.5 V15 L4 17 H20 L18 15 V9.5 C18 6 16 3 12 3 Z"/><path d="M9.5 20 C10 21.5 11 22 12 22 C13 22 14 21.5 14.5 20"/></svg><span>通知</span></a>
  <a href="/community/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 7.5 13.5 12 13.5 C16.5 13.5 20 16 20 21"/></svg><span>個人</span></a>
</nav>

<!-- 社群統一權威地址（比照交易所 v160 錢包中心） -->
<script src="/static/js/community-wallet.js"></script>
<script>
// M93：直播 — 列表 / 開播 / 聊天輪詢。
var curRoom = null, curAfter = 0, lvTimer = null;
var me = ''; // 身分＝權威地址（錢包中心為準），進頁由 cmBindAddr 解析填入。

function loadRooms(){
  return get('/api/live/list').then(function(d){
    var rooms = d.rooms || [];
    var el = document.getElementById('rooms');
    if(!rooms.length){ el.innerHTML = '<div class="lv-empty">目前沒有直播，快來開播第一場！</div>'; return; }
    el.innerHTML = rooms.map(function(r){
      var live = r.status==='live';
      return '<div class="lv-room" onclick="openRoom('+r.id+')">'+
        '<div class="lv-thumb'+(live?'':' ended')+'">'+(live?'<span class="lv-live">LIVE</span>':'')+
        '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11 L21 7.5 V16.5 L16 13"/></svg></div>'+
        '<div class="lv-meta"><div class="t">'+escapeHtml(r.title)+'</div>'+
        '<div class="s"><span class="lv-badge'+(live?'':' end')+'">'+(live?'<i></i>直播中':'已結束')+'</span><span>'+shortAddr(r.owner)+'</span><span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> '+r.viewers+'</span></div></div>'+
        '</div>';
    }).join('');
  }).catch(function(){ document.getElementById('rooms').innerHTML='<div class="lv-empty">載入失敗</div>'; });
}

function startLive(){
  var addr = me; // 身分＝權威地址（錢包中心為準）；lvAddr 僅顯示，不另採
  var title = document.getElementById('lvTitle').value.trim();
  if(!addr){ document.getElementById('lvMsg').textContent='請先於錢包中心選擇錢包地址'; return; }
  if(!title){ document.getElementById('lvMsg').textContent='請輸入直播標題'; return; }
  post('/api/live/create', {address:addr, title:title}).then(function(d){
    document.getElementById('lvMsg').textContent='';
    openRoom(d.room_id, addr);
  }).catch(function(e){ document.getElementById('lvMsg').textContent='開播失敗：'+e; });
}

function openRoom(id, ownerAddr){
  get('/api/live/list').then(function(d){
    var r = (d.rooms||[]).filter(function(x){ return x.id===id; })[0];
    if(!r) return;
    curRoom = id; curAfter = 0;
    document.getElementById('lvRoomTitle').textContent = r.title;
    document.getElementById('lvRoomStat').textContent = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px;" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> ' + r.viewers + ' 人在線';
    var isOwner = ownerAddr ? (ownerAddr===r.owner) : (me===r.owner);
    document.getElementById('lvEndBtn').style.display = isOwner ? '' : 'none';
    document.getElementById('lvSend').placeholder = '說點什麼…';
    document.getElementById('lvList').style.display = 'none';
    document.getElementById('lvRoom').style.display = '';
    pollChat(true);
  });
}

function pollChat(force){
  get('/api/live/'+curRoom+'/messages?after='+curAfter).then(function(d){
    var msgs = d.messages || [];
    if(!msgs.length && !force) return;
    var chat = document.getElementById('lvChat');
    msgs.forEach(function(m){
      curAfter = Math.max(curAfter, m.id);
      var div = document.createElement('div');
      div.className = 'lv-msg';
      div.innerHTML = '<b>'+shortAddr(m.address)+'</b> '+escapeHtml(m.body)+'<span class="tm">'+timeAgo(m.created_at)+'</span>';
      chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
  }).catch(function(){});
  if(lvTimer) clearInterval(lvTimer);
  lvTimer = setInterval(function(){ if(curRoom) pollChat(false); }, 3000);
}

function sendMsg(){
  var body = document.getElementById('lvSend').value.trim();
  if(!body || !curRoom) return;
  var addr = me; // 權威地址
  post('/api/live/'+curRoom+'/message', {address:addr, body:body}).then(function(){
    document.getElementById('lvSend').value='';
    pollChat(true);
  }).catch(function(e){ alert('發送失敗：'+e); });
}

function endLive(){
  var addr = me; // 權威地址
  post('/api/live/'+curRoom+'/end', {address:addr}).then(function(){
    leaveRoom();
  }).catch(function(e){ alert('結束失敗：'+e); });
}

function leaveRoom(){
  if(lvTimer) clearInterval(lvTimer);
  curRoom = null;
  document.getElementById('lvRoom').style.display = 'none';
  document.getElementById('lvList').style.display = '';
  loadRooms();
}

// 公用的 get/post/shortAddr/escapeHtml/timeAgo 取自全域（base.html 已提供）。
// M94：社群影片 tab 帶 ?room= 直接進房（直播不與社群脫鉤）。
// 進頁先解析權威地址（錢包中心為準）；有 ?room= 時解析後再進房。
cmBindAddr({
  input: '#lvAddr',
  onResolve: function(addr){
    me = addr;
    var q = new URLSearchParams(location.search).get('room');
    if(q){ loadRooms().then(function(){ openRoom(parseInt(q,10), addr); }); }
    else { loadRooms(); }
  }
});
</script>
{% endblock %}
