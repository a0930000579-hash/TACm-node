<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>節點架設者面板 · TAC Network</title>
<style>
  :root{--text:#1a1a2e;--muted:#7a7f93;--brand:#68BE8D;--brand2:#4f68d8;--bg:#f3f5fa;--card:#fff;--line:rgba(104,190,141,.25)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding:16px}
  .wrap{max-width:880px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:14px}
  .brand svg{width:22px;height:22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .panel-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .panel-head h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
  .muted{color:var(--muted);font-size:13px;margin:4px 0 10px}
  .chain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .cg{background:#f7faf9;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .cg small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .cg b{font-size:14px;word-break:break-all}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .form-row{margin:10px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .form-row input{flex:1;min-width:220px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
  .np-btn{display:inline-block;font-size:14px;font-weight:700;border-radius:12px;padding:11px 22px;text-decoration:none;cursor:pointer;background:var(--brand);color:#fff;border:none}
  .np-btn:hover{background:var(--brand2)}
  .np-msg{font-size:13px;color:var(--muted)}
  .badge{display:inline-block;background:#eef7f1;color:#2e7d5b;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  @media(max-width:600px){body{padding:10px}.panel{padding:16px}.chain-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>TAC<span style="color:var(--brand)">Chain</span> <span class="badge">節點面板</span></div>

  <section class="panel">
    <div class="panel-head"><h2>節點架設者面板</h2></div>
    <p class="muted">管理你的節點：綁定收款地址、查詢節點獎勵（coinbase:node 9%）、將獎勵提領轉入 TACm web3 錢包。操作需節點管理密碼。</p>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>節點狀態</h2></div>
    <div class="chain-grid">
      <div class="cg"><small>節點 ID</small><b id="pNodeId">—</b></div>
      <div class="cg"><small>節點位址</small><b class="mono" id="pNodeAddr">—</b></div>
      <div class="cg"><small>節點獎勵餘額（鏈上）</small><b id="pBalance">—</b></div>
      <div class="cg"><small>鏈高</small><b id="pHeight">—</b></div>
      <div class="cg"><small>綁定收款地址</small><b class="mono" id="pPayout">—</b></div>
      <div class="cg"><small>管理密碼</small><b id="pAdmin">—</b></div>
    </div>
  </section>

  <section class="panel" id="setupBox">
    <div class="panel-head"><h2>設置管理密碼</h2></div>
    <p class="muted">首次使用需設置管理密碼（至少 6 字元），保護綁定與提領操作。</p>
    <div class="form-row"><input type="password" id="adminPass" placeholder="管理密碼（至少 6 字元）" autocomplete="new-password"></div>
    <div class="form-row"><button class="np-btn" onclick="setupAdmin()">設置管理密碼</button> <span class="np-msg" id="setupMsg"></span></div>
  </section>

  <section class="panel" id="bindBox">
    <div class="panel-head"><h2>綁定收款地址</h2></div>
    <p class="muted">填寫你的 TACm web3 錢包地址（tx01…），節點獎勵提領將轉入此地址。</p>
    <div class="form-row"><input id="payoutAddr" placeholder="tx01…（TACm web3 錢包地址）" autocomplete="off"></div>
    <div class="form-row"><input type="password" id="bindPass" placeholder="管理密碼（操作驗證）" autocomplete="current-password"></div>
    <div class="form-row"><button class="np-btn" onclick="bindAddr()">綁定收款地址</button> <span class="np-msg" id="bindMsg"></span></div>
  </section>

  <section class="panel" id="wdBox">
    <div class="panel-head"><h2>提領節點獎勵</h2></div>
    <p class="muted">以節點私鑰簽名，把節點獎勵轉入綁定錢包（上鏈、可於區塊瀏覽器查詢）。</p>
    <div class="form-row"><input id="wdAmount" inputmode="decimal" placeholder="提領金額（TACm）" autocomplete="off"></div>
    <div class="form-row"><input type="password" id="wdPass" placeholder="管理密碼（操作驗證）" autocomplete="current-password"></div>
    <div class="form-row"><button class="np-btn" onclick="withdraw()">提領到綁定錢包</button> <span class="np-msg" id="wdMsg"></span></div>
  </section>
</div>

<script>
(function () {
  var box = function (sel) { return document.querySelector(sel); };
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  var show = function (sel, s) { box(sel).textContent = s; };
  var post = function (url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); });
  };
  window.__npAdminSet = false;
  function refresh() {
    fetch('/api/node/panel').then(function (r) { return r.json(); }).then(function (d) {
      window.__npAdminSet = !!d.admin_set;
      show('#pNodeId', esc(d.node_id));
      show('#pNodeAddr', esc(d.node_address));
      show('#pBalance', esc(d.balance) + ' TACm');
      show('#pHeight', esc(d.height));
      show('#pPayout', d.payout_address ? esc(d.payout_address) : '尚未綁定');
      show('#pAdmin', d.admin_set ? '已設置' : '未設置');
      box('#setupBox').style.display = d.admin_set ? 'none' : '';
      box('#bindPass').style.display = d.admin_set ? '' : 'none';
      box('#wdPass').style.display = d.admin_set ? '' : 'none';
      if (d.payout_address) { box('#payoutAddr').value = d.payout_address; }
    }).catch(function () { show('#pNodeId', '載入失敗'); });
  }
  window.setupAdmin = function () {
    var pass = box('#adminPass').value;
    post('/api/node/setup', { admin_pass: pass }).then(function (r) {
      show('#setupMsg', r.ok ? '已設置，請牢記管理密碼' : (r.j.message || '設置失敗'));
      if (r.ok) refresh();
    });
  };
  window.bindAddr = function () {
    if (!window.__npAdminSet) { show('#bindMsg', '請先設置管理密碼（上方設置區）'); return; }
    var pass = box('#bindPass').value, addr = box('#payoutAddr').value.trim();
    if (!pass) { show('#bindMsg', '請輸入管理密碼'); return; }
    post('/api/node/bind', { admin_pass: pass, payout_address: addr }).then(function (r) {
      show('#bindMsg', r.ok ? '綁定成功：' + addr : (r.j.message || '綁定失敗'));
      if (r.ok) refresh();
    });
  };
  window.withdraw = function () {
    if (!window.__npAdminSet) { show('#wdMsg', '請先設置管理密碼（上方設置區）'); return; }
    var pass = box('#wdPass').value, amt = box('#wdAmount').value.trim();
    if (!pass) { show('#wdMsg', '請輸入管理密碼'); return; }
    post('/api/node/withdraw', { admin_pass: pass, amount: amt }).then(function (r) {
      show('#wdMsg', r.ok ? '已提交上鏈：' + r.j.tx_hash : (r.j.message || '提領失敗'));
      if (r.ok) { box('#wdAmount').value = ''; refresh(); }
    });
  };
  refresh();
})();
</script>
</body>
</html>
