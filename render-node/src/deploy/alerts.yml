# 泰坦Ai Smart Chain — 告警規則（M143-C）
# 掛載於 prometheus.yml 的 rule_files；與 Alertmanager 搭配可推送郵件/群組。
# 關鍵監控對象：出塊停滯、P2P 對等節點歸零、交易池異常、磁碟空間、橋暫停。

groups:
  - name: tacm-chain
    rules:
      # 出塊停滯：鏈頂高度 90 秒未增長（block-time=1s 時異常；主網 60s 請調大至 300s）。
      - alert: TacmBlockStalled
        expr: |
          delta(tac_chain_height[90s]) == 0
            and on() (tac_chain_height > 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "區塊高度停滯"
          description: "鏈頂高度 {{ $value }} 已超過 2 分鐘未增長，出塊節點可能異常。"

      # 對等節點歸零：單錨點模式 peer=0 正常；多節點主網模式下應有 >0。
      - alert: TacmNoPeers
        expr: tac_node_peers == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P2P 對等節點歸零"
          description: "節點在線對等節點數為 0（多節點模式需檢查 P2P/seed 配置）。"

      # 交易池爆量：可能遭灌水或礦工停滯導致積壓。
      - alert: TacmMempoolSurge
        expr: tac_chain_mempool_size > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "交易池積壓異常"
          description: "交易池 {{ $value }} 筆超過 500，檢查灌水防護或出塊。"

      # 磁碟空間不足：資料目錄檔案系統可用空間 < 10%。
      - alert: TacmDiskLow
        expr: tac_node_disk_free_bytes / tac_node_disk_total_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "資料磁碟空間不足"
          description: "可用空間僅剩 {{ $value | humanizePercentage }}，請清理或擴容。"

      # 橋被緊急暫停：kill-switch 觸發（管理員操作，需追蹤原因）。
      - alert: TacmBridgePaused
        expr: tac_bridge_paused == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "跨鏈橋已被緊急暫停"
          description: "橋 kill-switch 已觸發，所有跨鏈操作已停止；請確認原因與恢復時機。"

      # 節點長時間離線（instance down 由 Prometheus 內建 up 指標處理，此為補充）。
      - alert: TacmNodeDown
        expr: up{job="tacm-anchor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "錨點節點離線"
          description: "節點 {{ $labels.instance }} 已 2 分鐘無法抓取。"
